<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ODDSEEDZ</title>
<meta property="og:title" content="ODDSEEDZ" />
<meta property="og:description" content="Raise a Buddy from a phrase, retire it to the Memory Meadow, then breed the next heir. Generations, not endings." />
<meta property="og:type" content="website" />
<meta property="og:image" content="/og.png" />
<style>
  :root {
    --navy-panel: rgba(24,36,88,0.96);
    --navy-text: #F4F0E2;
    --navy-bevel-lt: #2C3E78;
    --navy-bevel-dk: #0A1240;
    --navy-border: #1E2A4A;
    --gold: #F0C060;
    --red: #C04040;
    --shadow: #000;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: Tahoma, Verdana, sans-serif;
    font-weight: bold;
    color: var(--navy-text);
    background: repeating-linear-gradient(90deg, #101A3C 0 4px, #13205A 4px 8px);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  #game {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%;
    border: 0;
    background: #101A3C;
  }
  #error {
    position: fixed; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: rgba(6, 10, 28, 0.92);
  }
  #error[hidden] { display: none; }
  .error-panel {
    max-width: 520px; width: 100%; padding: 24px;
    background: var(--navy-panel);
    border: 3px solid var(--navy-border);
    box-shadow: inset 2px 2px 0 var(--navy-bevel-lt), inset -2px -2px 0 var(--navy-bevel-dk), 4px 4px 0 var(--shadow);
    text-align: center;
  }
  .error-panel h1 {
    margin: 0 0 12px; font-size: 22px; letter-spacing: 2px;
    color: var(--red);
  }
  .error-panel p {
    margin: 0 0 18px; font-size: 14px; line-height: 1.5;
    color: var(--navy-text);
  }
  .error-panel code {
    display: block; padding: 10px; margin-bottom: 18px;
    background: var(--navy-bevel-dk); color: var(--gold);
    border: 2px solid var(--navy-border);
    font-family: 'Courier New', monospace; font-size: 12px; word-break: break-all;
  }
  .error-panel button {
    padding: 10px 18px; cursor: pointer; font-size: 13px; letter-spacing: 1px;
    background: var(--gold); color: #1E2A4A;
    border: 2px solid #8A6018;
    box-shadow: inset 2px 2px 0 #FCE5A0, inset -2px -2px 0 #8A6018, 2px 2px 0 var(--shadow);
  }
</style>
</head>
<body>
<iframe id="game" title="ODDSEEDZ" allow="autoplay" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
<div id="error" hidden>
  <div class="error-panel">
    <h1>ODDSEEDZ CANNOT LOAD</h1>
    <p>The game frame is missing or unreachable. This should not happen — please tell the operator.</p>
    <code id="error-detail">unknown error</code>
    <button id="retry" type="button">Try again</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  const TARGET = '/game/';
  const iframe = document.getElementById('game');
  const errorBox = document.getElementById('error');
  const errorDetail = document.getElementById('error-detail');
  const retryBtn = document.getElementById('retry');

  function showError(message) {
    errorDetail.textContent = String(message);
    errorBox.hidden = false;
    iframe.removeAttribute('src');
  }

  async function probeAndLoad() {
    errorBox.hidden = true;
    try {
      // Sanity-check the target before committing the iframe to it.
      // A failed fetch (network, 404, 403, etc.) surfaces here as a loud message
      // instead of leaving the player staring at a blank navy rectangle.
      const res = await fetch(TARGET, { method: 'HEAD', mode: 'same-origin', cache: 'no-store' });
      if (!res.ok) {
        showError(TARGET + ' returned HTTP ' + res.status + ' ' + res.statusText);
        return;
      }
    } catch (err) {
      showError(TARGET + ' unreachable: ' + (err && err.message ? err.message : String(err)));
      return;
    }

    iframe.src = TARGET;
    iframe.onload = function () {
      try {
        const doc = iframe.contentDocument;
        if (!doc || !doc.body) {
          showError(TARGET + ' loaded but its document body is missing');
          return;
        }
        // A blank document means the target did not resolve to real game markup.
        if (doc.body.children.length === 0 && !doc.body.textContent.trim()) {
          showError(TARGET + ' resolved to an empty document');
          return;
        }
        errorBox.hidden = true;
      } catch (err) {
        // Cross-origin frames hide contentDocument. Same-origin deployment is
        // assumed; if the frame is cross-origin we cannot introspect it, but the
        // prior fetch probe already confirmed the resource exists.
        errorBox.hidden = true;
      }
    };
    iframe.onerror = function () {
      showError(TARGET + ' failed to load in the iframe');
    };
  }

  retryBtn.addEventListener('click', probeAndLoad);
  probeAndLoad();
})();
</script>
</body>
</html>
