<script>
// ===== src/config/feel.js =====
// feel.js — the NUMERIC FEEL TABLE (docs/STUDY.md §4), the tested contract.
//
// Every constant here is RE-DERIVED (the source revealed no movement/combat constants; see
// STUDY.md §3-§4). Changing a value without changing its assertion in test/feel.test.js is a
// defect. Units: one tick = 1/60 s (fixed timestep); positions in pixels; one tile = 16 px.

const FEEL = Object.freeze({
  // --- 4.1 Locomotion ---
  TICK_HZ: 60,
  TILE: 16,
  WALK_SPEED: 1.5,          // px/tick (90 px/s)
  GRAVITY: 0.375,           // px/tick²
  JUMP_VELOCITY: 6.0,       // px/tick (initial upward speed)
  TERMINAL_FALL: 8.0,       // px/tick (fall-speed cap)
  COYOTE_TICKS: 6,
  JUMP_BUFFER_TICKS: 6,

  // --- 4.2 Combat & defense windows ---
  HITSTUN_IFRAME_TICKS: 30,
  KNOCKBACK_IMPULSE: 3.0,   // px/tick
  KNOCKBACK_DECAY: 0.80,    // multiplicative /tick
  DODGE_IFRAME_TICKS: 8,
  DODGE_DISTANCE: 24,       // px (1.5 tiles)
  DODGE_DURATION_TICKS: 8,
  DODGE_COOLDOWN_TICKS: 20,

  // --- 4.3 Input leniency windows ---
  DOUBLE_TAP_TICKS: 12,
  CHARGE_FULL_TICKS: 24,
  CHARGE_MIN_TICKS: 6,
  INPUT_REPEAT_DELAY_TICKS: 16,
  INPUT_REPEAT_RATE_TICKS: 6,
});

// Derived quantities — computed from the primitives above so the relationships in STUDY.md §4.1
// are single-sourced. test/feel.test.js asserts these equal the documented apex/time values.
const DERIVED = Object.freeze({
  /** Seconds per tick. */
  TICK_DT: 1 / FEEL.TICK_HZ,
  /** Peak jump height on flat ground: v² / (2g). Documented = 48 px (3 tiles). */
  JUMP_APEX: (FEEL.JUMP_VELOCITY * FEEL.JUMP_VELOCITY) / (2 * FEEL.GRAVITY),
  /** Ticks from launch to apex: v / g. Documented = 16 ticks. */
  JUMP_TIME_TO_APEX: FEEL.JUMP_VELOCITY / FEEL.GRAVITY,
  /** Total airtime on flat ground: 2 × time-to-apex. Documented = 32 ticks. */
  JUMP_AIRTIME: (2 * FEEL.JUMP_VELOCITY) / FEEL.GRAVITY,
});


// ===== src/core/loop.js =====
// loop.js — fixed-timestep sim loop (DESIGN-SEED "STACK": deterministic seeded sim core,
// testable headless). The sim advances in whole fixed ticks decoupled from render frames, so a
// given (seed, input sequence) replays identically regardless of frame pacing.


/**
 * Create a fixed-timestep stepper.
 * @param {object} [opts]
 * @param {number} [opts.hz=FEEL.TICK_HZ] - sim ticks per second.
 * @param {number} [opts.maxStepsPerAdvance=8] - spiral-of-death clamp: never run more than this
 *   many sim ticks for a single advance() call, dropping excess accumulated time.
 */
function createFixedStepper({ hz = FEEL.TICK_HZ, maxStepsPerAdvance = 8 } = {}) {
  const dt = 1 / hz;
  let accumulator = 0;
  let tick = 0;

  return {
    dt,
    get tick() {
      return tick;
    },
    /**
     * Feed elapsed real seconds; runs whole sim ticks via stepFn(dt, tickIndex).
     * @returns {{steps:number, alpha:number, dropped:boolean}} steps run this call, render
     *   interpolation alpha in [0,1), and whether time was dropped by the clamp.
     */
    advance(elapsedSeconds, stepFn) {
      if (!(elapsedSeconds > 0)) elapsedSeconds = 0;
      accumulator += elapsedSeconds;
      let steps = 0;
      let dropped = false;
      while (accumulator >= dt) {
        if (steps >= maxStepsPerAdvance) {
          // Prevent the spiral of death: discard the backlog rather than run unbounded ticks.
          accumulator = 0;
          dropped = true;
          break;
        }
        stepFn(dt, tick);
        tick++;
        accumulator -= dt;
        steps++;
      }
      const alpha = accumulator / dt;
      return { steps, alpha, dropped };
    },
    /** Reset to a clean deterministic state (tick 0, empty accumulator). */
    reset() {
      accumulator = 0;
      tick = 0;
    },
  };
}

/** Convenience: seconds → whole ticks at the sim rate (floor). */
function secondsToTicks(seconds, hz = FEEL.TICK_HZ) {
  return Math.floor(seconds * hz);
}

/** Convenience: ticks → seconds at the sim rate. */
function ticksToSeconds(ticks, hz = FEEL.TICK_HZ) {
  return ticks / hz;
}



// ===== src/core/input.js =====
// input.js — device-agnostic input abstraction (DESIGN-SEED "STACK": keyboard+gamepad, remap
// scaffold). Raw devices resolve to SEMANTIC ACTIONS; the sim only ever sees actions, never keys.
// Mapping and per-tick state are pure and headless-testable; a thin browser adapter (src/render or
// main) feeds raw device state in. Leniency windows (double-tap, charge) come from the feel table.


/** Semantic actions the sim understands. Every kit verb + menu verb has one. */
const ACTIONS = Object.freeze({
  LEFT: 'left',
  RIGHT: 'right',
  UP: 'up',
  DOWN: 'down',
  JUMP: 'jump',
  ATTACK: 'attack',
  SUBWEAPON: 'subweapon',
  DODGE: 'dodge',
  MENU: 'menu',       // opens action menu (pauses)
  PAUSE: 'pause',
  CONFIRM: 'confirm',
  CANCEL: 'cancel',
});

const ACTION_LIST = Object.freeze(Object.values(ACTIONS));

// Default bindings. Keys are KeyboardEvent.code values. Pad buttons are standard-gamepad indices;
// pad axes map the left stick to the d-pad with a deadzone. All of this is remappable at runtime.
const DEFAULT_BINDINGS = Object.freeze({
  [ACTIONS.LEFT]:      { keys: ['ArrowLeft', 'KeyA'],  buttons: [14] },
  [ACTIONS.RIGHT]:     { keys: ['ArrowRight', 'KeyD'], buttons: [15] },
  [ACTIONS.UP]:        { keys: ['ArrowUp', 'KeyW'],    buttons: [12] },
  [ACTIONS.DOWN]:      { keys: ['ArrowDown', 'KeyS'],  buttons: [13] },
  [ACTIONS.JUMP]:      { keys: ['KeyK', 'Space'],      buttons: [0] },  // A
  [ACTIONS.ATTACK]:    { keys: ['KeyJ'],               buttons: [2] },  // X
  [ACTIONS.SUBWEAPON]: { keys: ['KeyL'],               buttons: [3] },  // Y
  [ACTIONS.DODGE]:     { keys: ['KeyH', 'ShiftLeft'],  buttons: [1] },  // B (single-button dodge alt)
  [ACTIONS.MENU]:      { keys: ['Enter'],              buttons: [9] },  // Start
  [ACTIONS.PAUSE]:     { keys: ['Escape'],             buttons: [8] },  // Select
  [ACTIONS.CONFIRM]:   { keys: ['KeyK', 'Enter'],      buttons: [0] },
  [ACTIONS.CANCEL]:    { keys: ['KeyH', 'Escape'],     buttons: [1] },
});

const AXIS_DEADZONE = 0.5;

/** Deep-clone the default bindings into a mutable bindings object. */
function cloneBindings(src = DEFAULT_BINDINGS) {
  const out = {};
  for (const action of ACTION_LIST) {
    const b = src[action] || { keys: [], buttons: [] };
    out[action] = { keys: [...b.keys], buttons: [...b.buttons] };
  }
  return out;
}

/** Rebind an action's keyboard keys (remap). Returns the bindings for chaining. */
function setKeyBinding(bindings, action, keys) {
  if (bindings[action]) bindings[action].keys = [...keys];
  return bindings;
}

/** Rebind an action's gamepad buttons (remap). */
function setPadBinding(bindings, action, buttons) {
  if (bindings[action]) bindings[action].buttons = [...buttons];
  return bindings;
}

/** Serialize bindings to a plain JSON-safe object for persistence. */
function serializeBindings(bindings) {
  const out = {};
  for (const action of ACTION_LIST) {
    const b = bindings[action] || { keys: [], buttons: [] };
    out[action] = { keys: [...b.keys], buttons: [...b.buttons] };
  }
  return out;
}

/** Load bindings from a serialized object, filling any missing/invalid action from the defaults. */
function loadBindings(obj) {
  const out = cloneBindings(DEFAULT_BINDINGS);
  if (obj && typeof obj === 'object') {
    for (const action of ACTION_LIST) {
      const b = obj[action];
      if (b && Array.isArray(b.keys) && Array.isArray(b.buttons)) {
        out[action] = { keys: [...b.keys], buttons: [...b.buttons] };
      }
    }
  }
  return out;
}

/**
 * Resolve raw device state into the set of currently-active actions.
 * @param {object} raw
 * @param {Set<string>|string[]} [raw.keys] - KeyboardEvent.code values currently held.
 * @param {{buttons?:boolean[], axes?:number[]}} [raw.pad] - a standard gamepad snapshot.
 * @param {object} [bindings=DEFAULT_BINDINGS]
 * @returns {Set<string>} active ACTIONS values.
 */
function resolveActions(raw = {}, bindings = DEFAULT_BINDINGS) {
  const keys = raw.keys instanceof Set ? raw.keys : new Set(raw.keys || []);
  const pad = raw.pad || null;
  const active = new Set();

  for (const action of ACTION_LIST) {
    const b = bindings[action];
    if (!b) continue;
    let on = false;
    for (const k of b.keys) {
      if (keys.has(k)) { on = true; break; }
    }
    if (!on && pad && pad.buttons) {
      for (const idx of b.buttons) {
        if (pad.buttons[idx]) { on = true; break; }
      }
    }
    if (on) active.add(action);
  }

  // Left analog stick → d-pad, with a deadzone. Additive to button/key input above.
  if (pad && pad.axes) {
    const [ax = 0, ay = 0] = pad.axes;
    if (ax <= -AXIS_DEADZONE) active.add(ACTIONS.LEFT);
    if (ax >= AXIS_DEADZONE) active.add(ACTIONS.RIGHT);
    if (ay <= -AXIS_DEADZONE) active.add(ACTIONS.UP);
    if (ay >= AXIS_DEADZONE) active.add(ACTIONS.DOWN);
  }
  return active;
}

/**
 * Per-action input state with edge detection and leniency windows. Fed one active-action set per
 * sim tick; queried by the sim in the same tick.
 */
function createInputState() {
  const state = {};
  for (const action of ACTION_LIST) {
    state[action] = {
      down: false,
      pressTick: -1,
      releaseTick: -1,
      heldTicks: 0,
      releaseHeldTicks: 0,
      lastPressTick: -Infinity,
      doubleTapTick: -1,
    };
  }
  let currentTick = -1;

  return {
    /** Advance state for one tick given the active-action set. */
    update(active, tick) {
      currentTick = tick;
      const set = active instanceof Set ? active : new Set(active || []);
      for (const action of ACTION_LIST) {
        const s = state[action];
        const isDown = set.has(action);
        if (isDown && !s.down) {
          // press edge
          if (tick - s.lastPressTick <= FEEL.DOUBLE_TAP_TICKS) s.doubleTapTick = tick;
          s.lastPressTick = tick;
          s.pressTick = tick;
          s.heldTicks = 1;
        } else if (isDown && s.down) {
          s.heldTicks++;
        } else if (!isDown && s.down) {
          // release edge
          s.releaseTick = tick;
          s.releaseHeldTicks = s.heldTicks;
          s.heldTicks = 0;
        }
        s.down = isDown;
      }
    },
    isDown: (a) => state[a].down,
    /** True only on the tick the action was pressed. */
    pressed: (a) => state[a].pressTick === currentTick,
    /** True only on the tick the action was released. */
    released: (a) => state[a].releaseTick === currentTick,
    /** Consecutive ticks currently held (0 if up). */
    heldTicks: (a) => (state[a].down ? state[a].heldTicks : 0),
    /** True only on the tick a qualifying double-tap completed. */
    doubleTapped: (a) => state[a].doubleTapTick === currentTick,
    /**
     * Charge amount 0..1 while held, clamped between CHARGE_MIN and CHARGE_FULL. 0 below the min
     * threshold (a quick press is a normal strike, not a charge).
     */
    chargeRatio(a) {
      const held = state[a].down ? state[a].heldTicks : 0;
      if (held < FEEL.CHARGE_MIN_TICKS) return 0;
      return Math.min(1, held / FEEL.CHARGE_FULL_TICKS);
    },
    /** Held-tick count captured at the moment of release (for release-timed charges). */
    releaseHeldTicks: (a) => state[a].releaseHeldTicks,
    /** Raw state access for tests/debug. */
    _peek: (a) => ({ ...state[a] }),
  };
}


// ===== src/render/canvas.js =====
// canvas.js — the 240p canvas pipeline (DESIGN-SEED: 240p-ish logical resolution, chunky readable
// pixels). Everything renders to a fixed 256×240 logical backbuffer, then integer-scales to the
// display with nearest-neighbor and letterboxing so pixels stay square at any window size. The
// scale math is pure and tested; the DOM wiring is a thin browser-only wrapper.

const LOGICAL_W = 256;
const LOGICAL_H = 240;

/**
 * Largest integer scale that fits the logical frame in the display, plus centering offsets.
 * @returns {{scale:number, offsetX:number, offsetY:number, drawW:number, drawH:number}}
 */
function computeIntegerScale(displayW, displayH, logicalW = LOGICAL_W, logicalH = LOGICAL_H) {
  const scale = Math.max(1, Math.floor(Math.min(displayW / logicalW, displayH / logicalH)));
  const drawW = logicalW * scale;
  const drawH = logicalH * scale;
  const offsetX = Math.floor((displayW - drawW) / 2);
  const offsetY = Math.floor((displayH - drawH) / 2);
  return { scale, offsetX, offsetY, drawW, drawH };
}

/**
 * Wire a display <canvas> to a 256×240 logical backbuffer. Browser-only (needs a real canvas).
 * @param {HTMLCanvasElement} displayCanvas
 * @param {object} [opts]
 * @param {Document} [opts.doc=document] - for creating the offscreen buffer.
 */
function createRenderer(displayCanvas, { doc = (typeof document !== 'undefined' ? document : null) } = {}) {
  if (!doc) throw new Error('createRenderer requires a document (browser only)');
  const buffer = doc.createElement('canvas');
  buffer.width = LOGICAL_W;
  buffer.height = LOGICAL_H;
  // The ratified light compositor performs exactly one bounded readback per logical frame.
  // This hint keeps browsers on the readback-friendly Canvas2D path.
  const ctx = buffer.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;

  const display = displayCanvas.getContext('2d');
  display.imageSmoothingEnabled = false;

  function resize(displayW, displayH) {
    displayCanvas.width = displayW;
    displayCanvas.height = displayH;
    display.imageSmoothingEnabled = false;
  }

  function present() {
    const { scale, offsetX, offsetY } = computeIntegerScale(displayCanvas.width, displayCanvas.height);
    display.imageSmoothingEnabled = false;
    display.fillStyle = '#000';
    display.fillRect(0, 0, displayCanvas.width, displayCanvas.height);
    display.drawImage(buffer, 0, 0, LOGICAL_W, LOGICAL_H, offsetX, offsetY, LOGICAL_W * scale, LOGICAL_H * scale);
  }

  return { ctx, buffer, resize, present, LOGICAL_W, LOGICAL_H };
}


// ===== src/render/palette.js =====
// palette.js — the global art palette (DESIGN-SEED art law + M12-ART register). ONE disciplined
// palette, code-drawn only. The register is "dark, somewhat-medieval 8-bit, gothic/DS1-feeling":
// dark desaturated bases (cool stone greys, moss greens, dried-blood umbers) plus a few deliberate
// warm accents (torch amber, sickly green, pale bone). Every hue is authored as a 3-4 shade RAMP so
// art can cluster-shade from one light direction instead of flat-filling. All art indexes into this
// one table by single-char key ('.' = transparent); the ramp structure below is the discipline.
//
// Key layout keeps every historically-used key ('0'-'9','a'-'i') live so older art still parses;
// M12 adds the extra ramp shades on 'j'-'v'. ~26 drawable colors, organized as 8 ramps.

/** Named palette entries. Keys are single chars usable directly in pixel-grid strings. */
const PALETTE = Object.freeze({
  '.': null,          // transparent
  '0': '#000000',     // ink black — 1px outlines, deepest shadow

  // Stone ramp (cool desaturated blue-grey) — walls, armor, UI chrome, bone-cold shadow.
  '1': '#14151e',     //  stone[0] shadow / near-black
  '8': '#23242f',     //  stone[1] dark
  '7': '#3c3f4d',     //  stone[2] mid
  '6': '#5c6070',     //  stone[3] light
  '4': '#8b90a6',     //  stone[4] highlight
  '5': '#ffffff',     //  specular white (rim light, eyes)

  // Bone ramp (warm off-white) — skulls, parchment UI, pale flesh, exposed bone.
  j: '#e6dcbf',       //  bone[3] parchment light
  k: '#b8ab86',       //  bone[2] mid
  l: '#7f7357',       //  bone[1] shadow

  // Umber / dried-blood ramp — wood, dirt, leather, rusted iron.
  '9': '#2c1a17',     //  umber[0] shadow (near-black brown)
  m: '#4a2c22',       //  umber[1] dark wood
  a: '#7a4a2e',       //  umber[2] mid
  n: '#a9683a',       //  umber[3] light
  b: '#d59a4a',       //  umber[4] / torch amber highlight

  // Blood ramp (desaturated red accent) — gore, boss tells, danger.
  f: '#4a1c1c',       //  blood[0] dark clot
  g: '#a83232',       //  blood[1] red
  o: '#d8524a',       //  blood[2] bright arterial

  // Torch / gold ramp (warm accent light) — flame, brazier glow, gold, gleam.
  c: '#f0c84a',       //  torch[2] bright gold
  p: '#fff0b0',       //  torch[3] pale flare

  // Moss / sickly green ramp — greenery, vines, ghoul flesh, poison.
  d: '#27341f',       //  moss[0] shadow
  e: '#3f5a2c',       //  moss[1] mid
  q: '#6a8f3e',       //  moss[2] light
  r: '#9cc45e',       //  moss[3] sickly highlight

  // Night / cold-blue ramp — sky, spectral glow, crypt air, marker.
  '2': '#181a30',     //  night[0] deep
  '3': '#2c335c',     //  night[1] mid
  t: '#4a5488',       //  night[2] light
  u: '#8fa0d8',       //  night[3] spectral pale

  // Arcane purple ramp — runes, unique glints, corrupt flesh.
  i: '#3a2854',       //  arcane[0] dark
  v: '#6a4a8f',       //  arcane[1] mid
  h: '#c98fb0',       //  arcane[2] / pale flesh-pink
});

/**
 * The register as ordered ramps, dark→light. Art and the environment layer pick shades from these
 * so shading stays consistent (one light direction) and stages can retune by referencing a ramp
 * rather than a raw hex. Each value is a palette key resolvable through PALETTE.
 */
const RAMPS = Object.freeze({
  stone: ['1', '8', '7', '6', '4'],
  bone: ['l', 'k', 'j'],
  umber: ['9', 'm', 'a', 'n', 'b'],
  blood: ['f', 'g', 'o'],
  torch: ['b', 'c', 'p'],
  moss: ['d', 'e', 'q', 'r'],
  night: ['2', '3', 't', 'u'],
  arcane: ['i', 'v', 'h'],
});

/**
 * Pick a shade from a named ramp by level. Level clamps into range; fractional levels (0..1) are
 * supported when |level| <= 1 and the ramp has >2 entries, mapping across the whole ramp. Pure.
 * @param {keyof typeof RAMPS} name
 * @param {number} level - integer index, or a 0..1 fraction across the ramp
 * @returns {string} palette key
 */
function shade(name, level) {
  const ramp = RAMPS[name];
  if (!ramp) throw new Error(`shade: unknown ramp '${name}'`);
  let idx;
  if (level > 0 && level < 1) idx = Math.round(level * (ramp.length - 1));
  else idx = Math.round(level);
  idx = Math.max(0, Math.min(ramp.length - 1, idx));
  return ramp[idx];
}

/**
 * Per-stage sub-palettes (DIRECTIONS M12: "each stage gets a named sub-palette while sharing the
 * global ramp discipline"). A theme retunes only the environmental dressing/backdrop accent picks —
 * it never introduces off-palette colors, it just chooses which shared keys the stage leans on.
 * `backdrop` is a clean far→horizon three-tone field; `far`/`near` separate the two architectural
 * silhouette depths. `ground`/`groundHi` shade fallback tiles while `tileAsset` selects the curated
 * Willibab face and `tileWash`/`edge` keep each stage distinct. `dressing` lists legal props.
 */
const THEMES = Object.freeze({
  cemetery: {
    name: 'cemetery green-grey',
    sky: ['2', '1'], ground: '7', groundDark: '8', groundHi: '6',
    backdrop: ['1', '2', '3'], gap: '1', far: '2', near: '1',
    tileAsset: 'env_tile_cemetery', tileWash: 'd', edge: 'q',
    moss: 'e', accent: 'q', torch: 'c',
    dressing: ['grass', 'gravestone', 'moss', 'brokenArch'],
    enemySkins: { walker: 'zombie', hopper: 'slime_spiked' },
    lightRig: {
      hero: { ambient: 'd', tint: 'u', shade: 0.11, grain: 0.10, tintStrength: 0.035, seed: 83 },
      key: { color: 'u', x: 0.78, y: 0.18, radiusX: 250, radiusY: 210, strength: 0.11 },
      vignette: { color: '2', amount: 0.56 },
    },
  },
  crypt: {
    name: 'crypt blue-black',
    sky: ['1', '0'], ground: '8', groundDark: '1', groundHi: '7',
    backdrop: ['0', '1', '2'], gap: '0', far: '8', near: '1',
    tileAsset: 'env_tile_crypt', tileWash: '2', edge: 't',
    moss: 'd', accent: 't', torch: 'c',
    dressing: ['moss', 'gargoyle', 'brokenArch', 'skull'],
    enemySkins: { walker: 'zombslime', hopper: 'bat' },
    lightRig: {
      hero: { ambient: '2', tint: 'u', shade: 0.16, grain: 0.12, tintStrength: 0.035, seed: 97 },
      shaft: { color: 'u', x0: 0.43, x1: 0.49, w0: 10, w1: 30, strength: 0.065, seed: 9 },
      vignette: { color: '2', amount: 0.68 },
    },
  },
  keep: {
    name: 'keep umber',
    sky: ['9', '1'], ground: 'm', groundDark: '9', groundHi: 'a',
    backdrop: ['1', '9', 'm'], gap: '1', far: '9', near: '1',
    tileAsset: 'env_tile_keep', tileWash: '9', edge: 'b',
    moss: 'd', accent: 'b', torch: 'c',
    dressing: ['grass', 'vine', 'banner', 'brokenArch', 'torch'],
    enemySkins: { walker: 'bones_gladiator', hopper: 'rat' },
    lightRig: {
      hero: { ambient: '9', tint: 'b', shade: 0.10, grain: 0.09, tintStrength: 0.028, seed: 109 },
      key: { color: 't', x: 0.50, y: 0.28, radiusX: 176, radiusY: 156, strength: 0.035 },
      vignette: { color: '9', amount: 0.62 },
    },
  },
});

/** Resolve a stage node id or explicit theme name to a THEMES entry (default cemetery). */
function themeFor(name) {
  return THEMES[name] || THEMES.cemetery;
}

/** Ordered list of drawable (non-transparent) palette keys, for tooling. */
const PALETTE_KEYS = Object.freeze(Object.keys(PALETTE).filter((k) => PALETTE[k] !== null));

/** Parse a "#rrggbb" hex string into [r,g,b]. */
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 0xff, (n >> 8) & 0xff, n & 0xff];
}

/** Resolve a palette key to [r,g,b,a]; transparent → alpha 0. */
function rgbaOf(key) {
  const hex = PALETTE[key];
  if (hex == null) return [0, 0, 0, 0];
  const [r, g, b] = hexToRgb(hex);
  return [r, g, b, 255];
}

/** WCAG relative luminance of a palette key (0..1). */
function relativeLuminance(key) {
  const hex = PALETTE[key];
  if (hex == null) return 0;
  const [r, g, b] = hexToRgb(hex).map((v) => v / 255).map((v) => (
    v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4
  ));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

/** Contrast ratio of two palette keys (1..21). */
function contrastRatio(fgKey, bgKey) {
  const fg = relativeLuminance(fgKey) + 0.05;
  const bg = relativeLuminance(bgKey) + 0.05;
  return Math.max(fg, bg) / Math.min(fg, bg);
}


// ===== src/sim/tilemap.js =====
// tilemap.js — the stage tile grid (DESIGN-SEED M3: tiles for stage 1). A stage is authored as an
// array of equal-length rows of legend chars; the map exposes solid queries by tile and by world
// pixel. Purely data + queries, headless-testable. Rendering + spawns layer on top.


// Tile legend. Empty/air is '.', solid ground/wall is '#'. Non-solid marker tiles ('p' player
// spawn, 'x' exit, digits for spawn points) are read by the stage loader, not by collision.
const SOLID_TILES = Object.freeze(new Set(['#', '=']));

/**
 * @param {string[]} rows - equal-length legend rows (top row = y 0).
 * @param {object} [opts]
 * @param {number} [opts.tileSize=FEEL.TILE]
 */
function createTilemap(rows, { tileSize = FEEL.TILE } = {}) {
  if (!Array.isArray(rows) || rows.length === 0) throw new Error('tilemap: empty');
  const w = rows[0].length;
  for (const r of rows) if (r.length !== w) throw new Error('tilemap: ragged rows');
  const h = rows.length;

  const get = (tx, ty) => (ty >= 0 && ty < h && tx >= 0 && tx < w ? rows[ty][tx] : '.');
  const solidAt = (tx, ty) => SOLID_TILES.has(get(tx, ty));

  return {
    rows: [...rows],
    w,
    h,
    tileSize,
    worldWidth: w * tileSize,
    worldHeight: h * tileSize,
    get,
    solidAt,
    /** Solid query at a world-pixel position. */
    solidAtPx(px, py) {
      return solidAt(Math.floor(px / tileSize), Math.floor(py / tileSize));
    },
    /** All (tx,ty,ch) cells matching a predicate — for the stage loader to find spawns/exit. */
    findCells(pred) {
      const out = [];
      for (let ty = 0; ty < h; ty++) {
        for (let tx = 0; tx < w; tx++) {
          const ch = rows[ty][tx];
          if (pred(ch, tx, ty)) out.push({ tx, ty, ch, x: tx * tileSize, y: ty * tileSize });
        }
      }
      return out;
    },
  };
}


// ===== src/sim/collision.js =====
// collision.js — per-axis AABB-vs-tile resolution (DESIGN-SEED M3: real tile collision replacing
// the M2 flat ground). Boxes are top-left {x,y,w,h} in world pixels. Resolve X then Y (the standard
// order that avoids corner snags). Pure and deterministic — the headless stage-clear bot relies on
// it reproducing exactly.

const EPS = 1e-6;

/** Tile-row range [t0, t1] inclusive that a [lo, hi) pixel span covers. */
function tileRange(lo, hi, tileSize) {
  return [Math.floor(lo / tileSize), Math.floor((hi - EPS) / tileSize)];
}

/** Resolve horizontal movement; mutates box.x. Sweeps crossed columns. Returns true on wall hit. */
function resolveMoveX(box, dx, tilemap) {
  if (dx === 0) return false;
  const ts = tilemap.tileSize;
  const oldX = box.x;
  box.x += dx;
  const [ty0, ty1] = tileRange(box.y, box.y + box.h, ts);
  if (dx > 0) {
    const from = Math.floor((oldX + box.w) / ts);
    const to = Math.floor((box.x + box.w - EPS) / ts);
    for (let tx = from; tx <= to; tx++) {
      for (let ty = ty0; ty <= ty1; ty++) {
        if (tilemap.solidAt(tx, ty)) { box.x = tx * ts - box.w; return true; }
      }
    }
  } else {
    const from = Math.floor(oldX / ts);
    const to = Math.floor(box.x / ts);
    for (let tx = from; tx >= to; tx--) {
      for (let ty = ty0; ty <= ty1; ty++) {
        if (tilemap.solidAt(tx, ty)) { box.x = (tx + 1) * ts; return true; }
      }
    }
  }
  return false;
}

/**
 * Resolve vertical movement; mutates box.y. Sweeps crossed rows.
 * @returns {{hit:boolean, onGround:boolean, hitCeiling:boolean}}
 */
function resolveMoveY(box, dy, tilemap) {
  if (dy === 0) return { hit: false, onGround: false, hitCeiling: false };
  const ts = tilemap.tileSize;
  const oldY = box.y;
  box.y += dy;
  const [tx0, tx1] = tileRange(box.x, box.x + box.w, ts);
  if (dy > 0) {
    const from = Math.floor((oldY + box.h) / ts);
    const to = Math.floor((box.y + box.h - EPS) / ts);
    for (let ty = from; ty <= to; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        if (tilemap.solidAt(tx, ty)) { box.y = ty * ts - box.h; return { hit: true, onGround: true, hitCeiling: false }; }
      }
    }
  } else {
    const from = Math.floor(oldY / ts);
    const to = Math.floor(box.y / ts);
    for (let ty = from; ty >= to; ty--) {
      for (let tx = tx0; tx <= tx1; tx++) {
        if (tilemap.solidAt(tx, ty)) { box.y = (ty + 1) * ts; return { hit: true, onGround: false, hitCeiling: true }; }
      }
    }
  }
  return { hit: false, onGround: false, hitCeiling: false };
}

/**
 * Move a box by (dx,dy) with full tile collision, X then Y.
 * @returns {{hitX:boolean, onGround:boolean, hitCeiling:boolean}}
 */
function moveAndCollide(box, dx, dy, tilemap) {
  const hitX = resolveMoveX(box, dx, tilemap);
  const y = resolveMoveY(box, dy, tilemap);
  return { hitX, onGround: y.onGround, hitCeiling: y.hitCeiling };
}

/** True if a solid tile sits directly beneath the box (grounded check independent of motion). */
function isGrounded(box, tilemap) {
  const ts = tilemap.tileSize;
  const [tx0, tx1] = tileRange(box.x, box.x + box.w, ts);
  const ty = Math.floor((box.y + box.h + EPS) / ts);
  for (let tx = tx0; tx <= tx1; tx++) if (tilemap.solidAt(tx, ty)) return true;
  return false;
}


// ===== src/sim/player.js =====
// player.js — player locomotion physics (DESIGN-SEED M2: movement/jump tuned to the feel notes).
// Pure, deterministic, fixed-timestep: one call = one sim tick (dt is 1 tick; velocities are
// px/tick, positions px). Collision here is a flat ground plane at groundY — real tile collision
// arrives with the stage work (M3). All constants come from the tested feel table so movement can
// never silently drift from docs/STUDY.md §4.


const FACING = Object.freeze({ LEFT: -1, RIGHT: 1 });

/** Default player collision half-extents (16×24 body). */
const PLAYER_HALF = Object.freeze({ halfW: 8, halfH: 12 });

/** Create a player physics state at (x, y) standing on the ground plane. */
function createPlayer(x = 0, y = 0) {
  return {
    x,
    y,
    vx: 0,
    vy: 0,
    onGround: false,
    facing: FACING.RIGHT,
    coyote: 0,        // ticks of coyote grace remaining
    jumpBuffer: 0,    // ticks of buffered jump remaining
    jumping: false,   // currently in a jump ascent (for jump-cut)
    dodging: 0,       // ticks of dodge dash remaining (also the i-frame window)
    dodgeCooldown: 0, // ticks until dodge is available again
    dodgeDir: FACING.RIGHT,
    airJumpUsed: false, // item-granted midair jump spent until next ground landing
    airJumped: false,    // one-tick pulse: air jump launched this tick
  };
}

/** True while the player's dodge grants invulnerability (a short step, not roll-spam). */
function playerInvulnerable(p) {
  return p.dodging > 0;
}

/**
 * Advance the player one tick.
 * @param {object} p - player state (mutated).
 * @param {object} intent - resolved movement intent for this tick:
 *   {moveDir:-1|0|1, jumpPressed:boolean, jumpHeld:boolean, dodge?:boolean, doubleJump?:boolean}
 *   doubleJump is the item grant (stage wires kit.doubleJump); without it, midair jump presses do not relaunch.
 * @param {object} world - either {groundY:number} (M2 flat-ground plane) OR
 *   {tilemap, body?:{halfW,halfH}} for real tile collision (M3+). p.y is the player's FEET.
 */
function stepPlayer(p, intent, world) {
  const { moveDir = 0, jumpPressed = false, jumpHeld = false, dodge = false, doubleJump = false } = intent || {};
  p.airJumped = false;

  // --- dodge: a short i-framed dash (feel table); overrides walk while active ---
  // Decrement at the TOP so `dodging > 0` (the i-frame flag) stays true for every dash tick as
  // observed by the stage's contact check after this step returns.
  if (p.dodging > 0) {
    p.dodging--;
    if (p.dodging <= 0) p.dodgeCooldown = FEEL.DODGE_COOLDOWN_TICKS;
  }
  if (p.dodgeCooldown > 0) p.dodgeCooldown--;
  if (dodge && p.dodging <= 0 && p.dodgeCooldown <= 0) {
    p.dodging = FEEL.DODGE_DURATION_TICKS;
    p.dodgeDir = moveDir !== 0 ? Math.sign(moveDir) : p.facing;
  }

  // --- horizontal intent + facing ---
  if (p.dodging > 0) {
    p.vx = p.dodgeDir * (FEEL.DODGE_DISTANCE / FEEL.DODGE_DURATION_TICKS);
    p.facing = p.dodgeDir;
  } else {
    p.vx = moveDir * FEEL.WALK_SPEED;
    if (moveDir < 0) p.facing = FACING.LEFT;
    else if (moveDir > 0) p.facing = FACING.RIGHT;
  }

  // --- jump buffering (uses previous-tick onGround/coyote) ---
  if (jumpPressed) p.jumpBuffer = FEEL.JUMP_BUFFER_TICKS;
  else if (p.jumpBuffer > 0) p.jumpBuffer--;

  const canJump = p.onGround || p.coyote > 0;
  if (p.jumpBuffer > 0 && canJump) {
    p.vy = -FEEL.JUMP_VELOCITY;
    p.onGround = false;
    p.coyote = 0;
    p.jumpBuffer = 0;
    p.jumping = true;
  } else if (
    p.jumpBuffer > 0 &&
    doubleJump &&
    !p.onGround &&
    p.coyote <= 0 &&
    !p.airJumpUsed
  ) {
    // Item-granted midair jump: same launch fields as the base jump; ownership via intent.doubleJump.
    p.vy = -FEEL.JUMP_VELOCITY;
    p.jumpBuffer = 0;
    p.jumping = true;
    p.airJumpUsed = true;
    p.airJumped = true;
  }

  // --- jump-cut: releasing jump during ascent shortens the hop ---
  if (p.jumping && !jumpHeld && p.vy < 0) {
    p.vy *= 0.5;
    p.jumping = false;
  }
  if (p.vy >= 0) p.jumping = false;

  const wasOnGround = p.onGround;

  if (world?.tilemap) {
    // --- tile collision path (M3+) ---
    const body = world.body || PLAYER_HALF;
    const w = body.halfW * 2, h = body.halfH * 2;
    p.vy += FEEL.GRAVITY;                       // always-on gravity; the down-move re-grounds us
    if (p.vy > FEEL.TERMINAL_FALL) p.vy = FEEL.TERMINAL_FALL;
    const box = { x: p.x - body.halfW, y: p.y - h, w, h };
    const res = moveAndCollide(box, p.vx, p.vy, world.tilemap);
    p.x = box.x + body.halfW;
    p.y = box.y + h;
    if (res.hitCeiling && p.vy < 0) p.vy = 0;
    p.onGround = res.onGround;
    if (p.onGround) { p.vy = 0; p.jumping = false; p.airJumpUsed = false; }
  } else {
    // --- flat-ground plane path (M2 compatibility) ---
    const groundY = world?.groundY ?? 0;
    p.x += p.vx;
    if (!p.onGround) {
      p.vy += FEEL.GRAVITY;
      if (p.vy > FEEL.TERMINAL_FALL) p.vy = FEEL.TERMINAL_FALL;
    }
    p.y += p.vy;
    if (p.y >= groundY) {
      p.y = groundY;
      p.vy = 0;
      p.onGround = true;
      p.jumping = false;
      p.airJumpUsed = false;
    } else {
      p.onGround = false;
    }
  }

  // --- coyote timer: start counting the tick we leave the ground by walking off ---
  if (wasOnGround && !p.onGround && p.vy >= 0) {
    p.coyote = FEEL.COYOTE_TICKS;
  } else if (!p.onGround && p.coyote > 0) {
    p.coyote--;
  }

  return p;
}


// ===== src/sim/stats.js =====
// stats.js — XP / level / stat model (DESIGN-SEED M2: XP/level tables per the study).
//
// Anchored to the only first-party numbers we have (docs/STUDY.md §2): level-0 stats
// Str 14 / Def 5 / Mag 14 / Energy 5 / Max Power(HP) 37, and "Next Lev 50" to reach level 1.
// Max level stays single-digit (§1.5). Everything beyond the L0 anchor is ADVERSARY's own
// retuned curve (STUDY.md §3.4.6: give XP a clear expected curve, don't force grind) — labeled
// RE-DERIVED. Stat labels (Strength/Defence/Magic/Energy/Power) are the study's mechanical terms,
// not flavor names.

const MAX_LEVEL = 9; // single-digit, per §1.5

// Level-0 baseline (OBSERVED, §2.3).
const BASE_STATS = Object.freeze({ maxHP: 37, str: 14, def: 5, mag: 14, energy: 5 });

// Per-level stat gains (RE-DERIVED). Applied cumulatively from L0 → target level.
const GROWTH = Object.freeze({ maxHP: 8, str: 3, def: 2, mag: 2, energy: 2 });

// Cumulative XP required to REACH each level. L1 = 50 is OBSERVED (§2.5); the rest is a gentle
// escalating curve (RE-DERIVED) so the "expected level" is legible and grind-light.
const XP_TO_REACH = Object.freeze([
  0,     // L0
  50,    // L1  (OBSERVED anchor)
  120,   // L2
  220,   // L3
  360,   // L4
  550,   // L5
  800,   // L6
  1120,  // L7
  1520,  // L8
  2010,  // L9 (cap)
]);

/** Clamp a level into [0, MAX_LEVEL]. */
function clampLevel(l) {
  return Math.max(0, Math.min(MAX_LEVEL, l | 0));
}

/** Full stat block at a given level. */
function statsForLevel(level) {
  const l = clampLevel(level);
  const s = { ...BASE_STATS };
  for (const k of Object.keys(GROWTH)) s[k] = BASE_STATS[k] + GROWTH[k] * l;
  return s;
}

/** Highest level whose XP threshold is satisfied by totalXp. */
function levelForXp(totalXp) {
  let lvl = 0;
  for (let l = 1; l <= MAX_LEVEL; l++) {
    if (totalXp >= XP_TO_REACH[l]) lvl = l;
    else break;
  }
  return lvl;
}

/** XP remaining until the next level; 0 at cap. */
function xpToNextLevel(totalXp) {
  const l = levelForXp(totalXp);
  if (l >= MAX_LEVEL) return 0;
  return XP_TO_REACH[l + 1] - totalXp;
}

/**
 * Create a progression state. XP is a running total; current HP tracks separately so damage and
 * healing are independent of the max derived from level.
 */
function createProgress(totalXp = 0) {
  const level = levelForXp(totalXp);
  const stats = statsForLevel(level);
  return { totalXp, level, stats, hp: stats.maxHP };
}

/**
 * Award XP. Returns {leveledUp:boolean, from:level, to:level, healedToFull:boolean}. On level-up,
 * stats are recomputed; HP tops up by the maxHP delta (a level-up feels rewarding) — never reduces
 * current HP.
 */
function gainXp(prog, amount) {
  if (!(amount > 0)) return { leveledUp: false, from: prog.level, to: prog.level, healedToFull: false };
  const from = prog.level;
  prog.totalXp += amount;
  const to = levelForXp(prog.totalXp);
  if (to !== from) {
    const oldMax = prog.stats.maxHP;
    prog.level = to;
    prog.stats = statsForLevel(to);
    prog.hp = Math.min(prog.stats.maxHP, prog.hp + (prog.stats.maxHP - oldMax));
    return { leveledUp: true, from, to, healedToFull: prog.hp === prog.stats.maxHP };
  }
  return { leveledUp: false, from, to, healedToFull: false };
}


// ===== src/sim/equipment.js =====
// equipment.js — weapons, armor, the equip loadout, and the damage formula (DESIGN-SEED M2: melee
// with equip system — auto-equip, bare-hands state; equip-comparison UI). All names here are
// NEUTRAL DESCRIPTIVE PLACEHOLDERS tracked in docs/NAMES-PENDING.md; the builder invents no flavor.
//
// The damage formula is the labeled RE-DERIVATION from docs/STUDY.md §3 — the source never revealed
// a player→enemy formula. Shape honored: floor-clamped like the source's unsigned HP counter;
// contact damage stays flat-per-enemy (§5.3) and lives on enemies, not here.

// Weapon kinds. 'melee' hits within reach; 'ranged' spawns a projectile (wired in M5).
const WEAPON_KIND = Object.freeze({ MELEE: 'melee', RANGED: 'ranged' });

// Rarity ladder scaffold (DESIGN-SEED spine addition 1). Uniques (rule-benders) land in M7.
const RARITY = Object.freeze({ COMMON: 'common', UNCOMMON: 'uncommon', UNIQUE: 'unique' });

/**
 * Bare hands — the unmistakable unarmed state (DESIGN-SEED "Equip trap fixed"). A legal
 * challenge-run state, never a silent default: feeble damage, tiny reach, its own empty-hand id so
 * the renderer can show an empty hand and play a feeble thud.
 */
const BARE_HANDS = Object.freeze({
  id: 'bare-hands',
  name: 'bare hands',           // placeholder descriptor
  kind: WEAPON_KIND.MELEE,
  rarity: RARITY.COMMON,
  damage: 1,                    // feeble
  reach: 8,                     // px — barely past the body
  cooldownTicks: 18,            // slow, unsatisfying on purpose
  bare: true,
});

// Starter weapon table — commons/uncommons filling an arc/speed/range variety table
// (DESIGN-SEED spine addition 1). Descriptive placeholder names only.
const WEAPONS = Object.freeze({
  'short-blade': Object.freeze({
    id: 'short-blade', name: 'short blade', kind: WEAPON_KIND.MELEE, rarity: RARITY.COMMON,
    damage: 6, reach: 18, cooldownTicks: 10,
  }),
  'long-blade': Object.freeze({
    id: 'long-blade', name: 'long blade', kind: WEAPON_KIND.MELEE, rarity: RARITY.UNCOMMON,
    damage: 10, reach: 28, cooldownTicks: 16,
  }),
  'ranged-sidearm': Object.freeze({
    id: 'ranged-sidearm', name: 'ranged sidearm', kind: WEAPON_KIND.RANGED, rarity: RARITY.UNCOMMON,
    damage: 8, reach: 160, cooldownTicks: 22,
  }),
  // Variety table (DESIGN-SEED spine addition 1: commons/uncommons fill an arc/speed/range table).
  'short-dagger': Object.freeze({
    id: 'short-dagger', name: 'short dagger', kind: WEAPON_KIND.MELEE, rarity: RARITY.COMMON,
    damage: 4, reach: 14, cooldownTicks: 6, // fastest, shortest
  }),
  'heavy-club': Object.freeze({
    id: 'heavy-club', name: 'heavy club', kind: WEAPON_KIND.MELEE, rarity: RARITY.COMMON,
    damage: 12, reach: 16, cooldownTicks: 20, // hardest single hit, slow
  }),
  'long-spear': Object.freeze({
    id: 'long-spear', name: 'long spear', kind: WEAPON_KIND.MELEE, rarity: RARITY.UNCOMMON,
    damage: 7, reach: 36, cooldownTicks: 15, // longest melee reach
  }),
});

// Armor table — defense sources. Placeholder descriptors.
const ARMOR = Object.freeze({
  none: Object.freeze({ id: 'none', name: 'no armor', defense: 0 }),
  'light-armor': Object.freeze({ id: 'light-armor', name: 'light armor', defense: 3 }),
  'heavy-armor': Object.freeze({ id: 'heavy-armor', name: 'heavy armor', defense: 7 }),
});

/** The starting weapon is auto-equipped (never bare hands by default). */
const STARTING_WEAPON_ID = 'short-blade';

/**
 * Create a loadout with the starting weapon auto-equipped (DESIGN-SEED "starting weapon
 * auto-equipped").
 */
function createLoadout({ weaponId = STARTING_WEAPON_ID, armorId = 'none' } = {}) {
  return { weapon: weaponId === BARE_HANDS.id ? BARE_HANDS : WEAPONS[weaponId], armor: ARMOR[armorId] };
}

/** Equip a weapon by id (or bare hands), or a resolved weapon def object. Returns the loadout. */
function equipWeapon(loadout, weaponIdOrDef) {
  if (weaponIdOrDef && typeof weaponIdOrDef === 'object') { loadout.weapon = weaponIdOrDef; return loadout; }
  loadout.weapon = weaponIdOrDef === BARE_HANDS.id ? BARE_HANDS : (WEAPONS[weaponIdOrDef] || loadout.weapon);
  return loadout;
}

/** Equip armor by id. */
function equipArmor(loadout, armorId) {
  loadout.armor = ARMOR[armorId] || loadout.armor;
  return loadout;
}

/**
 * Base outgoing damage (before variance). RE-DERIVED (STUDY.md §3):
 *   max(1, attackerStr + weaponDamage − targetDefense).
 * Floor-clamped to 1 so an attack always chips (never a whiff on stat inversion), mirroring the
 * source's floor-clamped HP counter.
 */
function computeDamage(attackerStats, weapon, targetDefense = 0) {
  const raw = (attackerStats?.str ?? 0) + (weapon?.damage ?? 0) - targetDefense;
  return Math.max(1, raw);
}

/**
 * Damage with a deterministic ±variance band, given a seeded rng. Keeps the floor clamp. Variance
 * is small (±15%) so builds read clearly.
 */
function computeDamageVaried(attackerStats, weapon, targetDefense, rng) {
  const base = computeDamage(attackerStats, weapon, targetDefense);
  const factor = 0.85 + (rng ? rng.next() : 0.5) * 0.30; // [0.85, 1.15)
  return Math.max(1, Math.round(base * factor));
}

/**
 * Equip-comparison deltas for the UI (DESIGN-SEED "equipment deltas readable", STUDY.md §3.4.4).
 * Positive = the candidate is better. Damage delta uses a neutral target defense of 0.
 * @returns {{dmgDelta:number, defDelta:number, kindChange:boolean}}
 */
function compareEquip(current, candidate, attackerStats) {
  const curDmg = computeDamage(attackerStats, current, 0);
  const candDmg = computeDamage(attackerStats, candidate, 0);
  return {
    dmgDelta: candDmg - curDmg,
    defDelta: (candidate?.defense ?? 0) - (current?.defense ?? 0),
    kindChange: (current?.kind ?? null) !== (candidate?.kind ?? null),
  };
}


// ===== src/sim/melee.js =====
// melee.js — base melee attack controller (DESIGN-SEED M2: "base melee per equipped weapon,
// always available"). A deterministic timing state machine: an attack has an active hit window,
// then a cooldown taken from the weapon's speed. The hitbox is placed in front of the attacker by
// facing + weapon reach; a single attack lands on each overlapping target at most once. Pure and
// headless-testable — the seeded stage-clear bot (M3) drives this without a browser.


const ATTACK_PHASE = Object.freeze({ IDLE: 'idle', ACTIVE: 'active', RECOVER: 'recover' });

// Ticks the hitbox is live once an attack starts. Short — the "swing connects" window.
const ACTIVE_TICKS = 4;
const VISUAL_FRAMES = 4;
const VISUAL_FRAME_TICKS = 2;
const VISUAL_TICKS = VISUAL_FRAMES * VISUAL_FRAME_TICKS;
const NO_ATTACK_VISUAL = Object.freeze({ active: false, frame: -1 });

/** Create an attack controller state. */
function createAttack() {
  return { phase: ATTACK_PHASE.IDLE, timer: 0, cooldown: 0, hitIds: null, visualTimer: 0 };
}

/** True if a new attack can start (idle and off cooldown). */
function canAttack(atk) {
  return atk.phase === ATTACK_PHASE.IDLE && atk.cooldown <= 0;
}

/**
 * Advance the attack controller one tick.
 * @param {object} atk - attack state (mutated).
 * @param {object} intent - {attackPressed:boolean}
 * @param {object} weapon - equipped weapon (uses cooldownTicks).
 * @returns {{started:boolean, hitActive:boolean}}
 */
function stepMelee(atk, intent, weapon) {
  if (atk.cooldown > 0) atk.cooldown--;
  if (atk.visualTimer > 0) atk.visualTimer--;
  let started = false;

  if (canAttack(atk) && intent?.attackPressed) {
    atk.phase = ATTACK_PHASE.ACTIVE;
    atk.timer = ACTIVE_TICKS;
    atk.hitIds = new Set(); // fresh per-attack hit ledger (one hit per target per swing)
    atk.cooldown = weapon?.cooldownTicks ?? 12;
    atk.visualTimer = VISUAL_TICKS;
    started = true;
  }

  let hitActive = false;
  if (atk.phase === ATTACK_PHASE.ACTIVE) {
    hitActive = true;
    atk.timer--;
    if (atk.timer <= 0) {
      atk.phase = ATTACK_PHASE.IDLE;
    }
  }
  return { started, hitActive };
}

/**
 * Minimal read-only render view of the current swing. Its longer visual window does not alter the
 * mechanical active window or cooldown; four frames held for two ticks keep the attack legible.
 */
function attackVisualView(atk) {
  if (!atk || atk.visualTimer <= 0) return NO_ATTACK_VISUAL;
  const elapsed = VISUAL_TICKS - atk.visualTimer;
  return Object.freeze({
    active: true,
    frame: Math.min(VISUAL_FRAMES - 1, Math.floor(elapsed / VISUAL_FRAME_TICKS)),
  });
}

/**
 * Axis-aligned hitbox in front of the attacker for the current weapon reach.
 * @param {object} attacker - {x,y,facing} where (x,y) is the body center.
 * @param {object} weapon - uses reach.
 * @param {object} [body] - {halfW,halfH} attacker half-extents (defaults to a 16×24 body).
 * @returns {{x:number,y:number,w:number,h:number}}
 */
function meleeHitbox(attacker, weapon, body = { halfW: 8, halfH: 12 }) {
  const reach = weapon?.reach ?? 8;
  const h = body.halfH * 2;
  const y = attacker.y - body.halfH;
  if (attacker.facing === FACING.LEFT) {
    return { x: attacker.x - body.halfW - reach, y, w: reach, h };
  }
  return { x: attacker.x + body.halfW, y, w: reach, h };
}

/** AABB overlap test. */
function aabbOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/**
 * Resolve an active swing against targets, returning those newly hit this swing (deduped via the
 * attack's hit ledger so one swing never double-hits a target).
 * @param {object} atk - attack state (its hitIds ledger is updated).
 * @param {object} hitbox - from meleeHitbox.
 * @param {Array<{id:*, aabb:{x,y,w,h}}>} targets
 * @returns {Array} the subset of targets newly struck.
 */
function resolveMeleeHits(atk, hitbox, targets) {
  if (atk.phase !== ATTACK_PHASE.ACTIVE || !atk.hitIds) return [];
  const struck = [];
  for (const t of targets) {
    if (atk.hitIds.has(t.id)) continue;
    if (aabbOverlap(hitbox, t.aabb)) {
      atk.hitIds.add(t.id);
      struck.push(t);
    }
  }
  return struck;
}


// ===== src/sim/enemy.js =====
// enemy.js — stage trash enemies + their AI patterns (DESIGN-SEED M3: enemies, AI patterns).
// Deterministic, tile-aware: a walker patrols and turns at walls and ledges; a hopper does the same
// but periodically hops. Contact damage stays FLAT per enemy type, honoring the source's observed
// behavior (STUDY.md §5.3). Names are placeholder descriptors (NAMES-PENDING.md). All enemy-side
// stats (HP/xp/gold/damage) are RE-DERIVED tuning targets.


// Enemy type table. body is half-extents. Placeholder ids/names only.
const ENEMY_TYPES = Object.freeze({
  walker: Object.freeze({
    id: 'walker', name: 'walker', aiKind: 'patrol',
    body: { halfW: 7, halfH: 8 }, speed: 0.6,
    hp: 12, contactDamage: 4, xp: 8, gold: 2,
  }),
  hopper: Object.freeze({
    id: 'hopper', name: 'hopper', aiKind: 'patrol', hop: true, hopEvery: 48, hopVelocity: 4.2,
    body: { halfW: 7, halfH: 7 }, speed: 0.5,
    hp: 10, contactDamage: 5, xp: 10, gold: 3,
  }),
});

/** Spawn an enemy of a type at feet-position (x, y). */
function createEnemy(typeId, x, y, facing = FACING.LEFT) {
  const type = ENEMY_TYPES[typeId];
  if (!type) throw new Error(`unknown enemy type ${typeId}`);
  return {
    type,
    x, y,
    spawnX: x, spawnY: y, spawnFacing: facing, // for trash respawn (Souls rest/death)
    vx: 0, vy: 0,
    facing,
    onGround: false,
    hp: type.hp,
    alive: true,
    hopTimer: 0,
    hitFlash: 0,
  };
}

/** Reset a trash enemy to its spawn (respawn on death/rest; bosses never call this). */
function resetEnemy(e) {
  e.x = e.spawnX; e.y = e.spawnY; e.facing = e.spawnFacing;
  e.vx = 0; e.vy = 0; e.onGround = false;
  e.hp = e.type.hp; e.alive = true; e.hopTimer = 0; e.hitFlash = 0;
  return e;
}

/** Enemy collision/hurt AABB (top-left), from feet position. */
function enemyAabb(e) {
  const { halfW, halfH } = e.type.body;
  return { x: e.x - halfW, y: e.y - halfH * 2, w: halfW * 2, h: halfH * 2 };
}

/**
 * Advance one enemy by a tick against the tilemap. Patrol AI: walk forward, turn at walls and at
 * ledges (no ground ahead). Hoppers add a periodic hop. Mutates e.
 */
function stepEnemy(e, tilemap) {
  if (!e.alive) return e;
  const type = e.type;
  const { halfW, halfH } = type.body;
  const h = halfH * 2;

  // horizontal patrol
  e.vx = e.facing * type.speed;

  // hop cadence
  if (type.hop && e.onGround) {
    e.hopTimer++;
    if (e.hopTimer >= type.hopEvery) { e.vy = -type.hopVelocity; e.hopTimer = 0; e.onGround = false; }
  }

  // gravity
  e.vy += FEEL.GRAVITY;
  if (e.vy > FEEL.TERMINAL_FALL) e.vy = FEEL.TERMINAL_FALL;

  const box = { x: e.x - halfW, y: e.y - h, w: halfW * 2, h };
  const res = moveAndCollide(box, e.vx, e.vy, tilemap);
  e.x = box.x + halfW;
  e.y = box.y + h;
  e.onGround = res.onGround;
  if (res.onGround) e.vy = 0;

  // turn at a wall
  if (res.hitX) e.facing = -e.facing;

  // turn at a ledge (only while grounded, so hops don't false-trigger a flip mid-air)
  if (e.onGround) {
    const aheadX = e.x + e.facing * (halfW + 2);
    const footY = e.y + 2;
    if (!tilemap.solidAtPx(aheadX, footY)) e.facing = -e.facing;
  }

  if (e.hitFlash > 0) e.hitFlash--;
  return e;
}

/**
 * Apply damage to an enemy. Returns {killed, xp, gold} (rewards only on the killing blow).
 */
function damageEnemy(e, amount) {
  if (!e.alive) return { killed: false, xp: 0, gold: 0 };
  e.hp -= amount;
  e.hitFlash = 6;
  if (e.hp <= 0) {
    e.alive = false;
    return { killed: true, xp: e.type.xp, gold: e.type.gold };
  }
  return { killed: false, xp: 0, gold: 0 };
}


// ===== src/sim/boss.js =====
// boss.js — the stage boss with a TELEGRAPHED attack pattern (DESIGN-SEED M3 boss law: every stage
// ends in a telegraphed-pattern boss; M3's is the exemplar). Deterministic phase machine:
// idle (pace toward the player) → telegraph (a readable wind-up) → lunge (fast strike, hit window)
// → recover. The telegraph is the fairness tell the player reads to dodge. HP/damage RE-DERIVED.


const BOSS_PHASE = Object.freeze({
  IDLE: 'idle', TELEGRAPH: 'telegraph', LUNGE: 'lunge', RECOVER: 'recover',
});

// Phase durations (ticks) and tuning. Telegraph is long + visible on purpose (fair warning).
const IDLE_TICKS = 70;
const TELEGRAPH_TICKS = 34;
const LUNGE_TICKS = 20;
const RECOVER_TICKS = 44;

const BOSS_STATS = Object.freeze({
  body: { halfW: 12, halfH: 16 }, // 24×32
  // Stage-1 boss: the exemplar, deliberately gentle — a telegraph-reading fight, not a wall.
  hp: 44, contactDamage: 4, lungeContactDamage: 7, xp: 80, gold: 40,
  paceSpeed: 0.5, lungeSpeed: 3.4,
});

// The boss holds its arena — it never wanders off to fight over hazards elsewhere in the stage.
const ARENA_HALF = 56;

function createBoss(x, y, facing = FACING.LEFT) {
  return {
    x, y, homeX: x, vx: 0, vy: 0, facing,
    onGround: false,
    hp: BOSS_STATS.hp,
    alive: true,
    phase: BOSS_PHASE.IDLE,
    timer: IDLE_TICKS,
    hitFlash: 0,
    lungeDir: facing,
  };
}

/** Reset an un-beaten boss to full for a fresh re-fight after the player dies (Souls convention). */
function resetBoss(b) {
  if (!b.alive) return b; // a beaten boss stays beaten — never respawns
  b.x = b.homeX; b.vx = 0; b.vy = 0;
  b.onGround = false;
  b.facing = FACING.LEFT; b.lungeDir = FACING.LEFT;
  b.hp = BOSS_STATS.hp;
  b.phase = BOSS_PHASE.IDLE;
  b.timer = IDLE_TICKS;
  b.hitFlash = 0;
  return b;
}

/** Boss collision/hurt AABB (top-left), feet at boss.y. */
function bossAabb(b) {
  const { halfW, halfH } = BOSS_STATS.body;
  return { x: b.x - halfW, y: b.y - halfH * 2, w: halfW * 2, h: halfH * 2 };
}

/** True while the boss's strike is live (its dangerous window). */
function bossStriking(b) {
  return b.phase === BOSS_PHASE.LUNGE;
}

/**
 * Advance the boss one tick. Chases/telegraphs/lunges relative to the player's x.
 * @returns {{phaseChanged:boolean}}
 */
function stepBoss(b, player, tilemap) {
  if (!b.alive) return { phaseChanged: false };
  const { halfW, halfH } = BOSS_STATS.body;
  const h = halfH * 2;

  let phaseChanged = false;
  b.timer--;

  switch (b.phase) {
    case BOSS_PHASE.IDLE:
      b.facing = player.x < b.x ? FACING.LEFT : FACING.RIGHT;
      b.vx = b.facing * BOSS_STATS.paceSpeed;
      if (b.timer <= 0) { b.phase = BOSS_PHASE.TELEGRAPH; b.timer = TELEGRAPH_TICKS; phaseChanged = true; }
      break;
    case BOSS_PHASE.TELEGRAPH:
      b.vx = 0; // plant and wind up (the tell)
      b.lungeDir = player.x < b.x ? FACING.LEFT : FACING.RIGHT;
      b.facing = b.lungeDir;
      if (b.timer <= 0) { b.phase = BOSS_PHASE.LUNGE; b.timer = LUNGE_TICKS; phaseChanged = true; }
      break;
    case BOSS_PHASE.LUNGE:
      b.vx = b.lungeDir * BOSS_STATS.lungeSpeed;
      if (b.timer <= 0) { b.phase = BOSS_PHASE.RECOVER; b.timer = RECOVER_TICKS; phaseChanged = true; }
      break;
    case BOSS_PHASE.RECOVER:
      b.vx = 0; // vulnerable, catching its breath
      if (b.timer <= 0) { b.phase = BOSS_PHASE.IDLE; b.timer = IDLE_TICKS; phaseChanged = true; }
      break;
    default: break;
  }

  b.vy += FEEL.GRAVITY;
  if (b.vy > FEEL.TERMINAL_FALL) b.vy = FEEL.TERMINAL_FALL;
  const box = { x: b.x - halfW, y: b.y - h, w: halfW * 2, h };
  const res = moveAndCollide(box, b.vx, b.vy, tilemap);
  b.x = box.x + halfW;
  b.y = box.y + h;
  b.onGround = res.onGround;
  if (res.onGround) b.vy = 0;
  // Hold the arena: clamp to home ± ARENA_HALF; a lunge into the boundary ends early.
  const lo = b.homeX - ARENA_HALF, hi = b.homeX + ARENA_HALF;
  if (b.x < lo || b.x > hi) {
    b.x = b.x < lo ? lo : hi;
    if (b.phase === BOSS_PHASE.LUNGE) { b.phase = BOSS_PHASE.RECOVER; b.timer = RECOVER_TICKS; }
  }
  if (res.hitX && b.phase === BOSS_PHASE.LUNGE) { b.phase = BOSS_PHASE.RECOVER; b.timer = RECOVER_TICKS; }

  if (b.hitFlash > 0) b.hitFlash--;
  return { phaseChanged };
}

/** Contact damage the boss deals right now (heavier mid-lunge). */
function bossContactDamage(b) {
  return bossStriking(b) ? BOSS_STATS.lungeContactDamage : BOSS_STATS.contactDamage;
}

/** Apply damage; only vulnerable outside... actually always damageable, but recover is the opening. */
function damageBoss(b, amount) {
  if (!b.alive) return { killed: false, xp: 0, gold: 0 };
  b.hp -= amount;
  b.hitFlash = 6;
  if (b.hp <= 0) {
    b.alive = false;
    return { killed: true, xp: BOSS_STATS.xp, gold: BOSS_STATS.gold };
  }
  return { killed: false, xp: 0, gold: 0 };
}


// ===== src/sim/uniques.js =====
// uniques.js — the rule-bending unique weapons (DESIGN-SEED spine addition 1: ~8-12 NAMED UNIQUES
// each break ONE rule of the kit — build-changers, never stat sticks). Names are NEUTRAL
// DESCRIPTIVE PLACEHOLDERS (naming law); each carries a one-line `rule` describing what it bends and
// a `mod` object the sim reads. All numbers are RE-DERIVED. The commons/uncommons in equipment.js
// stay situationally competitive — M7's weapon-usage probe checks that.


// Each unique is a weapon with the usual fields plus `rule` (player-facing descriptor) and `mod`
// flags: lifesteal (0..1 of damage healed), dmgMul, alwaysCharged, projectileAnyHp, freeSub,
// fragile (incoming-damage multiplier), defenseBonus (flat incoming reduction), downthrustPower.
const UNIQUES = Object.freeze({
  'unique-1': mk('unique-1', 'twin reach blade', 'reach doubled, damage halved',
    { damage: 3, reach: 40, cooldownTicks: 12 }, {}),
  'unique-2': mk('unique-2', 'slow heavy maul', 'huge damage, very slow swing',
    { damage: 30, reach: 16, cooldownTicks: 34 }, {}),
  'unique-3': mk('unique-3', 'leeching edge', 'heals a share of damage dealt',
    { damage: 6, reach: 18, cooldownTicks: 12 }, { lifesteal: 0.3 }),
  'unique-4': mk('unique-4', 'coiled brand', 'every swing hits as a charged strike',
    { damage: 5, reach: 18, cooldownTicks: 18 }, { alwaysCharged: true }),
  'unique-5': mk('unique-5', 'beam edge', 'fires the shot at ANY health, not just full',
    { damage: 6, reach: 18, cooldownTicks: 12 }, { projectileAnyHp: true }),
  'unique-6': mk('unique-6', 'free sling', 'sub-weapon costs no resource',
    { damage: 6, reach: 18, cooldownTicks: 12 }, { freeSub: true }),
  'unique-7': mk('unique-7', 'glass fang', 'double damage, but you take double damage',
    { damage: 6, reach: 18, cooldownTicks: 12 }, { dmgMul: 2, fragile: 2 }),
  'unique-8': mk('unique-8', 'guard pike', 'weak hits, but blunts incoming damage',
    { damage: 3, reach: 26, cooldownTicks: 14 }, { defenseBonus: 5 }),
  'unique-9': mk('unique-9', 'swift needle', 'blazing fast, tiny per-hit damage',
    { damage: 2, reach: 14, cooldownTicks: 5 }, {}),
  'unique-10': mk('unique-10', 'quake hammer', 'downthrust lands harder and bounces higher',
    { damage: 8, reach: 16, cooldownTicks: 18 }, { downthrustPower: 1.6 }),
});

function mk(id, name, rule, stats, mod) {
  return Object.freeze({
    id, name, rule, kind: WEAPON_KIND.MELEE, rarity: RARITY.UNIQUE,
    ...stats, mod: Object.freeze(mod),
  });
}

const UNIQUE_IDS = Object.freeze(Object.keys(UNIQUES));

/** Resolve a unique by id (or null). */
function uniqueDef(id) { return UNIQUES[id] || null; }

/** A weapon's mod object (uniques carry one; commons/uncommons have none → {}). */
function weaponMod(weapon) { return (weapon && weapon.mod) || {}; }


// ===== src/sim/inventory.js =====
// inventory.js — what the player owns (DESIGN-SEED M3: the action-menu inventory). Owned weapons,
// owned armor, and stackable consumables. Pure model; the menu (menu.js) drives equip/use through
// it. Item/weapon labels are placeholder descriptors (NAMES-PENDING.md).


/** Consumable item table (placeholder descriptors). */
const ITEMS = Object.freeze({
  heal: Object.freeze({ id: 'heal', name: 'healing item', heal: 15 }),
});

/** Create an inventory. Starting kit: the auto-equipped starter weapon, no armor, one heal. */
function createInventory(init = {}) {
  return {
    weapons: init.weapons ? [...init.weapons] : [STARTING_WEAPON_ID],
    armors: init.armors ? [...init.armors] : ['none'],
    items: { heal: 1, ...(init.items || {}) },
  };
}

function addWeapon(inv, weaponId) {
  if ((WEAPONS[weaponId] || UNIQUES[weaponId]) && !inv.weapons.includes(weaponId)) inv.weapons.push(weaponId);
  return inv;
}

function addArmor(inv, armorId) {
  if (ARMOR[armorId] && !inv.armors.includes(armorId)) inv.armors.push(armorId);
  return inv;
}

function addItem(inv, itemId, n = 1) {
  if (!ITEMS[itemId]) return inv;
  inv.items[itemId] = (inv.items[itemId] || 0) + n;
  return inv;
}

/** True if at least one of the item is held. */
function hasItem(inv, itemId) {
  return (inv.items[itemId] || 0) > 0;
}

/** Consume one item; returns the item def if consumed, else null. */
function consumeItem(inv, itemId) {
  if (!hasItem(inv, itemId)) return null;
  inv.items[itemId]--;
  return ITEMS[itemId];
}

/** Resolve a weapon id (incl. bare hands and uniques) to its def. */
function weaponDef(id) {
  if (id === BARE_HANDS.id) return BARE_HANDS;
  return WEAPONS[id] || UNIQUES[id] || null;
}


// ===== src/sim/kit.js =====
// kit.js — the combat kit + its unlock gating (DESIGN-SEED "COMBAT KIT"). The base melee is always
// available; the rest are found/earned across stages and grow the kit Metroid-style. This module
// decides, per tick, what attack the current input produces given which moves are unlocked. Kept
// additive over the M3 press-swing so unlocking a move never changes the feel of the base attack:
//   • press            → normal swing
//   • hold to full + release → charged strike (stronger), if unlocked
//   • air + down + press → downthrust (downward strike that bounces on hit), if unlocked
//
// Projectile (full-health) and sub-weapon (up+B, resource-consuming) resolve here too and are wired
// by the stage. All multipliers/values are RE-DERIVED tuning targets.


// Kit move catalogue for the MOVE LIST screen + unlock pickups. `base` moves are always available;
// the rest unlock across stages. `input` strings are the how-to shown to the player (placeholder
// key hints; remap-aware text is an M9 concern).
const KIT_MOVES = Object.freeze([
  { id: 'dodge', name: 'dodge step', input: 'double-tap ←/→ (or H)', base: true },
  { id: 'charged', name: 'charged strike', input: 'hold J, then release' },
  { id: 'downthrust', name: 'downthrust', input: 'in air: ↓ + J' },
  { id: 'doubleJump', name: 'double jump', input: 'in air: press jump again' },
  { id: 'projectile', name: 'full-health shot', input: 'J at full HP' },
  { id: 'subweapon', name: 'sub-weapon', input: '↑ + L' },
]);

/** True if a move id is available given the kit (base moves always are). */
function moveUnlocked(kit, id) {
  const m = KIT_MOVES.find((x) => x.id === id);
  if (!m) return false;
  return m.base || !!(kit && kit[id]);
}

const CHARGED_MULT = 2.0;
const DOWNTHRUST_MULT = 1.4;
const DOWNTHRUST_BOUNCE = 5.0; // upward px/tick on a successful downthrust

/** The set of unlocked kit moves. Base melee + dodge are always on; the rest unlock across stages. */
function createKit(unlocks = {}) {
  return {
    charged: !!unlocks.charged,
    downthrust: !!unlocks.downthrust,
    doubleJump: !!unlocks.doubleJump,
    projectile: !!unlocks.projectile,
    subweapon: !!unlocks.subweapon,
  };
}

/**
 * Decide the melee swing produced this tick. Advances the charge meter (mutated on `charge`).
 * @param {object} intent - {attackPressed, attackDown, down}
 * @param {object} player - needs {onGround}
 * @param {object} kit
 * @param {object} charge - {ticks} charge meter (mutated)
 * @returns {null|{type:'normal'|'charged'|'downthrust', mul:number, downward:boolean}}
 */
function decideMelee(intent, player, kit, charge, weapon) {
  const { attackPressed = false, attackDown = false, down = false } = intent || {};
  const mod = weaponMod(weapon);

  // Charge meter (only meaningful if unlocked): builds while attack is held, releases a charged
  // strike when it was held to full. Independent of the press-swing below.
  let charged = null;
  if (kit.charged) {
    if (attackDown) {
      charge.ticks = Math.min(FEEL.CHARGE_FULL_TICKS, charge.ticks + 1);
    } else {
      if (charge.ticks >= FEEL.CHARGE_FULL_TICKS) charged = { type: 'charged', mul: CHARGED_MULT, downward: false };
      charge.ticks = 0;
    }
  }
  if (charged) return charged;

  if (attackPressed) {
    if (kit.downthrust && !player.onGround && down) {
      return { type: 'downthrust', mul: DOWNTHRUST_MULT, downward: true };
    }
    // A unique that makes every swing a charged strike (build-changer).
    if (mod.alwaysCharged) return { type: 'charged', mul: CHARGED_MULT, downward: false };
    return { type: 'normal', mul: 1, downward: false };
  }
  return null;
}


// ===== src/sim/menu.js =====
// menu.js — the action menu (DESIGN-SEED M3 + study §2.6): Items / Weapons / Equipment / Strength.
// The menu PAUSES play (enforced by the loop; DESIGN-SEED menu-vs-realtime rule). Weapons/Equipment
// tabs surface the equip-comparison delta before equipping (the M2/M3 equip-comparison requirement,
// STUDY.md §3.4.4). Pure state machine over a ctx {loadout, progress, inventory, gold}; the renderer
// reads entries()/compareAt(), the input layer calls move*/confirm.


const TABS = Object.freeze(['items', 'weapons', 'equipment', 'moves', 'strength']);
const TAB_LABEL = Object.freeze({
  items: 'ITEMS', weapons: 'WEAPONS', equipment: 'EQUIPMENT', moves: 'MOVES', strength: 'STRENGTH',
});

function createMenu() {
  return { open: false, tab: 0, cursor: 0 };
}

function openMenu(m) { m.open = true; m.tab = 0; m.cursor = 0; }
function closeMenu(m) { m.open = false; }
function toggleMenu(m) { m.open ? closeMenu(m) : openMenu(m); }

const wrap = (i, n) => (n <= 0 ? 0 : ((i % n) + n) % n);

function currentTab(m) { return TABS[m.tab]; }

function moveTab(m, dir) {
  m.tab = wrap(m.tab + dir, TABS.length);
  m.cursor = 0;
}

/** Rows shown for the current tab. */
function entries(m, ctx) {
  const tab = currentTab(m);
  if (tab === 'items') {
    return Object.keys(ITEMS)
      .filter((id) => (ctx.inventory.items[id] || 0) > 0)
      .map((id) => ({ id, name: ITEMS[id].name, count: ctx.inventory.items[id] }));
  }
  if (tab === 'weapons') {
    const ids = [...ctx.inventory.weapons, BARE_HANDS.id];
    return ids.map((id) => ({
      id, name: weaponDef(id).name, equipped: ctx.loadout.weapon.id === id,
    }));
  }
  if (tab === 'equipment') {
    return ctx.inventory.armors.map((id) => ({
      id, name: ARMOR[id].name, equipped: ctx.loadout.armor.id === id,
    }));
  }
  if (tab === 'moves') {
    // The MOVE LIST screen — unlocked moves show their input; locked ones read LOCKED.
    return KIT_MOVES.map((mv) => {
      const unlocked = moveUnlocked(ctx.kit, mv.id);
      return { id: mv.id, name: mv.name, unlocked, value: unlocked ? mv.input : 'LOCKED' };
    });
  }
  // strength — read-only stat rows (the study's Strength screen)
  const s = ctx.progress.stats;
  return [
    { id: 'level', name: 'Level', value: ctx.progress.level },
    { id: 'maxHP', name: 'Max Power', value: s.maxHP },
    { id: 'str', name: 'Strength', value: s.str },
    { id: 'def', name: 'Defence', value: s.def },
    { id: 'mag', name: 'Magic', value: s.mag },
    { id: 'energy', name: 'Energy', value: s.energy },
    { id: 'gold', name: 'Gold', value: ctx.gold },
  ];
}

function moveCursor(m, dir, ctx) {
  const n = entries(m, ctx).length;
  m.cursor = wrap(m.cursor + dir, n);
}

/**
 * Equip-comparison for the cursor row on weapons/equipment tabs (null otherwise).
 * @returns {null|{dmgDelta:number, defDelta:number, kindChange:boolean}}
 */
function compareAt(m, ctx) {
  const tab = currentTab(m);
  const rows = entries(m, ctx);
  const row = rows[m.cursor];
  if (!row) return null;
  if (tab === 'weapons') return compareEquip(ctx.loadout.weapon, weaponDef(row.id), ctx.progress.stats);
  if (tab === 'equipment') return compareEquip(ctx.loadout.armor, ARMOR[row.id], ctx.progress.stats);
  return null;
}

/**
 * Act on the current cursor row. Returns an event describing what happened (or null).
 */
function confirm(m, ctx) {
  const tab = currentTab(m);
  const rows = entries(m, ctx);
  const row = rows[m.cursor];
  if (!row) return null;

  if (tab === 'weapons') {
    equipWeapon(ctx.loadout, weaponDef(row.id) || row.id);
    return { type: 'equip-weapon', id: row.id };
  }
  if (tab === 'equipment') {
    equipArmor(ctx.loadout, row.id);
    return { type: 'equip-armor', id: row.id };
  }
  if (tab === 'items') {
    const def = consumeItem(ctx.inventory, row.id);
    if (!def) return null;
    if (def.heal) {
      const before = ctx.progress.hp;
      ctx.progress.hp = Math.min(ctx.progress.stats.maxHP, ctx.progress.hp + def.heal);
      return { type: 'use-item', id: row.id, healed: ctx.progress.hp - before };
    }
    return { type: 'use-item', id: row.id };
  }
  return null; // strength is read-only
}


// ===== src/sim/souls.js =====
// souls.js — the death-loop economy (DESIGN-SEED "modernizing layer": Souls death loop). XP is at
// risk; equipment and gold are never. On death the unspent XP above the current level's floor drops
// as a single recoverable marker; dying again before recovery FORFEITS the old marker. Levels are
// never lost — the drop floors at the current level's threshold (studio fold: "never below current
// level floor"). Recovering the marker restores the XP (and may re-level).


/** XP the player currently holds above their level floor — the amount that would be at risk. */
function xpAtRisk(progress) {
  return Math.max(0, progress.totalXp - XP_TO_REACH[progress.level]);
}

/**
 * Drop a death marker at (x, y). Floors the player's XP to the current level (no level loss) and
 * hands the at-risk XP to a fresh marker. Any pre-existing marker is FORFEITED.
 * @returns {{marker:{xp:number,x:number,y:number}|null, forfeited:number}}
 *   marker is null when there was no XP to risk; forfeited is the XP lost from a prior marker.
 */
function dropMarker(progress, x, y, prevMarker = null) {
  const forfeited = prevMarker ? prevMarker.xp : 0;
  const atRisk = xpAtRisk(progress);
  progress.totalXp = XP_TO_REACH[progress.level]; // floor to current level; level unchanged
  const marker = atRisk > 0 ? { xp: atRisk, x, y } : null;
  return { marker, forfeited };
}

/**
 * Recover a marker: restore its XP (re-leveling if it crosses a threshold).
 * @returns {{recovered:number, leveledUp:boolean, to:number}}
 */
function recoverMarker(progress, marker) {
  if (!marker) return { recovered: 0, leveledUp: false, to: progress.level };
  const ev = gainXp(progress, marker.xp);
  return { recovered: marker.xp, leveledUp: ev.leveledUp, to: ev.to };
}

/** Distance-and-direction hint from a position to the marker, for the HUD indicator. Null if none. */
function markerHint(marker, fromX) {
  if (!marker) return null;
  const dx = marker.x - fromX;
  return { dir: Math.sign(dx) || 1, dist: Math.abs(dx) };
}


// ===== src/sim/projectile.js =====
// projectile.js — projectiles (DESIGN-SEED kit: full-health projectile; sub-weapon slot). A flying
// hitbox owned by the player: travels straight, dies on a solid tile, a hit, or its lifetime. Pure
// and deterministic. The stage spawns them (full-HP beam on a normal swing; sub-weapon on up+B
// consuming a resource), steps them, and resolves their hits.

const DEFAULT_LIFE = 90; // ticks (~1.5s)

/** Create a player-owned projectile travelling at (vx, vy). */
function createProjectile({ x, y, vx, vy = 0, damage, life = DEFAULT_LIFE, w = 8, h = 6, kind = 'beam' }) {
  return { x, y, vx, vy, damage, life, w, h, kind, dead: false };
}

/** Projectile hit AABB (centered on x,y). */
function projectileAabb(p) {
  return { x: p.x - p.w / 2, y: p.y - p.h / 2, w: p.w, h: p.h };
}

/** Advance a projectile one tick; dies on a solid tile or when its life runs out. */
function stepProjectile(p, tilemap) {
  if (p.dead) return p;
  p.x += p.vx;
  p.y += p.vy;
  if (--p.life <= 0) { p.dead = true; return p; }
  if (tilemap && tilemap.solidAtPx(p.x, p.y)) p.dead = true;
  return p;
}


// ===== src/sim/settings.js =====
// settings.js — the assist toggle + run settings (DESIGN-SEED M8 + accessibility folds). Assist is
// HONEST: it has an input-assist axis (longer i-frames + leniency) and a XP-safety axis (XP never
// drops on death), and it NEVER changes drop rates. The visual-clarity axis (flash/shake caps,
// reduce-effects) is a render setting handled in M9. Assist is surfaced in the pause menu AND the
// death prompt (wired by the boot layer).

const ASSIST_IFRAME_MULT = 1.6;   // longer hit-stun invulnerability
const ASSIST_LENIENCY_MULT = 1.5; // longer input leniency windows (charge/double-tap)

function createSettings(o = {}) {
  return {
    assist: !!o.assist,          // master honest-assist toggle
    xpSafe: o.xpSafe ?? !!o.assist,        // XP never drops on death
    inputAssist: o.inputAssist ?? !!o.assist, // longer i-frames + leniency
    reduceEffects: !!o.reduceEffects,      // visual-clarity axis: caps flashes/strobes in the renderer
    chargeToggle: !!o.chargeToggle,        // accessibility: charge on tap-to-start / tap-to-release
    muted: !!o.muted,
  };
}

/** Effective hit-stun i-frame ticks given settings. */
function iframeTicks(baseTicks, settings) {
  return Math.round(baseTicks * (settings && settings.inputAssist ? ASSIST_IFRAME_MULT : 1));
}

/** Set the master assist toggle and its coupled axes together. */
function setAssist(settings, on) {
  settings.assist = !!on;
  settings.xpSafe = !!on;
  settings.inputAssist = !!on;
  return settings;
}


// ===== src/core/rng.js =====
// rng.js — seeded, deterministic PRNG for anything sim-relevant (DESIGN-SEED "Determinism").
//
// mulberry32: a fast 32-bit generator with a full 2^32 period and good statistical quality for
// game use. State is a single uint32, so getState/setState round-trips exactly — the headless
// suite can replay a run, and saves can restore the exact stream position.

/** Hash an arbitrary string or number into a uint32 seed (FNV-1a style). */
function hashSeed(seed) {
  if (typeof seed === 'number') {
    // Fold to uint32; guard against NaN/float.
    return (seed >>> 0) || 0x9e3779b9;
  }
  const str = String(seed);
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

/**
 * Create a seeded RNG.
 * @param {number|string} seed - any seed; strings are hashed deterministically.
 */
function createRng(seed = 0x9e3779b9) {
  let state = hashSeed(seed) >>> 0;

  function nextU32() {
    state = (state + 0x6d2b79f5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return (t ^ (t >>> 14)) >>> 0;
  }

  const rng = {
    /** Float in [0, 1). */
    next() {
      return nextU32() / 0x100000000;
    },
    /** Integer in [min, max] inclusive. */
    int(min, max) {
      if (max < min) [min, max] = [max, min];
      const span = max - min + 1;
      return min + (nextU32() % span);
    },
    /** Float in [min, max). */
    range(min, max) {
      return min + (max - min) * (nextU32() / 0x100000000);
    },
    /** True with probability p (0..1). */
    chance(p) {
      return nextU32() / 0x100000000 < p;
    },
    /** Uniformly pick one element of a non-empty array. */
    pick(arr) {
      return arr[nextU32() % arr.length];
    },
    /** Exact uint32 state, for save/replay. */
    getState() {
      return state >>> 0;
    },
    /** Restore exact state captured by getState(). */
    setState(s) {
      state = s >>> 0;
    },
    /**
     * Derive an independent child stream, deterministically, without disturbing this stream's
     * future beyond one draw. Same parent state → same child seed → reproducible sub-streams.
     */
    fork() {
      return createRng(nextU32());
    },
  };
  return rng;
}


// ===== src/sim/stage.js =====
// stage.js — the stage runtime (DESIGN-SEED M3: a beatable stage). Binds tilemap + player +
// enemies + drops + contact damage (with i-frames & knockback) + camera + the clear condition into
// one deterministic step. Drives from a stage definition (tiles + spawn markers). The headless
// seeded stage-clear bot (test) advances this exact step — "beatable" means the bot reaches the
// exit, not an assertion. Boss integration lands in the next increment; pre-boss clear = reach exit.


/** Derive movement/action intent from an InputState for this tick. */
function deriveIntent(input) {
  const left = input.isDown(ACTIONS.LEFT);
  const right = input.isDown(ACTIONS.RIGHT);
  return {
    moveDir: (right ? 1 : 0) - (left ? 1 : 0),
    jumpPressed: input.pressed(ACTIONS.JUMP),
    jumpHeld: input.isDown(ACTIONS.JUMP),
    attackPressed: input.pressed(ACTIONS.ATTACK),
    attackDown: input.isDown(ACTIONS.ATTACK), // for charge hold
    down: input.isDown(ACTIONS.DOWN),         // for downthrust (air+down+attack)
    subweaponPressed: input.pressed(ACTIONS.SUBWEAPON),
    up: input.isDown(ACTIONS.UP),
    rest: input.pressed(ACTIONS.DOWN), // rest at a checkpoint
    // dodge: single-button (accessibility) OR a d-pad double-tap
    dodge: input.pressed(ACTIONS.DODGE) || input.doubleTapped(ACTIONS.LEFT) || input.doubleTapped(ACTIONS.RIGHT),
  };
}

// Spawn-marker legend (non-solid tiles read by the loader).
const MARKERS = { p: 'player', w: 'walker', h: 'hopper', x: 'exit', B: 'boss', c: 'checkpoint' };
// Kit-unlock pickups: a marker letter → the move it grants.
const UNLOCK_MARKERS = { C: 'charged', D: 'downthrust', J: 'doubleJump', P: 'projectile', S: 'subweapon' };

/** Player collision/hurt AABB (top-left), feet at player.y. */
function playerAabb(player, body = PLAYER_HALF) {
  return { x: player.x - body.halfW, y: player.y - body.halfH * 2, w: body.halfW * 2, h: body.halfH * 2 };
}

/**
 * Build a stage runtime from a definition.
 * @param {object} def - {rows:string[], startXp?, weaponId?}
 * @param {object} [opts] - {seed, vw, vh}
 */
function createStage(def, { seed = 'stage', vw = 256, vh = 240, settings } = {}) {
  const tilemap = createTilemap(def.rows);
  const ts = tilemap.tileSize;
  const rng = createRng(seed);

  let playerSpawn = { x: ts * 2, y: tilemap.worldHeight - ts };
  let exitX = tilemap.worldWidth - ts;
  const enemies = [];
  const checkpoints = [];
  const unlockPickups = [];
  let boss = null;

  for (const cell of tilemap.findCells((ch) => MARKERS[ch])) {
    const feetY = cell.y + ts; // marker sits on the tile; feet at its bottom
    switch (MARKERS[cell.ch]) {
      case 'player': playerSpawn = { x: cell.x + ts / 2, y: feetY }; break;
      case 'exit': exitX = cell.x + ts / 2; break;
      case 'walker': enemies.push(createEnemy('walker', cell.x + ts / 2, feetY, FACING.LEFT)); break;
      case 'hopper': enemies.push(createEnemy('hopper', cell.x + ts / 2, feetY, FACING.LEFT)); break;
      case 'boss': boss = createBoss(cell.x + ts / 2, feetY, FACING.LEFT); break;
      case 'checkpoint': checkpoints.push({ x: cell.x + ts / 2, y: feetY }); break;
      default: break;
    }
  }
  for (const cell of tilemap.findCells((ch) => UNLOCK_MARKERS[ch])) {
    unlockPickups.push({ x: cell.x + ts / 2, y: cell.y + ts - 8, move: UNLOCK_MARKERS[cell.ch], collected: false });
  }

  // M11 guarded exploration pickups: a unique sits on the surface at a given tile column. Y is the
  // topmost solid surface in that column (feet-height), so it reads like the kit-unlock pickups.
  const uniquePickups = [];
  for (const p of def.uniquePickups || []) {
    const tx = clamp(Math.floor(p.col), 0, tilemap.w - 1);
    let surfaceY = tilemap.worldHeight - ts; // fallback: bottom row
    for (let ty = 0; ty < tilemap.h; ty++) {
      if (tilemap.solidAt(tx, ty) && !tilemap.solidAt(tx, ty - 1)) { surfaceY = ty * ts; break; }
    }
    uniquePickups.push({ x: tx * ts + ts / 2, y: surfaceY - 8, id: p.id, collected: false });
  }

  const player = createPlayer(playerSpawn.x, playerSpawn.y);
  // Support detection: a spawn sitting on solid ground starts grounded so the first jump is not
  // misclassified as an item air jump. Invalid airborne spawns stay airborne.
  player.onGround = isGrounded(playerAabb(player), tilemap);
  return {
    tilemap,
    world: { tilemap, body: PLAYER_HALF },
    rng,
    player,
    spawn: playerSpawn,
    progress: createProgress(def.startXp ?? 0),
    loadout: createLoadout({ weaponId: def.weaponId }),
    inventory: createInventory({ weapons: def.weaponId ? [def.weaponId] : undefined }),
    menu: createMenu(),
    attack: createAttack(),
    kit: createKit(def.kit),
    charge: { ticks: 0 },
    unlockPickups,
    uniquePickups,
    bossDropId: def.bossDrop || null, // M11: the unique this stage's boss grants on its first kill
    theme: def.theme || 'cemetery', // M12-ART: stage sub-palette id (stagerender reads it)
    seed, // M12-ART: also seeds deterministic environmental dressing / parallax layout
    projectiles: [],
    subResource: 3,
    subResourceMax: 3,
    enemies,
    boss,
    drops: [],
    gold: 30,
    iframes: 0,
    camera: { x: 0, y: 0 },
    vw, vh,
    settings: settings || createSettings(),
    exitX,
    // --- Souls layer ---
    checkpoints,
    respawnPoint: { ...playerSpawn },  // last activated checkpoint (spawn until one is touched)
    activeCheckpoint: -1,
    marker: null,                       // single death marker holding at-risk XP
    deaths: 0,
    cleared: false,
    dead: false,
    events: [],
    // Durable, read-only presentation hook: survives catch-up ticks that replace s.events.
    airJumpPresentation: { serial: 0, x: 0, y: 0 },
  };
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

const RESPAWN_GRACE = 60; // ticks of invuln after respawn

/**
 * Apply damage to a melee/projectile target (an enemy index or 'boss'). Emits hit/kill/defeat +
 * XP/gold/level events and seeded heal drops. Shared by melee swings and projectiles.
 */
function applyDamageToTarget(s, id, dmg, events) {
  if (id === 'boss') {
    const r = damageBoss(s.boss, dmg);
