  for (let i = 0; i < frames.length; i++) {
    const frame = frames[i];
    const assetId = frame.animation ? playerStripAssetId(frame.animation) : (frame.asset || base.asset);
    const fallback = kind === 'hero' ? PLAYER_R : base.fallback;
    const visual = (assetReady(assetId) && getAsset(assetId)) || fallback;
    const width = frameWidthFor(visual) || visual.w;
    const x = i * cellW + Math.floor(cellW / 2);
    let wx = Math.round(x - width / 2);
    let wy = groundedVisualY(surfaceY, visual);
    ctx.fillStyle = i % 2 ? PALETTE['2'] : PALETTE['1'];
    ctx.fillRect(i * cellW, 18, cellW, surfaceY - 18);
    const flip = kind === 'hero'; // certified canonical-left strip; proof action faces right.
    let frameAnchor = null;
    if (kind === 'hero' && visual.frameAnchors) {
      const placement = playerFramePlacement(visual, frame.frame || 0, x, surfaceY, flip);
      wx = placement.x;
      wy = placement.y;
      frameAnchor = placement.anchor;
    }
    if (kind === 'boss') drawCharacterPuppet(ctx, assetId, fallback, x, surfaceY, { x: 0, y: 0 }, false, frame.pose);
    else drawCharacterPosed(ctx, assetId, fallback, wx, wy, { x: 0, y: 0 }, flip, frame.pose, frame.frame || 0);
    if (frame.tell) drawAttackTell(ctx, x, wy, { x: 0, y: 0 }, 'windup', 1, true, kind === 'boss' ? 2 : 1);
    if (frame.dust) drawProofDust(ctx, x - 3, surfaceY, 1);
    if (frame.shockwave) drawProofBurst(ctx, x + 18, surfaceY, 1, false);
    if (frame.impact) drawProofBurst(ctx, x, surfaceY - Math.max(8, Math.floor((visual.height || visual.h) / 2)), 1, false);
    if (frame.dissolve) drawProofBurst(ctx, x, surfaceY, 1, true);
    ctx.fillStyle = PALETTE['6'];
    ctx.fillRect(i * cellW, surfaceY, cellW, 1);
    ctx.fillStyle = PALETTE['8'];
    ctx.fillRect(i * cellW, surfaceY + 1, cellW, 15);
    const labelX = i * cellW + Math.max(2, Math.floor((cellW - textWidth(frame.label)) / 2));
    drawPixelText(ctx, frame.label, labelX, 126, frame.tell ? PALETTE['c'] : PALETTE['6']);
    const bottomInset = visual.bottomInset || 0;
    const opaqueBottomRow = frameAnchor
      ? Math.round(wy + frameAnchor.y)
      : Math.round(wy + (visual.height || visual.h) - bottomInset - 1);
    LAST_ANIMATION_CONTACTS.push({
      kind, pose: frame.label.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
      surfaceRow: surfaceY, opaqueBottomRow, gap: surfaceY - opaqueBottomRow,
    });
  }
  return LAST_ANIMATION_CONTACTS.map((contact) => ({ ...contact }));
}

function animationContactSnapshot() {
  return LAST_ANIMATION_CONTACTS.map((contact) => ({ ...contact }));
}

/** Build the tile key-remap for a theme: recolor neutral stone/moss keys into the sub-palette. */
function tileRemap(theme) {
  return {
    '7': theme.ground, '8': theme.groundDark, '6': theme.groundHi, '1': theme.sky[1],
    e: theme.moss, d: theme.groundDark, q: theme.accent,
  };
}

/** Draw one curated Willibab masonry face, then give each world tile its own wear, room tint, and
 * ambient drop. The licensed face is still blitted unmodified; material is composited around/over
 * it, as approved by the PoC. */
function drawEnvironmentTile(ctx, theme, fallback, wx, wy, cam, surface, tx, ty, remap) {
  const ox = Math.round(wx - cam.x);
  const oy = Math.round(wy - cam.y);
  if (drawAsset(ctx, theme.tileAsset, wx, wy, cam, false)) {
    // Curated payload has already landed byte-for-byte. Everything below is a deterministic
    // world-space material/light response; identical source tiles no longer read as wallpaper.
  } else {
    blitTinted(ctx, fallback, wx, wy, cam, remap);
  }
  const coarse = stageMaterialField(`${theme.name}:ground:coarse`, 4);
  const fine = stageMaterialField(`${theme.name}:ground:fine`, 3);
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = PALETTE[theme.gap];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const worldX = wx + x; const worldY = wy + y;
    const wear = coarse(worldX * 0.055, worldY * 0.09) - 0.5;
    const tileWear = ((((tx * 37 + ty * 19) >>> 0) % 11) - 5) * 0.012;
    ctx.globalAlpha = Math.max(0.30, Math.min(0.80, 0.44 + y / 16 * 0.30 - wear * 0.20 + tileWear));
    ctx.fillRect(ox + x, oy + y, 1, 1);
  }
  ctx.restore();
  // Fine pitting and worn catches are ordered-dithered in world space.
  ctx.save();
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const worldX = wx + x; const worldY = wy + y;
    const pit = fine(worldX * 0.31, worldY * 0.31);
    if (pit > 0.66 && lightBayerAt(worldX, worldY) < (pit - 0.66) * 2.2) {
      ctx.globalAlpha = 0.26; ctx.fillStyle = PALETTE[theme.groundDark]; ctx.fillRect(ox + x, oy + y, 1, 1);
    } else if (pit < 0.34 && lightBayerAt(worldX, worldY) > 0.72) {
      ctx.globalAlpha = 0.13; ctx.fillStyle = PALETTE[theme.groundHi]; ctx.fillRect(ox + x, oy + y, 1, 1);
    }
  }
  ctx.restore();
  if (!surface) return;
  ctx.fillStyle = PALETTE[theme.edge];
  ctx.fillRect(ox, oy, 16, 1);               // lit standable lip survives the ambient drop
  ctx.fillStyle = PALETTE[theme.groundHi];
  ctx.fillRect(ox, oy + 1, 16, 1);
  // Contact AO under the lip is the walkable-vs-blocked depth cue at gameplay camera scale.
  ctx.save();
  ctx.fillStyle = PALETTE['0'];
  for (let y = 2; y < 9; y++) {
    ctx.globalAlpha = 0.32 * (1 - (y - 2) / 7);
    ctx.fillRect(ox, oy + y, 16, 1);
  }
  ctx.restore();
  // One restrained moss cluster per tile, offset by world tile coordinates.
  ctx.fillStyle = PALETTE[theme.moss];
  const mx = 2 + ((tx * 5 + ty * 3) % 10);
  ctx.fillRect(ox + mx, oy + 1, 3, 1);
}

function drawBackdropMaterial(ctx, theme, cam, vw, vh, horizon, seed) {
  const image = ctx.createImageData(vw, vh);
  const data = image.data;
  const clouds = stageMaterialField(`${seed}:${theme.name}:clouds`, 4);
  const skyRamp = theme.backdrop;
  const gapRgb = hexToRgb(PALETTE[theme.gap]);
  for (let y = 0; y < vh; y++) for (let x = 0; x < vw; x++) {
    const index = (y * vw + x) * 4;
    let rgb = gapRgb;
    if (y < horizon) {
      // Backdrop has its own slow world plane. Camera and material advance together, so neither
      // fbm nor the Bayer threshold can shimmer in screen space.
      const worldX = x + Math.round(cam.x * 0.08);
      const worldY = y + Math.round(cam.y * 0.08);
      const vertical = 0.05 + y / Math.max(1, horizon - 1) * 0.84;
      const band = Math.max(0, 1 - Math.abs(y - horizon * 0.61) / (horizon * 0.55));
      const cloud = (clouds(worldX * 0.020, worldY * 0.055) - 0.5) * 0.42 * band;
      rgb = hexToRgb(PALETTE[materialRampKey(skyRamp, Math.max(0, Math.min(1, vertical + cloud)), worldX, worldY)]);
    }
    data[index] = rgb[0]; data[index + 1] = rgb[1]; data[index + 2] = rgb[2]; data[index + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
}

function drawRuinMaterialShape(ctx, sil, sx, top, ramp, layerSeed) {
  const noise = stageMaterialField(`${layerSeed}:${sil.kind}:${sil.x}`, 4);
  const paint = (screenX, screenY, localX, localY, width, height) => {
    const worldX = Math.round(sil.x + localX);
    const worldY = Math.round(top + localY);
    const u = localX / Math.max(1, width - 1); const v = localY / Math.max(1, height - 1);
    let amount = 0.30 + (1 - v) * 0.18 + (1 - u) * 0.08;
    amount += (noise(worldX * 0.085, worldY * 0.085) - 0.5) * 0.34;
    amount += (noise(worldX * 0.36, worldY * 0.36) - 0.5) * 0.12;
    if ((worldY % 7 + 7) % 7 === 0) amount -= 0.20;
    if ((worldX + Math.floor(worldY / 7) * 5) % 13 === 0) amount -= 0.10;
    if (localX === 0) amount += 0.14; // cold rim on the key-facing edge
    ctx.fillStyle = PALETTE[materialRampKey(ramp, Math.max(0, Math.min(1, amount)), worldX, worldY)];
    ctx.fillRect(screenX, screenY, 1, 1);
  };
  const rect = (x, y, w, h) => {
    for (let localY = 0; localY < h; localY++) for (let localX = 0; localX < w; localX++) {
      paint(x + localX, y + localY, x - sx + localX, y - top + localY, sil.w, sil.h);
    }
  };
  if (sil.kind === 'spire') {
    for (let row = 0; row < sil.h; row++) {
      const progress = row / sil.h;
      const width = Math.max(2, Math.round(sil.w * (0.22 + 0.78 * progress)));
      const offset = Math.round((sil.w - width) / 2);
      for (let x = 0; x < width; x++) paint(sx + offset + x, top + row, offset + x, row, sil.w, sil.h);
    }
    return;
  }
  if (sil.kind === 'arch') {
    const pier = Math.max(3, Math.floor(sil.w / 5));
    rect(sx, top + 6, pier, sil.h - 6);
    rect(sx + sil.w - pier, top + 6, pier, sil.h - 6);
    rect(sx, top, sil.w, 7);
    // Pointed spandrel leaves a genuine lancet void showing the dithered sky behind it.
    const inner = sil.w / 2 - pier; const span = Math.min(14, sil.h - 7);
    for (let row = 0; row < span; row++) {
      const voidHalf = inner * Math.min(1, Math.pow(row / Math.max(1, span), 0.62));
      for (let x = -Math.floor(inner); x <= Math.floor(inner); x++) {
        if (Math.abs(x) < voidHalf) continue;
        paint(Math.round(sx + sil.w / 2 + x), top + 7 + row, Math.round(sil.w / 2 + x), 7 + row, sil.w, sil.h);
      }
    }
    return;
  }
  rect(sx, top, sil.w, sil.h);
  if (sil.kind === 'tomb') rect(sx + 2, top - 3, Math.max(1, sil.w - 4), 3);
  else {
    const merlonWidth = sil.kind === 'tower' ? 4 : 6;
    for (let x = 0; x < sil.w; x += merlonWidth * 2) {
      // Fixed missing teeth keep the silhouette ruined rather than kit-like.
      if (((x / merlonWidth) + sil.x) % 5 === 0) continue;
      rect(sx + x, top - 4, Math.min(merlonWidth, sil.w - x), 4);
    }
  }
}

/** Textured masonry silhouettes with courses, broken merlons, cold rims, and open lancet voids. */
function drawRuinLayer(ctx, layout, cameraX, factor, baseY, ramp, alpha, vw, layerSeed) {
  ctx.save();
  ctx.globalAlpha = alpha;
  for (const sil of layout) {
    const sx = Math.round(sil.x - cameraX * factor);
    if (sx + sil.w < 0 || sx > vw) continue;
    const top = baseY - sil.h;
    drawRuinMaterialShape(ctx, sil, sx, top, ramp, layerSeed);
  }
  ctx.restore();
}

function drawStage(ctx, s, vw, vh) {
  LAST_GROUND_CONTACTS = [];
  const cam = s.camera;
  const tm = s.tilemap;
  const ts = tm.tileSize;
  const reduce = !!(s.settings && s.settings.reduceEffects); // flash/strobe caps (accessibility)
  const theme = themeFor(s.theme);
  const remap = tileRemap(theme);
  const rawSwing = attackVisualView(s.attack);
  const presentation = presentationFor(s, rawSwing);
  const lightFrame = createLightFrame(theme, cam, vw, vh, reduce);

  // --- Backdrop material: ordered night ramp + fbm cloud band, keyed to its slow world plane. ---
  const horizon = Math.floor(vh * 0.6);
  drawBackdropMaterial(ctx, theme, cam, vw, vh, horizon, s.seed || 'backdrop');

  // Two architectural depths with distinct parallax rates and values.
  if (!s._parallaxFar) s._parallaxFar = parallaxLayout(tm.worldWidth, s.theme, `${s.seed || 'p'}:far`);
  if (!s._parallaxNear) s._parallaxNear = parallaxLayout(tm.worldWidth, s.theme, `${s.seed || 'p'}:near`);
  drawRuinLayer(ctx, s._parallaxFar, cam.x, 0.16, horizon + 12,
    [theme.gap, theme.far, theme.backdrop[theme.backdrop.length - 1]], 0.78, vw, `${s.seed}:far`);
  drawRuinLayer(ctx, s._parallaxNear, cam.x, 0.38, horizon + 24,
    [theme.gap, theme.near, theme.groundDark, theme.ground], 0.96, vw, `${s.seed}:near`);

  // --- Tiles (themed tint; only the visible window). ---
  const tx0 = Math.max(0, Math.floor(cam.x / ts));
  const tx1 = Math.min(tm.w - 1, Math.floor((cam.x + vw) / ts));
  const ty0 = Math.max(0, Math.floor(cam.y / ts));
  const ty1 = Math.min(tm.h - 1, Math.floor((cam.y + vh) / ts));
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (!tm.solidAt(tx, ty)) continue;
      const surface = !tm.solidAt(tx, ty - 1); // exposed top → mossy cap
      drawEnvironmentTile(
        ctx, theme, surface ? TILE_GRASS : TILE_DIRT,
        tx * ts, ty * ts, cam, surface, tx, ty, remap,
      );
    }
  }

  // --- Ground dressing (deterministic, theme-gated). Drawn before entities so props sit behind. ---
  if (!s._dressing) s._dressing = computeDressing(tm, s.theme, s.seed || 'd');
  for (const dec of s._dressing) {
    const spr = DRESS_SPRITE[dec.kind];
    if (!spr) continue;
    // Wall torches throw a warm pool.
    if (dec.kind === 'torch') {
      registerLight(lightFrame, {
        kind: 'torch', x: dec.x, y: dec.y - spr.h + 2, floorY: dec.y,
        radius: 24, strength: 0.48, color: theme.torch, coreColor: 'p', seed: dec.seed,
      });
    }
    const assetId = DRESS_ASSET[dec.kind];
    const asset = assetId && getAsset(assetId);
    const alpha = dec.kind === 'gargoyle' ? 0.72 : 0.92;
    if (!asset || !drawAssetAlpha(
      ctx, assetId, dec.x - asset.width / 2, dec.y - asset.height, cam, false, alpha,
    )) {
      blit(ctx, spr, dec.x - spr.w / 2, dec.y - spr.h, cam);
    }
  }

  // Checkpoints register a practical light; the active one has the stronger rig.
  for (let i = 0; i < s.checkpoints.length; i++) {
    const cp = s.checkpoints[i];
    registerLight(lightFrame, {
      kind: 'checkpoint', x: cp.x, y: cp.y - CHECKPOINT.h + 4, floorY: cp.y,
      radius: i === s.activeCheckpoint ? 34 : 26,
      strength: i === s.activeCheckpoint ? 0.62 : 0.38,
      color: theme.torch, coreColor: 'p', seed: i + 31,
    });
    if (i === s.activeCheckpoint) blitSilhouette(ctx, CHECKPOINT, cp.x - CHECKPOINT.w / 2, cp.y - CHECKPOINT.h, cam, PALETTE['c']);
    else blit(ctx, CHECKPOINT, cp.x - CHECKPOINT.w / 2, cp.y - CHECKPOINT.h, cam);
  }

  // Death marker (pulses; spectral glow).
  if (s.marker) {
    const pulse = Math.floor(cam.x + s.marker.x) % 24 < 12 ? PALETTE['u'] : PALETTE['5'];
    registerLight(lightFrame, {
      kind: 'marker', x: s.marker.x, y: s.marker.y - MARKER.h - 6, floorY: s.marker.y,
      radius: 30, strength: 0.52, color: 't', coreColor: 'u', seed: 73,
    });
    blitSilhouette(ctx, MARKER, s.marker.x - MARKER.w / 2, s.marker.y - MARKER.h - 6, cam, pulse);
  }

  // Kit-unlock pickups.
  for (const u of s.unlockPickups) {
    if (u.collected) continue;
    blit(ctx, UNLOCK, u.x - UNLOCK.w / 2, u.y - UNLOCK.h, cam);
  }

  // Projectiles.
  for (const pr of s.projectiles) {
    ctx.fillStyle = pr.kind === 'sub' ? PALETTE['b'] : PALETTE['5'];
    ctx.fillRect(Math.round(pr.x - pr.w / 2 - cam.x), Math.round(pr.y - pr.h / 2 - cam.y), pr.w, pr.h);
  }

  // Drops.
  for (const d of s.drops) {
    if (d.collected) continue;
    blit(ctx, DROP_HEAL, d.x - DROP_HEAL.w / 2, d.y - DROP_HEAL.h, cam);
  }

  // Enemies. Themed skins + multi-frame strips; states wired to real sim signals.
  for (const e of s.enemies) {
    if (!e.alive) continue;
    const isHopper = e.type.id === 'hopper';
    const state = enemyVisualState(e, s.player, s.iframes);
    const assetId = enemyAssetFor(e, s.theme, state);
    const fallback = e.facing === FACING.LEFT
      ? (isHopper ? HOPPER_L : WALKER_L)
      : (isHopper ? HOPPER_R : WALKER_R);
    const asset = assetReady(assetId) ? getAsset(assetId) : null;
    const visual = asset || fallback;
    const fw = asset ? (asset.frameWidth || asset.width) : fallback.w;
    const attackPose = presentation.trashStrike > 0 && presentation.strikeTarget === e
      ? { phase: 'strike', lean: e.facing * 4, squash: 1, shift: e.facing * 2 }
      : enemyAttackPresentation(e, s.player, s.iframes);
    const recoil = !reduce && e.hitFlash > 0 ? Math.sign(e.x - s.player.x || -e.facing) * (e.hitFlash >= 4 ? 2 : 1) : 0;
    const wx = e.x - fw / 2 + recoil;
    const wy = groundedVisualY(e.y, visual);
    const flip = e.facing === FACING.LEFT;
    const posed = { ...attackPose };
    if (e.hitFlash > 0) {
      posed.lean = Math.sign(e.x - s.player.x || -e.facing) * 4;
    }
    const frame = enemyFrameFor(assetId, PLAYER_RENDER_TICK);
    drawCharacterPosed(ctx, assetId, fallback, wx, wy, cam, flip, posed, frame);
    drawAttackTell(ctx, e.x, wy, cam, attackPose.phase, e.facing, reduce);
    recordGroundContact(isHopper ? 'hopper' : 'walker', e, wx + (posed.shift || 0), wy, visual, cam, vw, vh);
  }

  // Boss with its telegraph tell.
  if (s.boss && s.boss.alive) {
    const b = s.boss;
    const bossAssetId = 'boss';
    const fallback = b.facing === FACING.LEFT ? BOSS_L : BOSS_R;
    const bossAsset = assetReady(bossAssetId) ? getAsset(bossAssetId) : null;
    const bossVisual = bossAsset || fallback;
    const bw = bossAsset ? bossAsset.width : fallback.w;
    const wx = b.x - bw / 2;
    const wy = groundedVisualY(b.y, bossVisual);
    const flip = b.facing === FACING.LEFT;
    const bossPose = bossPuppetPose(b, PLAYER_RENDER_TICK, reduce);
    drawCharacterPuppet(ctx, bossAssetId, fallback, b.x, b.y, cam, flip, bossPose);
    recordGroundContact('boss', b, wx, wy, bossVisual, cam, vw, vh);
    if (b.phase === BOSS_PHASE.TELEGRAPH) {
      drawAttackTell(ctx, b.x, wy, cam, 'windup', b.facing, reduce, 2);
    }
    // Boss HP pip bar above (chunky border in the register).
    const pipW = 24;
    const pips = Math.ceil((b.hp / BOSS_STATS.hp) * pipW);
    ctx.fillStyle = PALETTE['0'];
    ctx.fillRect(Math.round(b.x - cam.x - pipW / 2 - 1), Math.round(wy - cam.y - 13), pipW + 2, 5);
    ctx.fillStyle = PALETTE['8'];
    ctx.fillRect(Math.round(b.x - cam.x - pipW / 2), Math.round(wy - cam.y - 12), pipW, 3);
    ctx.fillStyle = PALETTE['g'];
    ctx.fillRect(Math.round(b.x - cam.x - pipW / 2), Math.round(wy - cam.y - 12), Math.max(0, pips), 3);
  }

  // Player (blink during i-frames).
  const swing = presentation.hitstop > 0 && presentation.heldSwingFrame >= 0
    ? { active: true, frame: presentation.heldSwingFrame }
    : rawSwing;
  const swingFrame = reduce && swing.active ? 2 : swing.frame;
  const hurt = presentation.hurt > 0;
  const playerAnimation = playerAnimationViewFor(
    s.player,
    swing.active ? { active: true, frame: swingFrame } : swing,
    PLAYER_RENDER_TICK,
    {
      reduceEffects: reduce,
      hurtTicks: hurt ? presentation.hurt : 0,
      landTicks: presentation.land,
      moveTicks: presentation.moveTicks,
      swingType: s.attack?.swingType || 'normal',
    },
  );
  const playerAssetId = playerAnimation.asset;
  const pFallback = s.player.facing === FACING.LEFT ? PLAYER_L : PLAYER_R;
  const playerAsset = assetReady(playerAssetId) ? getAsset(playerAssetId) : null;
  const playerVisual = playerAsset || pFallback;
  const playerPose = {};
  // Certified strips are authored canonical-left. The whole frame—including face, blade, slash
  // arc, and dash trail—is mirrored as one unit for right-facing play.
  const playerFlip = s.player.facing === FACING.RIGHT;
  const placement = playerAsset
    ? playerFramePlacement(playerAsset, playerAnimation.frame, s.player.x, s.player.y, playerFlip)
    : { x: s.player.x - pFallback.w / 2, y: groundedVisualY(s.player.y, pFallback), anchor: null };
  const pwx = placement.x;
  const pwy = placement.y;
  // I-frame feedback: a blink normally; under reduce-effects, draw steadily (no strobe) — the HUD
  // and knockback already signal the hit.
  let playerDrawn = false;
  let playerAssetDrawn = false;
  if (hurt) {
    playerAssetDrawn = drawCharacterPosed(ctx, playerAssetId, pFallback, pwx, pwy, cam, playerFlip, playerPose, playerAnimation.frame);
    playerDrawn = true;
  } else if (reduce || !(s.iframes > 0 && Math.floor(s.iframes / 3) % 2 === 0)) {
    playerAssetDrawn = drawCharacterPosed(ctx, playerAssetId, pFallback, pwx, pwy, cam, playerFlip, playerPose, playerAnimation.frame);
    playerDrawn = true;
  }
  if (playerDrawn && !s._proofDisableHeroConform) {
    const alphaMask = playerAssetDrawn
      ? heroAssetAlphaMask(playerAsset, playerAnimation.frame)
      : heroFallbackAlphaMask(pFallback);
    if (alphaMask) registerHeroLayer(lightFrame, {
      x: pwx, y: pwy,
      width: playerAssetDrawn ? frameWidthFor(playerAsset) : pFallback.w,
      height: playerAssetDrawn ? playerAsset.height : pFallback.h,
      alphaMask,
      flip: playerAssetDrawn ? playerFlip : false,
    });
  }
  if (swing.active && !hurt) {
    if (swingFrame === 0) drawAttackTell(ctx, s.player.x, pwy, cam, 'windup', s.player.facing, reduce);
  }
  recordGroundContact('hero', s.player, pwx, pwy, playerVisual, cam, vw, vh, placement.anchor);
  drawPresentationEffects(ctx, presentation, cam, s.theme, reduce);
  for (const emitter of presentation.eventLights) registerLight(lightFrame, emitter);
  applyLightPass(ctx, lightFrame);
  if (!PROOF_PRESENTATION_FROZEN) {
    PLAYER_RENDER_TICK++;
    advancePresentation(presentation);
  }
}


// ===== src/render/chrome.js =====
// chrome.js — UI chrome in the M12-ART register (DIRECTIONS: "HUD panels go dark stone/parchment
// with chunky pixel borders — no default-web styling"). One reusable beveled-panel drawer shared by
// the HUD and the menu so every framed surface reads as carved stone or parchment, lit from the
// upper-left like the sprites. Pure canvas draw; palette-keyed so it never leaves the register.


/**
 * Draw a carved material panel: fbm stone/bone, notched corners, directional bevels, recessed
 * groove, rivets, and a shadow cast onto the world. All colors remain in the global register.
 * @param {CanvasRenderingContext2D} ctx
 * @param {number} x @param {number} y @param {number} w @param {number} h
 * @param {{fill?:string, light?:string, dark?:string, ink?:string}} [opts]
 */
function drawPanel(ctx, x, y, w, h, opts = {}) {
  const {
    fill = '8', light = '6', dark = '1', ink = '0', ramp = RAMPS.stone, seed = 31,
  } = opts;
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const noise = materialFbm(seed, 4);
  const missing = (px, py) => {
    const lx = px - x; const ly = py - y;
    const rx = w - 1 - lx; const ry = h - 1 - ly;
    return (lx < 2 && ly < 2 && lx + ly < 2) || (rx < 2 && ly < 2 && rx + ly < 2)
      || (lx < 2 && ry < 2 && lx + ry < 2) || (rx < 2 && ry < 2 && rx + ry < 2);
  };
  // A compact shadow makes the HUD read as an object above the scene.
  ctx.save();
  ctx.globalAlpha = 0.36; ctx.fillStyle = PALETTE[ink];
  ctx.fillRect(x + 2, y + h, w - 1, 2); ctx.fillRect(x + w, y + 2, 2, h - 1);
  ctx.restore();
  for (let py = y; py < y + h; py++) for (let px = x; px < x + w; px++) {
    if (missing(px, py)) continue;
    const u = (px - x) / Math.max(1, w - 1); const v = (py - y) / Math.max(1, h - 1);
    let amount = 0.44 - v * 0.20 - u * 0.06;
    amount += (noise(px * 0.13, py * 0.13) - 0.5) * 0.30;
    amount += (noise(px * 0.45, py * 0.45) - 0.5) * 0.13;
    ctx.fillStyle = PALETTE[materialRampKey(ramp, Math.max(0, Math.min(1, amount)), px, py)] || PALETTE[fill];
    ctx.fillRect(px, py, 1, 1);
  }
  // Chamfer-aware outline.
  ctx.fillStyle = PALETTE[ink];
  ctx.fillRect(x + 2, y, w - 4, 1); ctx.fillRect(x + 2, y + h - 1, w - 4, 1);
  ctx.fillRect(x, y + 2, 1, h - 4); ctx.fillRect(x + w - 1, y + 2, 1, h - 4);
  ctx.fillRect(x + 1, y + 1, 1, 1); ctx.fillRect(x + w - 2, y + 1, 1, 1);
  ctx.fillRect(x + 1, y + h - 2, 1, 1); ctx.fillRect(x + w - 2, y + h - 2, 1, 1);
  // Upper-left bevel and lower-right turn into shadow.
  ctx.fillStyle = PALETTE[light];
  ctx.globalAlpha = 0.56; ctx.fillRect(x + 3, y + 1, w - 6, 1); ctx.fillRect(x + 1, y + 3, 1, h - 6);
  ctx.fillStyle = PALETTE[dark];
  ctx.globalAlpha = 0.78; ctx.fillRect(x + 3, y + h - 2, w - 6, 1); ctx.fillRect(x + w - 2, y + 3, 1, h - 6);
  // Recessed inner groove.
  ctx.fillStyle = PALETTE[ink]; ctx.globalAlpha = 0.50;
  ctx.fillRect(x + 3, y + 3, w - 6, 1); ctx.fillRect(x + 3, y + 3, 1, h - 6);
  ctx.fillStyle = PALETTE[light]; ctx.globalAlpha = 0.22;
  ctx.fillRect(x + 3, y + h - 4, w - 6, 1); ctx.fillRect(x + w - 4, y + 3, 1, h - 6);
  ctx.globalAlpha = 1;
  // Four one-pixel iron rivets, each with its own underside.
  for (const [rx, ry] of [[x + 4, y + 4], [x + w - 5, y + 4], [x + 4, y + h - 5], [x + w - 5, y + h - 5]]) {
    ctx.fillStyle = PALETTE[light]; ctx.fillRect(rx, ry, 1, 1);
    if (ry + 1 < y + h - 1) { ctx.fillStyle = PALETTE[ink]; ctx.globalAlpha = 0.55; ctx.fillRect(rx, ry + 1, 1, 1); ctx.globalAlpha = 1; }
  }
}

/** Stone panel preset (dark HUD chrome). */
function drawStonePanel(ctx, x, y, w, h) {
  drawPanel(ctx, x, y, w, h, { fill: '8', light: '6', dark: '1', ink: '0', ramp: RAMPS.stone, seed: 31 + x * 3 + y });
}

/** Compact carved frame for a persistent screen-wide scrim. It keeps the same notch, cast-shadow,
 * upper-left bevel, lower-right shade, and iron-rivet language as drawPanel without running a deep
 * material sample under an area that the opaque text channel immediately covers. */
function drawCarvedScrimFrame(ctx, x, y, w, h) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  ctx.save();
  ctx.globalAlpha = 0.36; ctx.fillStyle = PALETTE['0'];
  ctx.fillRect(x + 2, y + h, w - 1, 2); ctx.fillRect(x + w, y + 2, 2, h - 1);
  ctx.globalAlpha = 1; ctx.fillStyle = PALETTE['0'];
  ctx.fillRect(x + 2, y, w - 4, h); ctx.fillRect(x, y + 2, w, h - 4);
  ctx.fillStyle = PALETTE['8']; ctx.fillRect(x + 2, y + 1, w - 4, h - 2);
  ctx.fillRect(x + 1, y + 2, w - 2, h - 4);
  ctx.fillStyle = PALETTE['6']; ctx.globalAlpha = 0.56;
  ctx.fillRect(x + 3, y + 1, w - 6, 1); ctx.fillRect(x + 1, y + 3, 1, h - 6);
  ctx.fillStyle = PALETTE['1']; ctx.globalAlpha = 0.78;
  ctx.fillRect(x + 3, y + h - 2, w - 6, 1); ctx.fillRect(x + w - 2, y + 3, 1, h - 6);
  ctx.globalAlpha = 1;
  for (const [rx, ry] of [[x + 4, y + 4], [x + w - 5, y + 4], [x + 4, y + h - 5], [x + w - 5, y + h - 5]]) {
    ctx.fillStyle = PALETTE['6']; ctx.fillRect(rx, ry, 1, 1);
    ctx.fillStyle = PALETTE['0']; ctx.fillRect(rx, Math.min(y + h - 2, ry + 1), 1, 1);
  }
  ctx.restore();
}

/** Carved scrim with an opaque recessed interior: the same high-contrast backing used by the
 * persistent bottom HUD, exported so pause / menu / clear overlays can share the treatment.
 * A subtle 1-pixel stone dither can be requested to match the carved frame's material texture
 * without risking the text contrast of the gameplay HUD (which keeps the default flat interior). */
function drawOpaqueScrimPanel(ctx, x, y, w, h, opts = {}) {
  const { fillKey = '1', dither = false } = opts;
  drawCarvedScrimFrame(ctx, x, y, w, h);
  ctx.globalAlpha = 1;
  ctx.fillStyle = PALETTE[fillKey];
  ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
  if (dither) {
    const dk = '8';
    ctx.fillStyle = PALETTE[dk];
    for (let py = y + 3; py < y + h - 3; py += 2) {
      for (let px = x + 3 + (py & 1); px < x + w - 3; px += 2) {
        ctx.fillRect(px, py, 1, 1);
      }
    }
  }
}

/** Parchment panel preset (menu body — warm bone). */
function drawParchmentPanel(ctx, x, y, w, h) {
  drawPanel(ctx, x, y, w, h, { fill: 'l', light: 'j', dark: '9', ink: '0', ramp: RAMPS.bone, seed: 47 + x + y * 3 });
}

/** A torn bone nameplate: the weapon field is a second material recessed into the stone. */
function drawBoneNameplate(ctx, x, y, w, h, seed = 58) {
  const noise = materialFbm(seed, 4);
  ctx.fillStyle = PALETTE['0']; ctx.globalAlpha = 0.78;
  ctx.fillRect(x, y - 1, w, 1); ctx.fillRect(x, y + h, w, 1);
  ctx.globalAlpha = 1;
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    if (px >= w - 1 - (py & 1)) continue; // torn right edge
    let amount = 0.64 - py / Math.max(1, h - 1) * 0.36;
    amount += (noise((x + px) * 0.20, (y + py) * 0.30) - 0.5) * 0.34;
    ctx.fillStyle = PALETTE[materialRampKey(RAMPS.bone, Math.max(0, Math.min(1, amount)), x + px, y + py)];
    ctx.fillRect(x + px, y + py, 1, 1);
  }
  ctx.fillStyle = PALETTE['j']; ctx.globalAlpha = 0.42; ctx.fillRect(x, y, w - 2, 1); ctx.globalAlpha = 1;
}


// ===== src/render/menurender.js =====
// menurender.js — draws the action menu overlay (Items/Weapons/Equipment/Strength). Reads the menu
// state machine (menu.js) and the stage as ctx. Surfaces the equip-comparison delta on the
// weapons/equipment tabs. Monospace UI text. The menu PAUSES play (enforced by the loop).


function deltaStr(n) { return n > 0 ? `+${n}` : `${n}`; }

function drawMenu(ctx, m, s, vw, vh) {
  // dim the world
  ctx.fillStyle = 'rgba(8,8,20,0.72)';
  ctx.fillRect(0, 0, vw, vh);

  // Carved-stone frame in the register (chunky beveled border).
  const px = 20, py = 20, pw = vw - 40, ph = vh - 40;
  drawOpaqueScrimPanel(ctx, px, py, pw, ph);

  // Tab headers — active tab sits on a torch-lit sunk plate.
  let tx = px + 8;
  for (let i = 0; i < TABS.length; i++) {
    const active = i === m.tab;
    if (active) {
      const tw = textWidth(TAB_LABEL[TABS[i]]) + 6;
      ctx.fillStyle = PALETTE['0']; ctx.fillRect(tx - 3, py + 5, tw, 12);
      ctx.fillStyle = PALETTE['0']; ctx.fillRect(tx - 2, py + 6, tw - 2, 10);
    }
    drawPixelText(ctx, TAB_LABEL[TABS[i]], tx, py + 9, active ? PALETTE['c'] : PALETTE['j']);
    tx += textWidth(TAB_LABEL[TABS[i]]) + 8;
  }
  // Divider rule under the tabs.
  ctx.fillStyle = PALETTE['0']; ctx.fillRect(px + 4, py + 20, pw - 8, 1);
  ctx.fillStyle = PALETTE['4']; ctx.fillRect(px + 4, py + 21, pw - 8, 1);

  // Entries.
  const rows = entries(m, s);
  const tab = currentTab(m);
  let ey = py + 34;
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const sel = i === m.cursor;
    let textColor = sel ? PALETTE['c'] : PALETTE['j'];
    if (sel) drawPixelText(ctx, '>', px + 8, ey - 6, textColor);
    let label = row.name;
    if (tab === 'items') label += `  x${row.count}`;
    if ((tab === 'weapons' || tab === 'equipment') && row.equipped) label = `[E] ${label}`;
    if (tab === 'strength') label = `${row.name}`.padEnd(11) + `  ${row.value}`;
    if (tab === 'moves') {
      textColor = sel ? PALETTE['c'] : (row.unlocked ? PALETTE['j'] : PALETTE['4']);
      label = `${row.name}`.padEnd(16) + `  ${row.value}`;
    }
    let labelX = px + 18;
    // Curated weapon icon for the weapons tab (falls back to text-only in headless tests).
    if (tab === 'weapons') {
      const iconId = weaponIconFor(row.id);
      if (drawIcon(ctx, iconId, px + 18, ey - 7)) labelX = px + 34;
    }
    const labelRight = (tab === 'weapons' || tab === 'equipment') ? px + pw - 98 : px + pw - 4;
    drawPixelText(ctx, fitPixelText(label, labelRight - labelX), labelX, ey - 6, textColor);
    ey += 12;
  }

  // Equip-comparison delta for the highlighted weapon/equipment row.
  const cmp = compareAt(m, s);
  if (cmp) {
    const bx = px + pw - 92, by = py + 34;
    drawPixelText(ctx, 'vs equipped', bx, by - 6, PALETTE['j']);
    const dmgColor = cmp.dmgDelta > 0 ? PALETTE['c'] : cmp.dmgDelta < 0 ? PALETTE['o'] : PALETTE['j'];
    drawPixelText(ctx, `DMG ${deltaStr(cmp.dmgDelta)}`, bx, by + 6, dmgColor);
    const defColor = cmp.defDelta > 0 ? PALETTE['c'] : cmp.defDelta < 0 ? PALETTE['o'] : PALETTE['j'];
    drawPixelText(ctx, `DEF ${deltaStr(cmp.defDelta)}`, bx, by + 18, defColor);
    if (cmp.kindChange) drawPixelText(ctx, '(kind change)', bx, by + 30, PALETTE['b']);
  }

  // Footer hint.
  const footer = '↑↓ select  ←→ tab  J confirm  Enter close';
  drawPixelText(ctx, footer, Math.round((vw - textWidth(footer)) / 2), py + ph - 14, PALETTE['j']);
}


// ===== src/render/hud.js =====
// hud.js — the HUD (DESIGN-SEED HUD field spec: HP, XP, gold, equipped weapon; NES-clean but
// complete). XP-at-risk / sub-weapon / charge fields arrive with their systems (M4/M5); the model
// carries placeholders so the layout is stable. hudModel() is pure and headless-testable; drawHud()
// is the browser renderer. UI text is monospace (permitted).


const BOTTOM_HUD_TEXT_KEY = 'j';
const BOTTOM_HUD_SCRIM_KEY = '1';
const BOTTOM_HUD_SCRIM_OPACITY = 1;
const BOTTOM_HUD_CONTROL_TEXT = '←→/AD MOVE · K/SPACE JUMP · J ATTACK';
const BOTTOM_HUD_UTILITY_TEXT = 'ENTER MENU · ESC OPTIONS · ↓ REST AT WAYPOINT';
const BOTTOM_HUD_ASSIST_TEXT = 'STRUGGLING? ESC → ASSIST (HONEST HELP)';
const MARKER_LABEL_TEXT = 'REST AT WAYPOINT';
const MARKER_LABEL_TEXT_KEY = 'j';
const MARKER_LABEL_SCRIM_KEY = '1';
const MARKER_LABEL_SCRIM_OPACITY = 1;
const WAYPOINT_FLOATER_KIND = 'waypoint';

/** The marker plate owns waypoint feedback while it is visible. Keep the floater alive off-screen
 * so leaving plate range before its normal expiry restores the exact existing animation state. */
function floaterRenderModel(floaters, markerLabel) {
  if (!markerLabel) return floaters;
  return floaters.filter((floater) => floater.kind !== WAYPOINT_FLOATER_KIND);
}

/** Pure shipped view-model for the persistent bottom input hints. Keeping the state decision beside
 * the renderer lets gates drive the exact behavior used by boot.js instead of grepping a call site. */
function bottomHudModel(mode, game) {
  if (mode !== 'play' || !game || game.cleared) return Object.freeze([]);
  const lines = [];
  if (!game.settings?.assist && game.deaths >= 3) lines.push(BOTTOM_HUD_ASSIST_TEXT);
  lines.push(BOTTOM_HUD_CONTROL_TEXT, BOTTOM_HUD_UTILITY_TEXT);
  return Object.freeze(lines);
}

/** Pure geometry for the bottom input-hint chrome, shared by render tests/proof tooling. */
function bottomHudLayout(logicalW, logicalH, lineCount = 1) {
  const lines = Math.max(1, Math.floor(lineCount));
  const h = 12 + (lines - 1) * 8;
  return Object.freeze({ x: 4, y: logicalH - h - 2, w: logicalW - 8, h, textY: logicalH - h + 1 });
}

/** Carved bottom chrome with an opaque recessed channel: terrain luminance cannot enter the text
 * contrast calculation, including the brightest keep face. */
function drawBottomHud(ctx, lines, logicalW, logicalH) {
  const content = (Array.isArray(lines) ? lines : [lines]).filter(Boolean).map(String);
  const layout = bottomHudLayout(logicalW, logicalH, content.length);
  drawOpaqueScrimPanel(ctx, layout.x, layout.y, layout.w, layout.h, { fillKey: BOTTOM_HUD_SCRIM_KEY });
  for (let index = 0; index < content.length; index++) {
    const text = fitPixelText(content[index], layout.w - 12);
    const x = Math.round(logicalW / 2 - textWidth(text) / 2);
    drawPixelText(ctx, text, x, layout.textY + index * 8, PALETTE[BOTTOM_HUD_TEXT_KEY]);
  }
  return layout;
}

/** Contextual waypoint copy. This is display-only: markerHint supplies the same horizontal
 * distance query used by the death-marker HUD without changing checkpoint/rest mechanics. */
function markerLabelModel(game) {
  if (!game?.player || !game?.camera || !game?.checkpoints?.length) return null;
  let nearest = null;
  for (const checkpoint of game.checkpoints) {
    const hint = markerHint(checkpoint, game.player.x);
    if (!nearest || hint.dist < nearest.hint.dist) nearest = { checkpoint, hint };
  }
  if (!nearest || nearest.hint.dist > 18 || Math.abs(nearest.checkpoint.y - game.player.y) > 32) return null;
  return Object.freeze({
    text: MARKER_LABEL_TEXT,
    anchorX: Math.round(nearest.checkpoint.x - game.camera.x),
    anchorY: Math.round(nearest.checkpoint.y - game.camera.y - 28),
  });
}

/** Pure collision-safe geometry for the compact world-marker plate. bottomHudY is the top edge of
 * the live one- or two-line persistent bar, so the two chrome surfaces can never overlap. */
function markerLabelLayout(text, anchorX, anchorY, logicalW, bottomHudY) {
  const fitted = fitPixelText(String(text), logicalW - 20);
  const w = textWidth(fitted) + 12;
  const h = 12;
  const x = Math.max(4, Math.min(logicalW - w - 4, Math.round(anchorX - w / 2)));
  const y = Math.max(4, Math.min(bottomHudY - h - 2, Math.round(anchorY - h - 4)));
  return Object.freeze({ x, y, w, h, text: fitted, textY: y + 3 });
}

/** Opaque recessed marker-label channel in the same carved register as the bottom HUD. */
function drawMarkerLabel(ctx, model, logicalW, bottomHudY) {
  const layout = markerLabelLayout(model.text, model.anchorX, model.anchorY, logicalW, bottomHudY);
  drawOpaqueScrimPanel(ctx, layout.x, layout.y, layout.w, layout.h, { fillKey: MARKER_LABEL_SCRIM_KEY });
  const textX = Math.round(layout.x + layout.w / 2 - textWidth(layout.text) / 2);
  drawPixelText(ctx, layout.text, textX, layout.textY, PALETTE[MARKER_LABEL_TEXT_KEY]);
  return layout;
}

function hudPixelGlow(ctx, x, y, color) {
  ctx.save();
  ctx.fillStyle = color;
  for (let radius = 4; radius >= 1; radius--) {
    ctx.globalAlpha = 0.035 + (4 - radius) * 0.025;
    ctx.fillRect(x - radius, y - Math.floor(radius / 2), radius * 2 + 1, radius + 1);
  }
  ctx.restore();
}

/** Pure view-model of the HUD fields for a game state. */
function hudModel(game) {
  const { progress, loadout } = game;
  const maxHP = progress.stats.maxHP;
  return {
    hp: progress.hp,
    maxHP,
    hpPct: Math.max(0, Math.min(1, progress.hp / maxHP)),
    level: progress.level,
    xp: progress.totalXp,
    xpToNext: xpToNextLevel(progress.totalXp),
    xpAtRisk: xpAtRisk(progress),
    gold: game.gold,
    weaponName: loadout.weapon.name,
    bare: !!loadout.weapon.bare,
    marker: game.marker ? { xp: game.marker.xp, ...markerHint(game.marker, game.player.x) } : null,
  };
}

/** Draw the HUD to the logical 2d context. */
function drawHud(ctx, game, logicalW) {
  const m = hudModel(game);
  const reduce = !!game.settings?.reduceEffects;

  // Left stats panel: carved stone chrome behind the HP/XP/risk/marker fields. Its height grows with
  // the optional risk/marker lines so the border always wraps the content.
  const extra = (m.xpAtRisk > 0 ? 10 : 0) + (m.marker ? 10 : 0);
  drawStonePanel(ctx, 4, 4, 92, 40 + extra);

  // HP meter: recessed trough, ordered ramp fill, lit cap, specular head, and quantity ticks.
  const barX = 10, barY = 10, barW = 78, barH = 7;
  ctx.fillStyle = PALETTE['0'];
  ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
  ctx.fillStyle = PALETTE['1'];
  ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = PALETTE['0']; ctx.globalAlpha = 0.82; ctx.fillRect(barX, barY, barW, 1); ctx.globalAlpha = 1;
  const fillW = Math.round(barW * m.hpPct);
  for (let y = 0; y < barH; y++) for (let x = 0; x < fillW; x++) {
    const amount = 0.28 + x / Math.max(1, barW - 1) * 0.64 - y / barH * 0.30;
    ctx.fillStyle = PALETTE[materialRampKey(RAMPS.blood, Math.max(0, Math.min(1, amount)), barX + x, barY + y)];
    ctx.fillRect(barX + x, barY + y, 1, 1);
  }
  if (fillW > 0) {
    ctx.fillStyle = PALETTE['o']; ctx.globalAlpha = 0.62; ctx.fillRect(barX, barY, fillW, 1); ctx.globalAlpha = 1;
    ctx.fillStyle = PALETTE['p']; ctx.fillRect(barX + fillW - 1, barY + 1, 1, barH - 1);
    if (!reduce) hudPixelGlow(ctx, barX + fillW - 1, barY + Math.floor(barH / 2), PALETTE['o']);
  }
  ctx.fillStyle = PALETTE['0']; ctx.globalAlpha = 0.38;
  for (let x = 8; x < barW; x += 8) ctx.fillRect(barX + x, barY + barH - 2, 1, 2);
  ctx.globalAlpha = 1;

  drawIcon(ctx, 'icon_heart', barX, barY + barH + 8 - 7);
  drawPixelText(ctx, fitPixelText(`HP ${m.hp}/${m.maxHP}`, 70), barX + 12, barY + barH + 2, PALETTE['5']);

  // Level + XP.
  const nextText = fitPixelText(m.xpToNext > 0 ? `NEXT ${m.xpToNext}` : 'MAX', 54);
  const nextX = 93 - textWidth(nextText); // align the changing digits to the panel's right inset
  drawPixelText(ctx, fitPixelText(`LV ${m.level}`, nextX - barX - 3), barX, barY + barH + 12, PALETTE['c']);
  drawPixelText(ctx, nextText, nextX, barY + barH + 12, PALETTE['4']);

  // XP-at-risk counter (what a death would drop) — legibility fold.
  let row = barY + barH + 28;
  if (m.xpAtRisk > 0) {
    drawPixelText(ctx, fitPixelText(`RISK ${m.xpAtRisk}`, 82), barX, row - 6, PALETTE['n']); row += 10;
  }

  // Death-marker indicator: arrow toward the marker + XP it holds.
  if (m.marker) {
    const arrow = m.marker.dir < 0 ? '<' : '>';
    drawPixelText(ctx, fitPixelText(`${arrow} MARK ${m.marker.xp}`, 82), barX, row - 6, PALETTE['u']);
  }

  // Right chrome: gold + equipped-weapon panel.
  drawStonePanel(ctx, logicalW - 90, 4, 86, 26);
  const rightX = logicalW - 86;
  drawIcon(ctx, 'icon_coin', rightX, 14 - 7);
  drawPixelText(ctx, fitPixelText(`GLD ${m.gold}`, 67), rightX + 12, 8, PALETTE['b']);
  drawBoneNameplate(ctx, rightX - 1, 18, 80, 9);
  // Equipped weapon — bare hands is flagged loudly (never a silent default).
  const weaponColor = m.bare ? PALETTE['o'] : PALETTE['9'];
  const weaponText = m.bare ? '! BARE HANDS' : m.weaponName.toUpperCase();
  const iconId = weaponIconFor(game.loadout.weapon.id);
  // Fixed-width pixel text is a touch wider than the old anti-aliased font. Keep long unique names
  // inside the panel by reserving the icon gutter only when both icon and label fit.
  if (!m.bare && textWidth(weaponText) <= 65 && drawIcon(ctx, iconId, rightX, 24 - 7)) {
    drawPixelText(ctx, weaponText, rightX + 14, 18, weaponColor);
  } else {
    drawPixelText(ctx, fitPixelText(weaponText, 79), rightX, 18, weaponColor);
  }
}


// ===== src/sim/save.js =====
// save.js — autosave (DESIGN-SEED QoL: autosave at checkpoints; testing law: saves are ATOMIC
// write-then-swap with a corruption-recovery test). A save is a plain JSON snapshot of the
// persistent run state (XP, gold, gear, inventory, checkpoint, death marker). Writes go to a main
// slot plus a preserved backup slot, each with a checksum; a torn/corrupt main slot recovers from
// the backup. Storage is abstracted so the sim tests headless and the browser uses localStorage.


const SAVE_VERSION = 1;

/** djb2 checksum over a string → uint32 hex, for tamper/torn-write detection. */
function checksum(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h.toString(16);
}

/** In-memory storage (headless/default). Browser callers pass a localStorage-like object. */
function createMemoryStorage(seed = {}) {
  const map = new Map(Object.entries(seed));
  return {
    getItem: (k) => (map.has(k) ? map.get(k) : null),
    setItem: (k, v) => { map.set(k, String(v)); },
    removeItem: (k) => { map.delete(k); },
    _dump: () => Object.fromEntries(map),
  };
}

/** Serialize the persistent slice of a stage into a plain object. */
function serializeSave(stage, stageId = 'stage1') {
  return {
    v: SAVE_VERSION,
    stageId,
    totalXp: stage.progress.totalXp,
    gold: stage.gold,
    weaponId: stage.loadout.weapon.id,
    armorId: stage.loadout.armor.id,
    inventory: {
      weapons: [...stage.inventory.weapons],
      armors: [...stage.inventory.armors],
      items: { ...stage.inventory.items },
    },
    activeCheckpoint: stage.activeCheckpoint,
    respawnPoint: { ...stage.respawnPoint },
    marker: stage.marker ? { ...stage.marker } : null,
    deaths: stage.deaths,
    kit: { ...stage.kit },
    unlocked: stage.unlockPickups.filter((u) => u.collected).map((u) => u.move),
  };
}

/**
 * Write a save atomically: preserve the current main slot as the backup, then write the new main
 * with a checksum. A crash between the two leaves a recoverable backup.
 */
function writeSave(storage, key, save) {
  const record = JSON.stringify({ data: save, sum: checksum(JSON.stringify(save)) });
  const prevMain = storage.getItem(key);
  if (prevMain != null) storage.setItem(key + '.bak', prevMain); // preserve last-known-good
  storage.setItem(key, record);
}

function parseVerified(raw) {
  if (raw == null) return null;
  let rec;
  try { rec = JSON.parse(raw); } catch { return null; }
  if (!rec || typeof rec !== 'object' || rec.data == null || rec.sum == null) return null;
  if (checksum(JSON.stringify(rec.data)) !== rec.sum) return null; // torn / tampered
  return rec.data;
}

/**
 * Read a save, verifying the checksum; recover from the backup slot if the main slot is corrupt.
 * @returns {{save:object|null, recovered:boolean}}
 */
function readSave(storage, key) {
  const main = parseVerified(storage.getItem(key));
  if (main) return { save: main, recovered: false };
  const bak = parseVerified(storage.getItem(key + '.bak'));
  if (bak) return { save: bak, recovered: true };
  return { save: null, recovered: false };
}

/** Apply a loaded save onto a fresh stage (created from the same stage def). Best-effort restore. */
function applySave(stage, save) {
  if (!save) return stage;
  // progress: rebuild level + stats from total XP, restore to full HP on load
  const xp = save.totalXp | 0;
  stage.progress.totalXp = xp;
  stage.progress.level = levelForXp(xp);
  stage.progress.stats = statsForLevel(stage.progress.level);
  stage.progress.hp = stage.progress.stats.maxHP;
  stage.gold = save.gold | 0;
  // gear — resolve through weaponDef so a persisted UNIQUE re-equips (WEAPONS-only lookup misses it)
  if (save.weaponId) equipWeapon(stage.loadout, weaponDef(save.weaponId) || save.weaponId);
  if (save.armorId) equipArmor(stage.loadout, save.armorId);
  // inventory
  if (save.inventory) {
    stage.inventory.weapons = [...save.inventory.weapons];
    stage.inventory.armors = [...save.inventory.armors];
    stage.inventory.items = { ...save.inventory.items };
  }
  // M11: a granted unique lives in inventory.weapons (the source of truth) — mark its exploration
  // pickup collected on load so a reloaded stage doesn't re-offer an already-owned unique.
  for (const u of stage.uniquePickups || []) {
    if (stage.inventory.weapons.includes(u.id)) u.collected = true;
  }
  // souls state
  stage.activeCheckpoint = save.activeCheckpoint ?? -1;
  if (save.respawnPoint) stage.respawnPoint = { ...save.respawnPoint };
  stage.marker = save.marker ? { ...save.marker } : null;
  stage.deaths = save.deaths | 0;
  // kit unlocks (persist Metroid-style progression) + mark matching pickups collected
  if (save.kit) Object.assign(stage.kit, save.kit);
  if (Array.isArray(save.unlocked)) {
    for (const u of stage.unlockPickups) if (save.unlocked.includes(u.move)) u.collected = true;
  }
  return stage;
}



// ===== src/content/stagebuilder.js =====
// stagebuilder.js — parameterized stage generator (DESIGN-SEED M6: stages 2-4). Produces a stage
// def (tile rows + markers) from a compact description, reusing Stage 1's proven, bot-clearable
// shape: two solid floor rows with optional jumpable pits, optional floating platforms, and marker
// placements. Keeps hand-authoring low-risk — every generated stage is verified bot-beatable in
// tests. Marker letters match the stage loader (p/w/h/c/B/x, and C/D/J/P/S unlock pickups).

const SB_H = 15;                 // one screen tall
const SB_SURFACE = SB_H - 3;     // marker row (feet land on the floor top below it)
const SB_FLOOR_A = SB_H - 2;
const SB_FLOOR_B = SB_H - 1;

/**
 * @param {object} spec
 * @param {number} spec.width - tiles wide
 * @param {number[][]} [spec.pits] - [startCol, endCol] inclusive gaps in the floor (≤2 wide → jumpable)
 * @param {Array<[number,number,number]>} [spec.platforms] - [row, startCol, endCol] floating platforms
 * @param {number} [spec.player] - player spawn col
 * @param {number[]} [spec.walkers] - walker spawn cols (on the floor)
 * @param {Array<[number,number]>} [spec.hoppers] - [row, col] hopper spawns (row = surface it stands on - 1)
 * @param {Array<[string,number]>} [spec.unlocks] - [markerLetter, col] unlock pickups on the floor
 * @param {number} [spec.checkpoint] - checkpoint col
 * @param {number} [spec.boss] - boss col (omit for a no-boss stage; clear = reach exit)
 * @param {number} spec.exit - exit col
 * @param {object} [spec.extra] - passthrough def fields (startXp, weaponId, kit)
 */
function buildStage(spec) {
  const { width, pits = [], platforms = [], player = 3, walkers = [], hoppers = [],
    unlocks = [], checkpoint = null, boss = null, exit, extra = {} } = spec;
  const rows = Array.from({ length: SB_H }, () => Array(width).fill('.'));
  const set = (r, c, ch) => { if (c >= 0 && c < width && r >= 0 && r < SB_H) rows[r][c] = ch; };

  for (let c = 0; c < width; c++) { rows[SB_FLOOR_A][c] = '#'; rows[SB_FLOOR_B][c] = '#'; }
  for (const [a, b] of pits) for (let c = a; c <= b; c++) { rows[SB_FLOOR_A][c] = '.'; rows[SB_FLOOR_B][c] = '.'; }
  for (const [r, a, b] of platforms) for (let c = a; c <= b; c++) rows[r][c] = '#';

  set(SB_SURFACE, player, 'p');
  for (const c of walkers) set(SB_SURFACE, c, 'w');
  for (const [r, c] of hoppers) set(r, c, 'h');
  for (const [letter, c] of unlocks) set(SB_SURFACE, c, letter);
  if (checkpoint != null) set(SB_SURFACE, checkpoint, 'c');
  if (boss != null) set(SB_SURFACE, boss, 'B');
  set(SB_SURFACE, exit, 'x');

  return { rows: rows.map((r) => r.join('')), ...extra };
}


// ===== src/content/stage1.js =====
// stage1.js — Stage 1 layout (DESIGN-SEED M3: a beatable stage-1 vertical slice). Authored as a
// tile grid with spawn markers. Built programmatically so the geometry is exact. Enough trash to
// level the player toward the boss, two jumpable pits, a raised step and a floating platform for
// verticality, then a boss arena guarding the exit. Verified bot-beatable in tests.
// Legend: '#' solid · 'p' player · 'w' walker · 'h' hopper · 'B' boss · 'x' exit.

const W = 72;
const H = 15;

function build() {
  const rows = Array.from({ length: H }, () => Array(W).fill('.'));
  const fillRow = (r, ch, from = 0, to = W) => { for (let c = from; c < to; c++) rows[r][c] = ch; };
  const set = (r, c, ch) => { rows[r][c] = ch; };

  // Ground: bottom two rows solid.
  fillRow(13, '#'); fillRow(14, '#');
  // Two jumpable 2-tile pits.
  for (const c of [26, 27]) { rows[13][c] = '.'; rows[14][c] = '.'; }
  for (const c of [46, 47]) { rows[13][c] = '.'; rows[14][c] = '.'; }
  // A floating platform for verticality (decorative / holds a hopper).
  for (let c = 17; c <= 22; c++) rows[9][c] = '#';

  // Spawns (markers sit on the row whose bottom is the surface they stand on).
  set(12, 3, 'p');
  set(12, 10, 'w');
  set(8, 19, 'h');    // hopper on the floating platform (surface row 9)
  set(12, 20, 'w');
  set(12, 30, 'C');   // unlock: charged strike
  set(12, 35, 'w');
  set(12, 42, 'w');
  set(12, 44, 'S');   // unlock: sub-weapon
  set(12, 50, 'c');   // checkpoint before the boss arena
  set(12, 54, 'w');
  set(12, 60, 'w');
  set(12, 64, 'B');   // boss guarding the exit
  set(12, 70, 'x');

  return rows.map((r) => r.join(''));
}

const STAGE1 = { rows: build(), startXp: 0, weaponId: 'short-blade' };
const STAGE1_DIMS = { W, H };

// drops.js — where the rule-bending uniques enter the campaign (DIRECTIONS-20260806-M11). The 10
// uniques exist + equip + test since M7 but were unobtainable in-campaign. The operator's call:
// FIRST-KILL BOSS DROPS, not a vendor. Each boss node grants ONE specific unique the first time it
// dies; a re-armed (un-beaten) boss never drops twice, and the guarantee is enforced by the fact
// that the granted id already sits in the inventory (the source of truth). Uniques past the boss
// count are placed as guarded exploration pickups in later stages — NOT vendor stock.
//
// The mapping is deterministic and fits each unique to its stage arc. It is recorded here (and in a
// PROGRESS.md table) so the acquisition path is auditable, not scattered through stage defs.

// Boss node id → the unique granted on that boss's FIRST kill.
// Node ids come from CAMPAIGN_NODES (s1, s2, the s3 fork s3l/s3r, s4, the s5 fork s5l/s5r, s6).
const BOSS_DROPS = Object.freeze({
  s1:  'unique-9',   // swift needle    — a fast, forgiving early gift for the exemplar first boss
  s2:  'unique-3',   // leeching edge   — sustain to carry the mid-run
  s3l: 'unique-1',   // twin reach blade— reach for the platforming (left) route's spacing
  s3r: 'unique-7',   // glass fang      — an aggressive reward for the combat-gauntlet (right) route
  s4:  'unique-8',   // guard pike      — a defensive tool at the convergence
  s5l: 'unique-10',  // quake hammer    — downthrust synergy for the vertical climb (left)
  s5r: 'unique-2',   // slow heavy maul — a heavy-hitter reward for the dense gauntlet (right)
  s6:  'unique-4',   // coiled brand    — always-charged, the finale prize
});

// Guarded exploration pickups: uniques with no boss to hang on, placed in later stages. Each is a
// {node, id, col} — col is the tile column where the pickup sits (on that stage's surface). These
// are the two remainders (10 uniques − 8 boss nodes).
const EXPLORATION_DROPS = Object.freeze([
  { node: 's4', id: 'unique-5', col: 44 }, // beam edge — tucked past Stage 4's second pit
  { node: 's6', id: 'unique-6', col: 30 }, // free sling — mid-Stage-6, guarded by trash
]);

/** Every unique id obtainable in the campaign (boss drops ∪ exploration pickups). */
function allObtainableUniques() {
  return new Set([...Object.values(BOSS_DROPS), ...EXPLORATION_DROPS.map((d) => d.id)]);
}

/** Exploration pickups placed in a given node ([] if none). */
function explorationDropsFor(nodeId) {
  return EXPLORATION_DROPS.filter((d) => d.node === nodeId).map((d) => ({ id: d.id, col: d.col }));
}

}

}



// ===== src/sim/campaign.js =====
// campaign.js — the campaign progression + branch state (DESIGN-SEED M6: six-stage structure with
// left/right path choices in the middle stages). A node list; a branch node offers two variants
// (the fork) chosen when entered. Progress (XP/gold/gear/inventory/kit unlocks) carries across
// stages; per-stage state (checkpoint, death marker) does not. Pure — the boot/test drives it.

function createCampaign(nodes) {
  return { nodes, index: 0, choice: null, taken: [] };
}

function currentNode(c) { return c.nodes[c.index] || null; }
function isBranch(c) { const n = currentNode(c); return !!(n && n.branch); }

/** The two options at a branch node ([left, right]), or null. */
function branchOptions(c) {
  const n = currentNode(c);
  return n && n.branch ? [n.branch.left, n.branch.right] : null;
}

/** Choose a side at a branch node ('left' | 'right'). */
function chooseBranch(c, side) {
  if (isBranch(c) && (side === 'left' || side === 'right')) c.choice = side;
}

/** The stage def to play now (null at an un-chosen branch node). */
function currentStageDef(c) {
  const n = currentNode(c);
  if (!n) return null;
  if (n.branch) return c.choice ? n.branch[c.choice].stage : null;
  return n.stage;
}

/** Advance past the current node, recording the taken path id. */
function advanceCampaign(c) {
  const n = currentNode(c);
  if (!n) return;
  c.taken.push(n.branch ? n.branch[c.choice].id : n.id);
  c.index++;
  c.choice = null;
}

function isCampaignComplete(c) { return c.index >= c.nodes.length; }

/**
 * Carry persistent run state from a cleared stage onto a freshly created next stage. Copies
 * XP/gold/gear/inventory/kit unlocks; leaves per-stage state (checkpoint/marker) fresh.
 */
function carryOver(fromStage, toStage) {
  toStage.progress.totalXp = fromStage.progress.totalXp;
  toStage.progress.level = fromStage.progress.level;
  toStage.progress.stats = { ...fromStage.progress.stats };
  toStage.progress.hp = fromStage.progress.stats.maxHP; // enter the next stage at full HP
  toStage.gold = fromStage.gold;
  toStage.loadout.weapon = fromStage.loadout.weapon;
  toStage.loadout.armor = fromStage.loadout.armor;
  toStage.inventory.weapons = [...fromStage.inventory.weapons];
  toStage.inventory.armors = [...fromStage.inventory.armors];
  toStage.inventory.items = { ...fromStage.inventory.items };
  Object.assign(toStage.kit, fromStage.kit);
  toStage.subResource = toStage.subResourceMax;
  return toStage;
}


// ===== src/sim/sidemode.js =====
// sidemode.js — the OPTIONAL procedural side mode (DESIGN-SEED M8: scaffold-grade; the full
// roguelite restructure is DECLINED). A seeded run assembles a stage from a small library of
// campaign-flavored CHUNKS (flat trash, jumpable pit, hopper perch, gauntlet), then caps it with a
// boss arena. SANDBOXED: the boot layer runs this on its own save slot with a fresh character, so
// nothing earned here enters the campaign save. Deterministic per seed; verified bot-clearable.


const CHUNK_W = 10;

// Each chunk contributes enemies/pits/platforms at its column offset `o`. Pits stay ≤2 wide so
// they're always jumpable (keeps assembled runs beatable).
const CHUNK_LIBRARY = [
  { name: 'flat-trash', build: (o) => ({ walkers: [o + 3, o + 7] }) },
  { name: 'pit-jump', build: (o) => ({ pits: [[o + 4, o + 5]], walkers: [o + 8] }) },
  { name: 'hopper-perch', build: (o) => ({ platforms: [[9, o + 3, o + 7]], hoppers: [[8, o + 5]] }) },
  { name: 'gauntlet', build: (o) => ({ walkers: [o + 2, o + 5, o + 8] }) },
];

const SIDE_CHUNK_NAMES = Object.freeze(CHUNK_LIBRARY.map((c) => c.name));

/**
 * Assemble a procedural side-mode stage def from a seed.
 * @param {number|string} seed
 * @param {number} [chunkCount=5]
 * @returns {object} a stage def (with `sideMode: true` + the chunk sequence used)
 */
function assembleSideStage(seed, chunkCount = 5, startXp = 220) {
  const rng = createRng(seed);
  const walkers = [], hoppers = [], pits = [], platforms = [];
  const sequence = [];
  let width = 4; // leading margin for the player spawn

  for (let i = 0; i < chunkCount; i++) {
    const chunk = CHUNK_LIBRARY[rng.int(0, CHUNK_LIBRARY.length - 1)];
    const parts = chunk.build(width);
    if (parts.pits) pits.push(...parts.pits);
    if (parts.platforms) platforms.push(...parts.platforms);
    if (parts.walkers) walkers.push(...parts.walkers);
    if (parts.hoppers) hoppers.push(...parts.hoppers);
    sequence.push(chunk.name);
    width += CHUNK_W;
  }

  // Boss arena + exit.
  const checkpoint = width + 1;
  const boss = width + 4;
  const exit = width + 8;
  width += 11;

  return buildStage({
    width, pits, platforms, player: 2, walkers, hoppers, checkpoint, boss, exit,
    extra: { sideMode: true, chunks: sequence, seed, startXp },
  });
}
