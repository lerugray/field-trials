    events.push({ type: 'hit', dmg, enemy: 'boss' });
    if (r.killed) {
      s.gold += r.gold;
      const lv = gainXp(s.progress, r.xp);
      events.push({ type: 'boss-defeat', xp: r.xp, gold: r.gold });
      if (lv.leveledUp) events.push({ type: 'levelup', to: lv.to });
      // M11 first-kill boss drop: grant the mapped unique once. The `includes` guard IS the
      // no-duplicate guarantee — a re-armed boss (or a reloaded stage) already has the id in
      // inventory, so it never grants twice.
      if (s.bossDropId && !s.inventory.weapons.includes(s.bossDropId)) {
        addWeapon(s.inventory, s.bossDropId);
        events.push({ type: 'unique-drop', id: s.bossDropId, source: 'boss' });
      }
    }
    return;
  }
  const e = s.enemies[id];
  if (!e || !e.alive) return;
  const r = damageEnemy(e, dmg);
  events.push({ type: 'hit', dmg, enemy: e.type.id });
  if (r.killed) {
    s.gold += r.gold;
    const lv = gainXp(s.progress, r.xp);
    events.push({ type: 'kill', enemy: e.type.id, xp: r.xp, gold: r.gold, at: { x: e.x, y: e.y }, facing: e.facing });
    if (lv.leveledUp) events.push({ type: 'levelup', to: lv.to });
    if (s.rng.chance(0.25)) s.drops.push({ kind: 'heal', x: e.x, y: e.y - 8, vy: -1, value: 10, life: 600 });
  }
}

/** Current live targets (enemies + boss) as {id, aabb} for a hit query. */
function liveTargets(s) {
  const targets = s.enemies.filter((e) => e.alive).map((e) => ({ id: s.enemies.indexOf(e), aabb: enemyAabb(e) }));
  if (s.boss && s.boss.alive) targets.push({ id: 'boss', aabb: bossAabb(s.boss) });
  return targets;
}

/**
 * Find safe standing ground near x (so a death marker in a pit relocates to the last solid ground
 * rather than floating in the void). Searches the column at x, then outward, for a solid tile with
 * air above; falls back to the respawn point.
 */
function safeGroundNear(s, x) {
  const tm = s.tilemap, ts = tm.tileSize;
  const tx0 = clamp(Math.floor(x / ts), 0, tm.w - 1);
  for (let d = 0; d < tm.w; d++) {
    for (const tx of d === 0 ? [tx0] : [tx0 - d, tx0 + d]) {
      if (tx < 0 || tx >= tm.w) continue;
      for (let ty = 0; ty < tm.h; ty++) {
        if (tm.solidAt(tx, ty) && !tm.solidAt(tx, ty - 1)) {
          return { x: tx * ts + ts / 2, y: ty * ts }; // feet on the surface
        }
      }
    }
  }
  return { ...s.respawnPoint };
}

/** Souls death → respawn at the active checkpoint, drop the marker, respawn trash (never the boss). */
function respawnPlayer(s, deathX, events) {
  const safe = safeGroundNear(s, deathX);
  // Honest assist: XP never drops — no marker, no forfeit (drop rates untouched either way).
  if (!s.settings.xpSafe) {
    const { marker, forfeited } = dropMarker(s.progress, safe.x, safe.y, s.marker);
    s.marker = marker;
    if (forfeited > 0) events.push({ type: 'forfeit', xp: forfeited });
  }
  for (const e of s.enemies) resetEnemy(e); // trash respawns
  if (s.boss) resetBoss(s.boss);            // un-beaten boss re-arms to full; a beaten boss stays dead
  s.player.x = s.respawnPoint.x;
  s.player.y = s.respawnPoint.y;
  s.player.vx = 0; s.player.vy = 0;
  // Clear transient jump state so post-death input cannot spend or misclassify an air jump.
  // Wall-reset semantics are untouched (airJumpUsed still only clears on true ground landings).
  s.player.airJumpUsed = false;
  s.player.airJumped = false;
  s.player.jumping = false;
  s.player.coyote = 0;
  s.player.jumpBuffer = 0;
  s.player.onGround = isGrounded(playerAabb(s.player), s.tilemap);
  s.progress.hp = s.progress.stats.maxHP;
  s.iframes = RESPAWN_GRACE;
  s.deaths++;
  events.push({ type: 'death', at: { x: safe.x, y: safe.y }, marker: !!s.marker });
  events.push({ type: 'respawn', deaths: s.deaths });
}

/** Apply contact damage to the player with i-frames + knockback away from srcX. Returns true if hit. */
function hurtPlayer(s, srcX, dmg, events) {
  if (s.iframes !== 0 || s.player.dodging > 0) return false; // hit-stun i-frames or a dodge dash
  const mod = weaponMod(s.loadout.weapon); // equipped-weapon defensive mods (unique tradeoffs)
  dmg = Math.max(1, Math.round(dmg * (mod.fragile || 1)) - (mod.defenseBonus || 0));
  s.progress.hp = Math.max(0, s.progress.hp - dmg);
  s.iframes = iframeTicks(FEEL.HITSTUN_IFRAME_TICKS, s.settings); // longer under input-assist
  const dir = s.player.x < srcX ? -1 : 1;
  s.player.x += dir * FEEL.KNOCKBACK_IMPULSE * 2;
  s.player.vy = -2;
  events.push({ type: 'hurt', dmg });
  return true; // the once-per-tick death check in stepStage handles hp<=0
}

/**
 * Advance the stage one tick.
 * @param {object} s - stage state (mutated).
 * @param {object} intent - {moveDir, jumpPressed, jumpHeld, attackPressed}
 * @returns {Array} events this tick.
 */
function stepStage(s, intent) {
  const events = [];
  if (s.dead || s.cleared) { s.events = events; return events; }

  // --- player physics against tiles (kit.doubleJump is the permanent ownership source of truth) ---
  stepPlayer(s.player, { ...(intent || {}), doubleJump: s.kit.doubleJump }, s.world);
  if (s.player.airJumped) {
    events.push({ type: 'double-jump', x: s.player.x, y: s.player.y });
    // Durable presentation coordinates: persist across later ticks that replace s.events.
    s.airJumpPresentation.serial += 1;
    s.airJumpPresentation.x = s.player.x;
    s.airJumpPresentation.y = s.player.y;
  }
  s.player.x = clamp(s.player.x, PLAYER_HALF.halfW, s.tilemap.worldWidth - PLAYER_HALF.halfW);
  if (s.iframes > 0) s.iframes--;

  // --- fell into a pit → Souls respawn ---
  if (s.player.y > s.tilemap.worldHeight + 24) {
    respawnPlayer(s, s.player.x, events);
    s.events = events;
    return events;
  }

  let pbox = playerAabb(s.player);

  // --- checkpoints: touch activates (sets respawn point); rest (DOWN) heals + respawns trash ---
  for (let i = 0; i < s.checkpoints.length; i++) {
    const cp = s.checkpoints[i];
    if (!aabbOverlap(pbox, { x: cp.x - 10, y: cp.y - 32, w: 20, h: 32 })) continue;
    // Only ever advance the respawn point forward — backtracking over an earlier checkpoint must
    // not regress where you respawn.
    if (i > s.activeCheckpoint) {
      s.activeCheckpoint = i;
      s.respawnPoint = { x: cp.x, y: cp.y };
      events.push({ type: 'checkpoint', index: i });
    }
    if (intent && intent.rest) {
      s.progress.hp = s.progress.stats.maxHP;
      s.subResource = s.subResourceMax; // rest refills the sub-weapon resource
      for (const e of s.enemies) resetEnemy(e); // voluntary rest respawns trash (Souls discipline)
      if (s.boss) resetBoss(s.boss);            // rest re-arms an un-beaten boss (no chip-then-rest exploit)
      events.push({ type: 'rest' });
    }
  }

  // --- kit-unlock pickups: touch grants the move (fanfare/prompt handled by the boot layer) ---
  for (const u of s.unlockPickups) {
    if (u.collected) continue;
    if (aabbOverlap(pbox, { x: u.x - 10, y: u.y - 20, w: 20, h: 24 })) {
      u.collected = true;
      s.kit[u.move] = true;
      events.push({ type: 'unlock', move: u.move });
    }
  }

  // --- M11 guarded exploration pickups: touch grants the unique into the inventory (equip via the
  // action menu). The `includes` guard keeps a reloaded pickup from re-granting. ---
  for (const u of s.uniquePickups) {
    if (u.collected) continue;
    if (aabbOverlap(pbox, { x: u.x - 10, y: u.y - 20, w: 20, h: 24 })) {
      u.collected = true;
      if (!s.inventory.weapons.includes(u.id)) addWeapon(s.inventory, u.id);
      events.push({ type: 'unique-drop', id: u.id, source: 'pickup' });
    }
  }

  // --- recover the death marker on touch ---
  if (s.marker && aabbOverlap(pbox, { x: s.marker.x - 12, y: s.marker.y - 32, w: 24, h: 32 })) {
    const r = recoverMarker(s.progress, s.marker);
    events.push({ type: 'recover', xp: r.recovered });
    if (r.leveledUp) events.push({ type: 'levelup', to: r.to });
    s.marker = null;
  }

  // --- player melee (base + charged + downthrust from the kit) ---
  const wpn0 = s.loadout.weapon;
  const wmod = weaponMod(wpn0);
  const swing = decideMelee(intent, s.player, s.kit, s.charge, wpn0);
  const { started, hitActive } = stepMelee(s.attack, { attackPressed: !!swing }, wpn0);
  if (started && swing) {
    s.attack.mul = swing.mul;
    s.attack.downward = swing.downward;
    s.attack.swingType = swing.type;
    if (swing.type !== 'normal') events.push({ type: 'kit-move', move: swing.type });
    // Full-health projectile: a normal swing at full HP fires a beam forward (kit-gated). A unique
    // may fire it at any health (projectileAnyHp).
    const beamOk = (s.kit.projectile && s.progress.hp >= s.progress.stats.maxHP) || wmod.projectileAnyHp;
    if (beamOk && swing.type === 'normal') {
      const dmg = computeDamage(s.progress.stats, wpn0, 0);
      s.projectiles.push(createProjectile({
        x: s.player.x + s.player.facing * 12, y: s.player.y - PLAYER_HALF.halfH,
        vx: s.player.facing * 4.5, damage: dmg, kind: 'beam',
      }));
      events.push({ type: 'kit-move', move: 'projectile' });
    }
  }
  if (hitActive) {
    const downward = s.attack.downward;
    const hb = downward
      ? { x: s.player.x - PLAYER_HALF.halfW, y: s.player.y, w: PLAYER_HALF.halfW * 2, h: wpn0.reach }
      : meleeHitbox({ x: s.player.x, y: s.player.y - PLAYER_HALF.halfH, facing: s.player.facing }, wpn0, PLAYER_HALF);
    const dmg = Math.round(computeDamage(s.progress.stats, wpn0, 0) * (s.attack.mul || 1) * (wmod.dmgMul || 1));
    const struck = resolveMeleeHits(s.attack, hb, liveTargets(s));
    if (downward && struck.length) s.player.vy = -DOWNTHRUST_BOUNCE * (wmod.downthrustPower || 1);
    for (const t of struck) applyDamageToTarget(s, t.id, dmg, events);
    // Lifesteal: a unique heals a share of damage dealt.
    if (wmod.lifesteal && struck.length) {
      s.progress.hp = Math.min(s.progress.stats.maxHP, s.progress.hp + Math.max(1, Math.round(dmg * wmod.lifesteal)) * struck.length);
    }
  }

  // --- sub-weapon: up + B fires a sub-weapon projectile, consuming a resource (free for a unique) ---
  if (s.kit.subweapon && intent && intent.up && intent.subweaponPressed && (s.subResource > 0 || wmod.freeSub)) {
    if (!wmod.freeSub) s.subResource--;
    s.projectiles.push(createProjectile({
      x: s.player.x + s.player.facing * 12, y: s.player.y - PLAYER_HALF.halfH - 4,
      vx: s.player.facing * 3.2, vy: -1.2, damage: 12, w: 10, h: 10, kind: 'sub',
    }));
    events.push({ type: 'kit-move', move: 'subweapon', resource: s.subResource });
  }

  // --- enemies AI + contact damage ---
  pbox = playerAabb(s.player); // refresh after melee knockback
  for (const e of s.enemies) {
    if (!e.alive) continue;
    stepEnemy(e, s.tilemap);
    if (aabbOverlap(pbox, enemyAabb(e))) hurtPlayer(s, e.x, e.type.contactDamage, events);
  }

  // --- boss AI + contact damage (telegraphed lunge hits harder) ---
  if (s.boss && s.boss.alive) {
    stepBoss(s.boss, s.player, s.tilemap);
    if (aabbOverlap(playerAabb(s.player), bossAabb(s.boss))) {
      hurtPlayer(s, s.boss.x, bossContactDamage(s.boss), events);
    }
  }

  // --- projectiles: travel, hit the first live target, die on tile/hit/life ---
  for (const pr of s.projectiles) {
    if (pr.dead) continue;
    stepProjectile(pr, s.tilemap);
    if (pr.dead) continue;
    const box = projectileAabb(pr);
    for (const t of liveTargets(s)) {
      if (aabbOverlap(box, t.aabb)) { applyDamageToTarget(s, t.id, pr.damage, events); pr.dead = true; break; }
    }
  }
  s.projectiles = s.projectiles.filter((pr) => !pr.dead);

  // --- clear check runs BEFORE the death check: a winning hit (boss killed / exit reached) is not
  // punished by a simultaneous lethal contact on the same tick ---
  if (!s.cleared) {
    const clearedNow = s.boss ? !s.boss.alive : s.player.x >= s.exitX;
    if (clearedNow) { s.cleared = true; events.push({ type: 'clear' }); }
  }

  // --- once-per-tick death check → Souls respawn (skipped if the stage just cleared) ---
  if (!s.cleared && s.progress.hp <= 0) {
    respawnPlayer(s, s.player.x, events);
    s.events = events;
    return events;
  }

  // --- drops: fall to ground, collected on overlap ---
  for (const d of s.drops) {
    if (d.collected) continue;
    d.vy = Math.min(FEEL.TERMINAL_FALL, d.vy + FEEL.GRAVITY);
    if (!s.tilemap.solidAtPx(d.x, d.y + 6)) d.y += d.vy; else d.vy = 0;
    d.life--;
    if (aabbOverlap(pbox, { x: d.x - 6, y: d.y - 6, w: 12, h: 12 })) {
      d.collected = true;
      if (d.kind === 'heal') {
        // Healing items go to the Items slot (used from the action menu), per DESIGN-SEED.
        addItem(s.inventory, 'heal', 1);
        events.push({ type: 'pickup', kind: 'heal' });
      }
    }
  }
  s.drops = s.drops.filter((d) => !d.collected && d.life > 0);

  // --- camera follow (clamped to world) ---
  s.camera.x = clamp(s.player.x - s.vw / 2, 0, Math.max(0, s.tilemap.worldWidth - s.vw));
  s.camera.y = clamp(s.player.y - s.vh * 0.6, 0, Math.max(0, s.tilemap.worldHeight - s.vh));

  s.events = events;
  return events;
}



// ===== src/render/sprite.js =====
// sprite.js — code-drawn pixel-art authoring (DESIGN-SEED art law: ALL art is programmatic
// canvas pixel-grid authoring). A sprite is authored as an array of equal-length strings, one char
// per pixel, indexing the shared palette ('.' = transparent). Rasterization to RGBA is pure and
// headless-testable so the art pipeline can be validated without a browser.


/**
 * Right-pad ragged rows to the widest row's length with transparent pixels. Lets hand-authored art
 * be written without counting every trailing column. Returns a new array.
 */
function padRows(rows) {
  const w = rows.reduce((m, r) => Math.max(m, r.length), 0);
  return rows.map((r) => r + '.'.repeat(w - r.length));
}

/**
 * Parse a pixel-grid (array of equal-length rows of palette keys) into a validated sprite.
 * @param {string[]} rows
 * @returns {{w:number,h:number,rows:string[]}}
 */
function parseSprite(rowsIn) {
  if (!Array.isArray(rowsIn) || rowsIn.length === 0) throw new Error('sprite: empty grid');
  // A space is an authoring convenience for transparent (same as '.').
  const rows = rowsIn.map((r) => r.replace(/ /g, '.'));
  const w = rows[0].length;
  if (w === 0) throw new Error('sprite: zero-width row');
  for (let y = 0; y < rows.length; y++) {
    if (rows[y].length !== w) throw new Error(`sprite: ragged row ${y} (${rows[y].length} != ${w})`);
    for (const ch of rows[y]) {
      if (!(ch in PALETTE)) throw new Error(`sprite: unknown palette key '${ch}' on row ${y}`);
    }
  }
  return { w, h: rows.length, rows: [...rows] };
}

/**
 * Rasterize a sprite to a flat RGBA byte array (row-major, w*h*4).
 * @param {{w:number,h:number,rows:string[]}} sprite
 * @returns {Uint8ClampedArray}
 */
function rasterize(sprite) {
  const { w, h, rows } = sprite;
  const out = new Uint8ClampedArray(w * h * 4);
  let i = 0;
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < w; x++) {
      const [r, g, b, a] = rgbaOf(row[x]);
      out[i++] = r; out[i++] = g; out[i++] = b; out[i++] = a;
    }
  }
  return out;
}

/** Return a new sprite mirrored horizontally (for left/right facing). */
function flipH(sprite) {
  const rows = sprite.rows.map((row) => [...row].reverse().join(''));
  return { w: sprite.w, h: sprite.h, rows };
}

/**
 * Bake a sprite into an ImageData-compatible object. In a browser this hands straight to
 * ctx.putImageData / createImageBitmap; headless it is just {width,height,data}.
 */
function toImageData(sprite, ImageDataCtor) {
  const data = rasterize(sprite);
  if (typeof ImageDataCtor === 'function') return new ImageDataCtor(data, sprite.w, sprite.h);
  return { width: sprite.w, height: sprite.h, data };
}

let LOADED = null;

/** Load (or re-load) images. Resolves when all browser Image objects are decoded.
 *  In a headless/test environment this is a no-op and getAsset returns null. */
function loadAssets() {
  if (LOADED) return LOADED;
  if (typeof Image === 'undefined') {
    LOADED = Promise.resolve();
    return LOADED;
  }
  const promises = [];
  for (const def of Object.values(ASSET_DEFS)) {
    const img = new Image();
    img.src = def.src;
    def.image = img;
    promises.push(new Promise((resolve) => { img.onload = resolve; img.onerror = resolve; }));
  }
  LOADED = Promise.all(promises);
  return LOADED;
}

  if (!def) return null;
  if (typeof Image === 'undefined') return null;
  return def;
}

/** True if the asset image is loaded and ready to draw. */
function assetReady(id) {
  const def = ASSET_DEFS[id];
  return !!def && !!def.image && def.image.complete && def.image.naturalWidth > 0;
}

/** Top-left Y that places a visual's last opaque row immediately above feetY. */
function groundedVisualY(feetY, visual) {
  const height = visual?.height ?? visual?.h ?? 0;
  const bottomInset = visual?.bottomInset ?? 0;
  return feetY - height + bottomInset;
}

/** Pixel-row distance from a rendered visual's opaque bottom to its standing surface. */
function groundContactGap(feetY, drawY, visual) {
  const height = visual?.height ?? visual?.h ?? 0;
  const bottomInset = visual?.bottomInset ?? 0;
  const opaqueBottom = drawY + height - bottomInset - 1;
  return feetY - opaqueBottom;
}

/** Draw a small curated icon by asset id at screen (x,y). Returns true if drawn. */
function drawIcon(ctx, id, x, y) {
  const asset = id && ASSET_DEFS[id];
  if (!asset) return false;
  if (typeof Image === 'undefined') return false;
  if (!asset.image || !asset.image.complete || asset.image.naturalWidth <= 0) return false;
  ctx.drawImage(asset.image, Math.round(x), Math.round(y));
  return true;
}

/** Map a weapon id to a curated HUD icon asset id (null if none fits). */
function weaponIconFor(weaponId) {
  if (weaponId === 'long-spear') return 'icon_spear';
  if (weaponId === 'heavy-club') return 'icon_mace';
  if (weaponId === 'ranged-sidearm') return null; // no curated ranged icon; keep text
  if (weaponId && weaponId.startsWith('unique-')) return 'icon_blade';
  if (weaponId === 'bare-hands') return null;
  // short-blade, long-blade, short-dagger and any other blade default to the blade icon.
  return 'icon_blade';
}

// ===== src/render/dressing.js =====
// dressing.js — deterministic placement of environmental decoration (M12-ART: "screens stop reading
// as bare geometry"). Two pure layouts: surface dressing (gravestones, vines, moss, ruins on the
// ground) and distant parallax silhouettes. Both are seeded off the stage so they replay identically
// (DESIGN-SEED determinism) and both are theme-gated — a stage only grows the dressing kinds its
// THEME lists. Nothing here draws; stagerender consumes these arrays. Kept pure so it is
// headless-testable without a canvas.


// Which dressing kinds sit ON the ground surface vs. hang from an overhang (vines) vs. background.
const SURFACE_KINDS = new Set([
  'grass', 'gravestone', 'brokenArch', 'skull', 'torch', 'gargoyle', 'banner',
]);
const HANGING_KINDS = new Set(['vine', 'moss']);
const LANDMARK_KINDS = new Set(['gravestone', 'brokenArch', 'gargoyle', 'banner']);
const DRESSING_SPAN = 12; // one quiet landmark per ~192 world pixels at 16px tiles

/**
 * Find every exposed top-surface tile column: a solid tile with empty space directly above it.
 * Returns an array of { tx, ty } (tile coords of the surface tile).
 */
function surfaceCells(tilemap) {
  const cells = [];
  for (let tx = 0; tx < tilemap.w; tx++) {
    for (let ty = 0; ty < tilemap.h; ty++) {
      if (tilemap.solidAt(tx, ty) && !tilemap.solidAt(tx, ty - 1)) {
        cells.push({ tx, ty });
        break; // topmost surface only
      }
    }
  }
  return cells;
}

/**
 * Place ground/overhang dressing deterministically. Each surface column has a small chance to grow a
 * theme-allowed decoration; adjacent placements are thinned so the field breathes. Returns
 * [{ kind, x, y, seed }] in world pixels where (x,y) is the decoration's bottom-center anchor
 * (surface top for ground kinds; ceiling for hanging kinds — here we anchor hanging under the
 * surface tile's top as a wall creeper).
 *
 * @param {object} tilemap - needs solidAt, w, h, tileSize
 * @param {string} themeId
 * @param {number|string} seed
 */
function computeDressing(tilemap, themeId, seed) {
  const theme = themeFor(themeId);
  const ts = tilemap.tileSize;
  const allowed = theme.dressing || [];
  const surfaceKinds = allowed.filter((k) => SURFACE_KINDS.has(k));
  const hangingKinds = allowed.filter((k) => HANGING_KINDS.has(k));
  const rng = createRng(`dress:${themeId}:${seed}`);
  const cells = surfaceCells(tilemap);
  const out = [];
  let cooldown = 0;
  for (const { tx, ty } of cells) {
    if (cooldown > 0) { cooldown--; continue; }
    // Ground dressing: sparse. Bigger ruins are rarer than moss/grass.
    if (surfaceKinds.length && rng.chance(0.16)) {
      const kind = rng.pick(surfaceKinds);
      const heavy = LANDMARK_KINDS.has(kind);
      out.push({ kind, x: tx * ts + ts / 2, y: ty * ts, seed: rng.int(0, 9999) });
      cooldown = heavy ? 3 : 1; // keep heavy props from clumping
    } else if (hangingKinds.length && rng.chance(0.10)) {
      const kind = rng.pick(hangingKinds);
      out.push({ kind, x: tx * ts + ts / 2, y: ty * ts, hanging: true, seed: rng.int(0, 9999) });
    }
  }

  // AR2 readability/place gate: every screen-width stretch receives one restrained landmark when
  // random dressing left it bare. This is still seeded and surface-anchored; it only prevents the
  // long undecorated runs visible in AR1, without turning every tile into visual noise.
  if (surfaceKinds.length) {
    const landmarkKinds = surfaceKinds.filter((kind) => LANDMARK_KINDS.has(kind));
    const guaranteedKinds = landmarkKinds.length ? landmarkKinds : surfaceKinds;
    const bucketCount = Math.ceil(tilemap.w / DRESSING_SPAN);
    for (let bucket = 0; bucket < bucketCount; bucket++) {
      const start = bucket * DRESSING_SPAN;
      const end = Math.min(tilemap.w, start + DRESSING_SPAN);
      if (out.some((dec) => dec.x / ts >= start && dec.x / ts < end)) continue;
      const candidates = cells.filter(({ tx }) => tx >= start + 1 && tx < end - 1);
      if (!candidates.length) continue;
      const cell = rng.pick(candidates);
      const kind = rng.pick(guaranteedKinds);
      out.push({
        kind, x: cell.tx * ts + ts / 2, y: cell.ty * ts, seed: rng.int(0, 9999),
        guaranteed: true,
      });
    }
  }
  out.sort((a, b) => a.x - b.x);
  return out;
}

/**
 * Distant parallax silhouettes for the backdrop — a jagged skyline of the theme's ruins that scrolls
 * slower than the foreground. Returns [{ kind, x, w, h }] in world pixels along the ground band; the
 * renderer applies the parallax factor and draws them as flat theme-tinted silhouettes.
 *
 * @param {number} worldWidth - stage world width in pixels
 * @param {string} themeId
 * @param {number|string} seed
 */
function parallaxLayout(worldWidth, themeId, seed) {
  const rng = createRng(`parallax:${themeId}:${seed}`);
  const out = [];
  // A silhouette every ~56-96 px across roughly 1.5x the world (parallax compresses it on screen).
  let x = 0;
  const span = Math.ceil(worldWidth * 0.7);
  const kinds = ['spire', 'wall', 'tomb', 'tower', 'arch'];
  while (x < span) {
    const kind = rng.pick(kinds);
    const w = kind === 'wall' ? rng.int(28, 52) : kind === 'arch' ? rng.int(24, 38) : rng.int(12, 22);
    const h = kind === 'spire' ? rng.int(40, 78)
      : kind === 'tower' ? rng.int(34, 58)
        : kind === 'wall' || kind === 'arch' ? rng.int(20, 34) : rng.int(16, 26);
    out.push({ kind, x, w, h });
    x += w + rng.int(18, 40);
  }
  return out;
}


// ===== src/render/pixelfont.js =====
// pixelfont.js — code-drawn 4x6 bitmap UI font. Canvas text rendering is intentionally avoided:
// even with image smoothing disabled, browser-rendered canvas glyphs get anti-aliased. These masks
// are drawn only with integer-coordinate rectangles so the shipped logical canvas stays pixel-crisp.

const PIXEL_GLYPH_WIDTH = 4;
const PIXEL_GLYPH_HEIGHT = 6;
const PIXEL_GLYPH_SPACING = 1;

// Lowercase input is normalized to uppercase by drawPixelText/textWidth. In addition to the brief's

// move strings. Unknown characters deliberately render as '?' instead of silently disappearing.
const PIXEL_FONT_GLYPHS = Object.freeze({

  H: ['#..#', '#..#', '####', '#..#', '#..#', '#..#'],
  I: ['####', '.##.', '.##.', '.##.', '.##.', '####'],
  J: ['..##', '...#', '...#', '...#', '#..#', '.##.'],
  K: ['#..#', '#.#.', '##..', '#.#.', '#.#.', '#..#'],
  L: ['#...', '#...', '#...', '#...', '#...', '####'],
  M: ['#..#', '####', '####', '#..#', '#..#', '#..#'],

  Q: ['.##.', '#..#', '#..#', '#.##', '#..#', '.###'],
  R: ['###.', '#..#', '#..#', '###.', '#.#.', '#..#'],
  S: ['.###', '#...', '.##.', '...#', '...#', '###.'],

  U: ['#..#', '#..#', '#..#', '#..#', '#..#', '.##.'],
  V: ['#..#', '#..#', '#..#', '#..#', '.##.', '.##.'],
  W: ['#..#', '#..#', '#..#', '####', '####', '#..#'],
  X: ['#..#', '#..#', '.##.', '.##.', '#..#', '#..#'],
  Y: ['#..#', '#..#', '.##.', '.##.', '.##.', '.##.'],
  Z: ['####', '...#', '..#.', '.#..', '#...', '####'],

  1: ['.##.', '###.', '.##.', '.##.', '.##.', '####'],
  2: ['###.', '...#', '.##.', '#...', '#...', '####'],
  3: ['###.', '...#', '.##.', '...#', '...#', '###.'],
  4: ['#..#', '#..#', '####', '...#', '...#', '...#'],

  '>': ['.#..', '..#.', '...#', '..#.', '.#..', '....'],
  '(': ['..#.', '.#..', '.#..', '.#..', '.#..', '..#.'],

  "'": ['.##.', '.##.', '.#..', '....', '....', '....'],

  '↑': ['.#..', '###.', '#.#.', '.#..', '.#..', '....'],
  '↓': ['....', '.#..', '.#..', '#.#.', '###.', '.#..'],
});

function pixelFontScale(scale) {
  const n = Math.floor(Number(scale));
  return Number.isFinite(n) && n > 0 ? n : 1;
}

function pixelFontCharacters(text) {
  return [...String(text ?? '').toUpperCase()];
}

/** Measured width in logical pixels, including scaled inter-glyph spacing but no trailing space. */
function textWidth(text, scale = 1) {
  const length = pixelFontCharacters(text).length;
  if (length === 0) return 0;
  const s = pixelFontScale(scale);
  return (length * PIXEL_GLYPH_WIDTH + (length - 1) * PIXEL_GLYPH_SPACING) * s;
}

/** Truncate one line to a measured width, preserving a visible three-dot overflow marker. */
function fitPixelText(text, maxWidth, scale = 1) {
  const source = String(text ?? '');
  if (textWidth(source, scale) <= maxWidth) return source;
  const suffix = '...';
  if (textWidth(suffix, scale) > maxWidth) {
    let short = '';
    for (const char of suffix) {
      if (textWidth(short + char, scale) > maxWidth) break;
      short += char;
    }
    return short;
  }
  let prefix = '';
  for (const char of source) {
    if (textWidth(prefix + char + suffix, scale) > maxWidth) break;
    prefix += char;
  }
  return prefix.replace(/\s+$/u, '') + suffix;
}

/** Greedy word wrap whose returned lines are each guaranteed to fit maxWidth. */
function wrapPixelText(text, maxWidth, scale = 1) {
  const words = String(text ?? '').trim().split(/\s+/u).filter(Boolean);
  if (!words.length) return [''];
  const lines = [];
  let line = '';
  for (const word of words) {
    const next = line ? `${line} ${word}` : word;
    if (textWidth(next, scale) <= maxWidth) {
      line = next;
      continue;
    }
    if (line) lines.push(line);
    line = textWidth(word, scale) <= maxWidth ? word : fitPixelText(word, maxWidth, scale);
  }
  if (line) lines.push(line);
  return lines;
}

/** Draw one line of bitmap text with an integer scale. Returns the measured width. */
function drawPixelText(ctx, text, x, y, color, scale = 1) {
  const chars = pixelFontCharacters(text);
  const s = pixelFontScale(scale);
  const ox = Math.round(x);
  const oy = Math.round(y);
  if (color != null) ctx.fillStyle = color;

  for (let i = 0; i < chars.length; i++) {
    const rows = PIXEL_FONT_GLYPHS[chars[i]] || PIXEL_FONT_GLYPHS['?'];
    const gx = ox + i * (PIXEL_GLYPH_WIDTH + PIXEL_GLYPH_SPACING) * s;
    for (let row = 0; row < PIXEL_GLYPH_HEIGHT; row++) {
      // Coalesce horizontal runs into rectangles without changing the bitmap.
      for (let col = 0; col < PIXEL_GLYPH_WIDTH;) {
        if (rows[row][col] !== '#') { col++; continue; }
        const start = col;
        while (col < PIXEL_GLYPH_WIDTH && rows[row][col] === '#') col++;
        ctx.fillRect(gx + start * s, oy + row * s, (col - start) * s, s);
      }
    }
  }
  return textWidth(text, s);
}


// ===== src/render/light.js =====
// light.js — native-resolution software light compositor. drawStage paints albedo, licensed
// sprites, and matter FX into the shared 256x240 buffer; this post-pass then adds practical/event
// light and closes the frame with a palette-tinted vignette. Dither/material sampling is always
// keyed to world coordinates so camera motion cannot make the pattern swim across the scene.


const LIGHT_BAYER_8 = Object.freeze([
  0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26,
  12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
  3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
  15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21,
].map((value) => (value + 0.5) / 64));

function lightBayerAt(worldX, worldY) {
  return LIGHT_BAYER_8[(Math.floor(worldY) & 7) * 8 + (Math.floor(worldX) & 7)];
}

function lightSmooth(value) { return value * value * (3 - 2 * value); }
function lightMix(a, b, amount) { return a + (b - a) * amount; }
function lightClamp(value, low = 0, high = 1) { return value < low ? low : value > high ? high : value; }

/** Deterministic gradient noise used by both world materials and light spill. */
function materialNoise2(seed = 1) {
  const permutation = new Uint8Array(512);
  let state = (Number(seed) || 1) >>> 0;
  const random = () => {
    state |= 0; state = state + 0x6D2B79F5 | 0;
    let value = Math.imul(state ^ state >>> 15, 1 | state);
    value = value + Math.imul(value ^ value >>> 7, 61 | value) ^ value;
    return ((value ^ value >>> 14) >>> 0) / 4294967296;
  };
  for (let i = 0; i < 256; i++) permutation[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    const swap = permutation[i]; permutation[i] = permutation[j]; permutation[j] = swap;
  }
  for (let i = 0; i < 256; i++) permutation[i + 256] = permutation[i];
  const gradient = (hash, x, y) => {
    switch (hash & 3) {
      case 0: return x + y;
      case 1: return -x + y;
      case 2: return x - y;
      default: return -x - y;
    }
  };
  return (x, y) => {
    const floorX = Math.floor(x); const floorY = Math.floor(y);
    const X = floorX & 255; const Y = floorY & 255;
    const xf = x - floorX; const yf = y - floorY;
    const u = lightSmooth(xf); const v = lightSmooth(yf);
    const aa = permutation[permutation[X] + Y];
    const ab = permutation[permutation[X] + Y + 1];
    const ba = permutation[permutation[X + 1] + Y];
    const bb = permutation[permutation[X + 1] + Y + 1];
    const first = lightMix(gradient(aa, xf, yf), gradient(ba, xf - 1, yf), u);
    const second = lightMix(gradient(ab, xf, yf - 1), gradient(bb, xf - 1, yf - 1), u);
    return (lightMix(first, second, v) + 1) * 0.5;
  };
}

function materialFbm(seed = 1, octaves = 4) {
  const noise = materialNoise2(seed);
  return (x, y) => {
    let sum = 0; let amplitude = 0.5; let frequency = 1; let total = 0;
    for (let octave = 0; octave < octaves; octave++) {
      sum += noise(x * frequency, y * frequency) * amplitude;
      total += amplitude; amplitude *= 0.5; frequency *= 2;
    }
    return sum / total;
  };
}

/** Ordered ramp selection. Both fbm inputs and this threshold receive world coordinates. */
function materialRampKey(ramp, amount, worldX, worldY) {
  if (amount <= 0) return ramp[0];
  if (amount >= 1) return ramp[ramp.length - 1];
  const scaled = amount * (ramp.length - 1);
  const index = Math.floor(scaled);
  return scaled - index > lightBayerAt(worldX, worldY) ? ramp[index + 1] : ramp[index];
}

function createLightFrame(theme, camera, width, height, reduceEffects = false) {
  return {
    theme,
    rig: theme.lightRig || {},
    cameraX: Math.round(camera?.x || 0),
    cameraY: Math.round(camera?.y || 0),
    width,
    height,
    reduceEffects: !!reduceEffects,
    emitters: [],
    heroLayers: [],
  };
}

/** Register a world-space emitter. Matter is drawn by stagerender; only its light comes here. */
function registerLight(frame, emitter) {
  if (!frame || !emitter) return;
  frame.emitters.push({ ...emitter });
}

/** Register the certified hero's render-time alpha mask. Source pixels remain untouched: the mask
 * lets the shared-buffer pass address only pixels contributed by the hero draw. */
function registerHeroLayer(frame, layer) {
  if (!frame || !layer?.alphaMask || !layer.width || !layer.height) return;
  frame.heroLayers.push({ ...layer });
}

const LIGHT_METRICS = {
  frames: 0, totalMs: 0, lastMs: 0, maxMs: 0, readbacks: 0,
  heroConformedFrames: 0, heroPixels: 0,
};

function lightStatsSnapshot() {
  return {
    frames: LIGHT_METRICS.frames,
    lastMs: LIGHT_METRICS.lastMs,
    averageMs: LIGHT_METRICS.frames ? LIGHT_METRICS.totalMs / LIGHT_METRICS.frames : 0,
    maxMs: LIGHT_METRICS.maxMs,
    readbacks: LIGHT_METRICS.readbacks,
    heroConformedFrames: LIGHT_METRICS.heroConformedFrames,
    heroPixels: LIGHT_METRICS.heroPixels,
  };
}

function lightNow() {
  return typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now();
}

function lightAddPixel(data, width, height, x, y, rgb, amount) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= width || y >= height || amount <= 0) return;
  const index = (y * width + x) * 4;
  data[index] = Math.min(255, data[index] + rgb[0] * amount);
  data[index + 1] = Math.min(255, data[index + 1] + rgb[1] * amount);
  data[index + 2] = Math.min(255, data[index + 2] + rgb[2] * amount);
}

function lightMixPixel(data, index, rgb, amount) {
  data[index] = lightMix(data[index], rgb[0], amount);
  data[index + 1] = lightMix(data[index + 1], rgb[1], amount);
  data[index + 2] = lightMix(data[index + 2], rgb[2], amount);
}

/** Biome ambient/material response for the hero layer. This is deliberately inside the existing
 * framebuffer readback: no second per-frame readback and no mutation/recolour of certified art. */
function lightApplyHeroMaterial(data, frame) {
  const spec = frame.rig.hero;
  if (!spec || !frame.heroLayers.length) return 0;
  const ambient = hexToRgb(PALETTE[spec.ambient] || spec.ambient);
  const tint = hexToRgb(PALETTE[spec.tint] || spec.tint);
  const noise = materialFbm(spec.seed || 83, 3);
  let conformed = 0;
  for (const layer of frame.heroLayers) {
    const screenX = Math.round(layer.x - frame.cameraX);
    const screenY = Math.round(layer.y - frame.cameraY);
    for (let localY = 0; localY < layer.height; localY++) for (let localX = 0; localX < layer.width; localX++) {
      const maskX = layer.flip ? layer.width - 1 - localX : localX;
      if (!layer.alphaMask[localY * layer.width + maskX]) continue;
      const x = screenX + localX; const y = screenY + localY;
      if (x < 0 || y < 0 || x >= frame.width || y >= frame.height) continue;
      const worldX = x + frame.cameraX; const worldY = y + frame.cameraY;
      const texture = noise(worldX * 0.19, worldY * 0.23);
      const ordered = lightBayerAt(worldX, worldY);
      const grainGate = 0.18 + texture * 0.24;
      const shade = lightClamp((spec.shade || 0) * (0.78 + texture * 0.38)
        + (ordered < grainGate ? (spec.grain || 0) : 0), 0, 0.42);
      const index = (y * frame.width + x) * 4;
      lightMixPixel(data, index, ambient, shade);
      // Sparse ordered catches keep the same upper-left palette-light logic as world materials.
      if (ordered > 0.82 && texture > 0.48) {
        lightMixPixel(data, index, tint, spec.tintStrength || 0);
      }
      conformed++;
    }
  }
  return conformed;
}

function lightGlow(data, frame, cx, cy, radius, color, strength, power = 2) {
  const rgb = hexToRgb(PALETTE[color] || color);
  const x0 = Math.max(0, Math.floor(cx - radius)); const x1 = Math.min(frame.width - 1, Math.ceil(cx + radius));
  const y0 = Math.max(0, Math.floor(cy - radius)); const y1 = Math.min(frame.height - 1, Math.ceil(cy + radius));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const distance = Math.hypot(x - cx, y - cy);
    if (distance > radius) continue;
    const amount = Math.pow(1 - distance / radius, power) * strength;
    const worldX = x + frame.cameraX; const worldY = y + frame.cameraY;
    if (amount < 0.06 && amount * 12 < lightBayerAt(worldX, worldY)) continue;
    lightAddPixel(data, frame.width, frame.height, x, y, rgb, amount);
  }
}

function lightSpill(data, frame, cx, sourceY, floorY, radius, color, strength, seed) {
  if (floorY == null || floorY < sourceY) return;
  const rgb = hexToRgb(PALETTE[color] || color);
  const noise = materialFbm(seed || 3, 3);
  const lastY = Math.min(frame.height - 1, floorY + Math.round(radius * 0.75));
  for (let y = Math.max(0, floorY); y <= lastY; y++) {
    const progress = (y - floorY) / Math.max(1, lastY - floorY);
    const halfWidth = radius * (0.24 + progress * 0.62);
    for (let x = Math.max(0, Math.floor(cx - halfWidth)); x <= Math.min(frame.width - 1, Math.ceil(cx + halfWidth)); x++) {
      const across = 1 - Math.abs(x - cx) / halfWidth;
      if (across <= 0) continue;
      const worldX = x + frame.cameraX; const worldY = y + frame.cameraY;
      const wobble = 0.58 + 0.76 * noise(worldX * 0.1, worldY * 0.45);
      const amount = strength * Math.pow(1 - progress, 1.5) * Math.pow(across, 1.4) * wobble;
      if (amount < 0.05 && amount * 14 < lightBayerAt(worldX, worldY)) continue;
      lightAddPixel(data, frame.width, frame.height, x, y, rgb, amount);
    }
  }
}

function lightWash(data, frame, cx, cy, radiusX, radiusY, color, strength) {
  const rgb = hexToRgb(PALETTE[color] || color);
  const x0 = Math.max(0, Math.floor(cx - radiusX)); const x1 = Math.min(frame.width - 1, Math.ceil(cx + radiusX));
  const y0 = Math.max(0, Math.floor(cy - radiusY)); const y1 = Math.min(frame.height - 1, Math.ceil(cy + radiusY));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const distance = Math.hypot((x - cx) / radiusX, (y - cy) / radiusY);
    if (distance > 1) continue;
    const amount = Math.pow(1 - distance, 1.7) * strength;
    const worldX = x + frame.cameraX; const worldY = y + frame.cameraY;
    if (amount < 0.05 && amount * 14 < lightBayerAt(worldX, worldY)) continue;
    lightAddPixel(data, frame.width, frame.height, x, y, rgb, amount);
  }
}

function lightApplyRig(data, frame) {
  const rig = frame.rig;
  if (rig.key) {
    const keyX = frame.width * rig.key.x; const keyY = frame.height * rig.key.y;
    lightWash(data, frame, keyX, keyY, rig.key.radiusX || frame.width, rig.key.radiusY || frame.height,
      rig.key.color, rig.key.strength * (frame.reduceEffects ? 0.65 : 1));
  }
  if (rig.shaft) {
    const shaft = rig.shaft;
    const rgb = hexToRgb(PALETTE[shaft.color]);
    const noise = materialFbm(shaft.seed || 9, 3);
    for (let y = 0; y < frame.height; y++) {
      const progress = y / Math.max(1, frame.height - 1);
      const center = lightMix(frame.width * shaft.x0, frame.width * shaft.x1, progress);
      const halfWidth = lightMix(shaft.w0, shaft.w1, progress);
      for (let x = Math.max(0, Math.floor(center - halfWidth)); x <= Math.min(frame.width - 1, Math.ceil(center + halfWidth)); x++) {
        const across = 1 - Math.abs(x - center) / halfWidth;
        if (across <= 0) continue;
        const worldX = x + frame.cameraX; const worldY = y + frame.cameraY;
        const amount = shaft.strength * (frame.reduceEffects ? 0.55 : 1) * Math.pow(across, 1.6)
          * Math.pow(1 - progress * 0.72, 1.25) * (0.56 + noise(worldX * 0.07, worldY * 0.06) * 0.72);
        if (amount < 0.05 && amount * 14 < lightBayerAt(worldX, worldY)) continue;
        lightAddPixel(data, frame.width, frame.height, x, y, rgb, amount);
      }
    }
  }
}

function lightApplyEmitter(data, frame, emitter) {
  const cx = emitter.x - frame.cameraX;
  const cy = emitter.y - frame.cameraY;
  const baseRadius = emitter.radius || 24;
  const practicalScale = frame.reduceEffects ? 0.45 : 1;
  const eventScale = frame.reduceEffects ? 0.16 : 1;
  const isEvent = ['impact', 'death', 'shockwave'].includes(emitter.kind);
  const scale = isEvent ? eventScale : practicalScale;
  const lifeScale = emitter.maxLife ? lightClamp(emitter.life / emitter.maxLife) : 1;
  const strength = (emitter.strength == null ? 0.5 : emitter.strength) * scale * lifeScale;
  if (strength <= 0) return;
  const color = emitter.color || (emitter.kind === 'marker' ? 'u' : emitter.kind === 'death' ? 'o' : 'c');
  lightGlow(data, frame, cx, cy, baseRadius, color, strength, emitter.kind === 'impact' ? 3 : 2);
  if (emitter.kind === 'torch' || emitter.kind === 'checkpoint' || emitter.kind === 'marker' || emitter.kind === 'impact') {
    const core = emitter.coreColor || (emitter.kind === 'marker' ? 'u' : emitter.kind === 'impact' ? '5' : 'p');
    lightGlow(data, frame, cx, cy, Math.max(4, Math.round(baseRadius * 0.32)), core, strength * 1.18, 2);
  }
  if (emitter.floorY != null) {
    lightSpill(data, frame, cx, cy, emitter.floorY - frame.cameraY, baseRadius, color, strength * 0.58, emitter.seed);
  }
  if (emitter.kind === 'torch' || emitter.kind === 'checkpoint') {
    lightWash(data, frame, cx, cy + baseRadius * 0.18, baseRadius * 1.25, baseRadius, color, strength * 0.35);
  }
}

function lightApplyVignette(data, frame) {
  const spec = frame.rig.vignette;
  if (!spec) return;
  const rgb = hexToRgb(PALETTE[spec.color] || spec.color);
  for (let y = 0; y < frame.height; y++) for (let x = 0; x < frame.width; x++) {
    const dx = (x / frame.width - 0.5) * 2;
    const dy = (y / frame.height - 0.5) * 2;
    const distance = Math.hypot(dx * 0.9, dy);
    if (distance <= 0.56) continue;
    const amount = lightClamp((distance - 0.56) * spec.amount, 0, 0.82);
    const index = (y * frame.width + x) * 4;
    data[index] *= 1 - amount + amount * rgb[0] / 255;
    data[index + 1] *= 1 - amount + amount * rgb[1] / 255;
    data[index + 2] *= 1 - amount + amount * rgb[2] / 255;
  }
}

/** Apply one bounded getImageData/putImageData light pass to the real logical buffer. */
function applyLightPass(ctx, frame) {
  const started = lightNow();
  const image = ctx.getImageData(0, 0, frame.width, frame.height);
  LIGHT_METRICS.readbacks++;
  const heroPixels = lightApplyHeroMaterial(image.data, frame);
  lightApplyRig(image.data, frame);
  for (const emitter of frame.emitters) lightApplyEmitter(image.data, frame, emitter);
  lightApplyVignette(image.data, frame);
  ctx.putImageData(image, 0, 0);
  const elapsed = lightNow() - started;
  LIGHT_METRICS.frames++;
  LIGHT_METRICS.totalMs += elapsed;
  LIGHT_METRICS.lastMs = elapsed;
  LIGHT_METRICS.maxMs = Math.max(LIGHT_METRICS.maxMs, elapsed);
  if (heroPixels > 0) LIGHT_METRICS.heroConformedFrames++;
  LIGHT_METRICS.heroPixels += heroPixels;
  return { elapsedMs: elapsed, emitters: frame.emitters.length, readbacks: 1, heroPixels };
}


// ===== src/render/stagerender.js =====
// stagerender.js — draws a stage with camera scrolling (DESIGN-SEED art + M12-ART register). Beyond
// the entity sprites it now paints the gothic dressing: a themed night backdrop, a slow parallax
// skyline of ruins, licensed masonry faces, sparse ground decorations (gravestones, vines, banners,
// reliefs), and warm torch pools against the dark. Pure draw over a 2d context; the sim owns state.
// The stage's `theme` id (M12) selects a shared-ramp sub-palette — never off-palette.


let LAST_GROUND_CONTACTS = [];
let PLAYER_RENDER_TICK = 0;
let PROOF_PRESENTATION_FROZEN = false;

/** Proof-only deterministic capture control. Normal play never calls this; boot's existing
 * __proofFreeze hook uses it so repeated renders hold both animation and transient FX state. */
function setProofPresentationFreeze(on = true) {
  PROOF_PRESENTATION_FROZEN = !!on;
  if (PROOF_PRESENTATION_FROZEN) PLAYER_RENDER_TICK = 0;
}

/** Proof-only authored-frame selector; ignored as a capture guarantee unless presentation is frozen. */
function setProofPresentationTick(tick = 0) {
  if (PROOF_PRESENTATION_FROZEN) PLAYER_RENDER_TICK = Math.max(0, Math.floor(tick));
}
let LAST_ANIMATION_CONTACTS = [];
const STAGE_PRESENTATION = new WeakMap();
const STAGE_MATERIAL_CACHE = new Map();
const HERO_ALPHA_MASK_CACHE = new WeakMap();

function stageMaterialSeed(value) {
  const text = String(value);
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
  return hash >>> 0;
}

function stageMaterialField(seed, octaves = 4) {
  const key = `${seed}:${octaves}`;
  if (!STAGE_MATERIAL_CACHE.has(key)) STAGE_MATERIAL_CACHE.set(key, materialFbm(stageMaterialSeed(seed), octaves));
  return STAGE_MATERIAL_CACHE.get(key);
}

const PLAYER_ATTACK_FRAME_MAP = Object.freeze({
  katana_combo: Object.freeze([8, 0, 4, 5]),
  katana_slash: Object.freeze([0, 1, 2, 5]),
});

const AR3B_TIMING = Object.freeze({
  idleFrameTicks: 24,
  playerFrameTicks: 4,
  walkLeadTicks: 12,
  landVisualTicks: 18,
  runStridePixels: 4,
  attackVisualTicks: 8,
  attackWindupTicks: 2,
  visualHitstopFrames: 3,
  heroHurtFrames: 10,
  trashWindupRange: 10,
  landDustFrames: 12,
  deathEchoFrames: 20,
  bossDeathFrames: 30,
  bossStepPixels: 10,
});
// Compatibility export for earlier render-only tests/callers; AR3B is the active timing record.
const AR3A_TIMING = AR3B_TIMING;

function playerStripView(animation, frame) {
  const strip = HERO_RIG.strips[animation];
  const safeFrame = Math.max(0, Math.min(strip.frames - 1, Math.floor(frame || 0)));
  return Object.freeze({ animation, asset: playerStripAssetId(animation), frame: safeFrame });
}

/** Select an authored strip frame from render-visible state only. This preserves AR3's verb→pose
 *  boundary while replacing its old candidate-B stills with the certified 89-frame rig. */
function playerAnimationViewFor(player, swing, renderTick = 0, options = {}) {
  const { reduceEffects = false, hurtTicks = 0, landTicks = 0, moveTicks = 0, swingType = 'normal' } = options;
  if (hurtTicks > 0) {
    const elapsed = AR3B_TIMING.heroHurtFrames - hurtTicks;
    return playerStripView('hurt', reduceEffects ? 1 : Math.floor(elapsed * HERO_RIG.strips.hurt.frames / AR3B_TIMING.heroHurtFrames));
  }
  if (swing?.active) {
    const animation = swingType === 'normal' ? 'katana_combo' : 'katana_slash';
    const map = PLAYER_ATTACK_FRAME_MAP[animation];
    return playerStripView(animation, map[swing.frame] ?? map[0]);
  }
  if ((player?.dodging || 0) > 0) {
    const elapsed = FEEL.DODGE_DURATION_TICKS - player.dodging;
    const frame = Math.round(elapsed * (HERO_RIG.strips.dash.frames - 1) / Math.max(1, FEEL.DODGE_DURATION_TICKS - 1));
    return playerStripView('dash', frame);
  }
  if (landTicks > 0 && player?.onGround) {
    const elapsed = AR3B_TIMING.landVisualTicks - landTicks;
    return playerStripView('land', Math.floor(elapsed * HERO_RIG.strips.land.frames / AR3B_TIMING.landVisualTicks));
  }
  if (!player?.onGround) {
    if (player?.airJumpUsed) {
      return playerStripView('airspin', Math.floor(renderTick / AR3B_TIMING.playerFrameTicks) % HERO_RIG.strips.airspin.frames);
    }
    const vy = player?.vy || 0;
    const frame = vy < -3 ? 0 : vy < -1 ? 1 : vy < 0 ? 2 : vy < 1.5 ? 3 : vy < 3 ? 4 : 5;
    return playerStripView('jump', frame);
  }
  if (Math.abs(player?.vx || 0) > 0.01) {
    const animation = moveTicks >= AR3B_TIMING.walkLeadTicks ? 'run' : 'walk';
    const strip = HERO_RIG.strips[animation];
    const frame = Math.floor(Math.abs(player.x || 0) / AR3B_TIMING.runStridePixels) % strip.frames;
    return playerStripView(animation, frame);
  }
  const idleFrame = reduceEffects ? 0 : Math.floor(renderTick / AR3B_TIMING.playerFrameTicks) % HERO_RIG.strips.idle.frames;
  return playerStripView('idle', idleFrame);
}

/** Compatibility wrapper retained for existing render callers/tests. */
function playerAssetIdFor(player, swing, renderTick = 0, reduceEffects = false, hurt = false) {
  return playerAnimationViewFor(player, swing, renderTick, {
    reduceEffects, hurtTicks: hurt ? AR3B_TIMING.heroHurtFrames : 0,
  }).asset;
}

/** Presentation-only contact anticipation for trash. Contact damage is mechanically unchanged;
 *  this view begins a planted lean while an eligible enemy is approaching the overlap distance. */
function enemyAttackPresentation(enemy, player, playerIframes = 0) {
  const halfW = enemy?.type?.body?.halfW ?? 7;
  const contactDistance = PLAYER_HALF.halfW + halfW;
  const dx = (player?.x || 0) - (enemy?.x || 0);
  const distance = Math.abs(dx);
  const facingToward = Math.sign(dx || enemy?.facing || 1) === (enemy?.facing || 1);
  if (playerIframes <= 0 && facingToward && distance <= contactDistance + AR3B_TIMING.trashWindupRange) {
    if (distance > contactDistance) {
      return Object.freeze({ phase: 'windup', lean: -(enemy.facing || 1) * 3, squash: 2, shift: 0 });
    }
    return Object.freeze({ phase: 'strike', lean: (enemy.facing || 1) * 4, squash: 1, shift: (enemy.facing || 1) * 2 });
  }
  if (enemy?.type?.hop && enemy.onGround && enemy.hopTimer >= (enemy.type.hopEvery || 48) - 8) {
    return Object.freeze({ phase: 'coil', lean: 0, squash: 3, shift: 0 });
  }
  return Object.freeze({ phase: 'idle', lean: 0, squash: 0, shift: 0 });
}

const ENEMY_ANIM_TICKS = 8;

/** Resolve the themed skin name for an enemy class. */
function enemySkinFor(theme, typeId) {
  const skins = themeFor(theme).enemySkins;
  return skins?.[typeId] || (typeId === 'hopper' ? 'slime_spiked' : 'zombie');
}

/** Pick the animation state for a live enemy from real sim signals. */
function enemyVisualState(e, player, iframes) {
  if (e.hitFlash > 0) return 'hit';
  const attack = enemyAttackPresentation(e, player, iframes);
  if (attack.phase !== 'idle') return 'attack';
  if (e.onGround && Math.abs(e.vx || 0) > 0.01) return 'run';
  return 'idle';
}

/** Build the asset id for an enemy's current themed skin + state. */
function enemyAssetFor(e, theme, state) {
  const typeId = e.type.id;
  const skin = enemySkinFor(theme, typeId);
  return `enemy_${typeId}_${skin}_${state}`;
}

/** Looping frame index for a multi-frame strip asset. */
function enemyFrameFor(assetId, renderTick) {
  const asset = getAsset(assetId);
  if (!asset || !asset.frames) return 0;
  return Math.floor(renderTick / ENEMY_ANIM_TICKS) % asset.frames;
}

/** Read-only proof hook: objective opaque-bottom vs surface-row measurements from the last frame. */
function groundContactSnapshot() {
  return LAST_GROUND_CONTACTS.map((contact) => ({ ...contact }));
}

function recordGroundContact(kind, entity, drawX, drawY, visual, cam, vw, vh, frameAnchor = null) {
  if (!entity.onGround) return;
  const drawCol = Math.round(drawX - cam.x);
  const surfaceRow = Math.round(entity.y - cam.y);
  const drawRow = Math.round(drawY - cam.y);
  const width = visual?.width ?? visual?.w ?? 0;
  const height = visual?.height ?? visual?.h ?? 0;
  if (drawCol + width <= 0 || drawCol >= vw || drawRow + height <= 0 || drawRow >= vh) return;
  const bottomInset = visual?.bottomInset ?? 0;
  const opaqueBottomRow = frameAnchor
    ? drawRow + frameAnchor.y
    : drawRow + height - bottomInset - 1;
  LAST_GROUND_CONTACTS.push({
    kind,
    surfaceRow,
    opaqueBottomRow,
    gap: surfaceRow - opaqueBottomRow,
  });
}

const DRESS_SPRITE = {
  grass: GRASS_TUFT, gravestone: GRAVESTONE, brokenArch: BROKEN_ARCH,
  vine: VINE, moss: GRASS_TUFT, skull: SKULL, torch: WALL_TORCH,
  gargoyle: GRAVESTONE, banner: VINE,
};
const DRESS_ASSET = {
  gargoyle: 'env_prop_gargoyle', banner: 'env_prop_banner',
};

/** Blit a parsed sprite whose top-left is (wx,wy) in world space, offset by the camera. */
function blit(ctx, sprite, wx, wy, cam) {
  const ox = Math.round(wx - cam.x);
  const oy = Math.round(wy - cam.y);
  for (let y = 0; y < sprite.h; y++) {
    const row = sprite.rows[y];
    for (let x = 0; x < sprite.w; x++) {
      const hex = PALETTE[row[x]];
      if (hex == null) continue;
      ctx.fillStyle = hex;
      ctx.fillRect(ox + x, oy + y, 1, 1);
    }
  }
}

/** Blit a sprite remapping palette keys (used to tint the neutral stone tiles per theme). */
function blitTinted(ctx, sprite, wx, wy, cam, remap) {
  const ox = Math.round(wx - cam.x);
  const oy = Math.round(wy - cam.y);
  for (let y = 0; y < sprite.h; y++) {
    const row = sprite.rows[y];
    for (let x = 0; x < sprite.w; x++) {
      const key = remap[row[x]] || row[x];
      const hex = PALETTE[key];
      if (hex == null) continue;
      ctx.fillStyle = hex;
      ctx.fillRect(ox + x, oy + y, 1, 1);
    }
  }
}

/** Silhouette blit in a single colour (for telegraph / flash tells / parallax). */
function blitSilhouette(ctx, sprite, wx, wy, cam, hex) {
  const ox = Math.round(wx - cam.x);
  const oy = Math.round(wy - cam.y);
  ctx.fillStyle = hex;
  for (let y = 0; y < sprite.h; y++) {
    const row = sprite.rows[y];
    for (let x = 0; x < sprite.w; x++) {
      if (row[x] !== '.') ctx.fillRect(ox + x, oy + y, 1, 1);
    }
  }
}

function frameWidthFor(asset) {
  return asset?.frameWidth ?? asset?.width ?? 0;
}

/** Feet-rooted placement for one authored strip frame. The anchor is measured from the final
 *  painted pixels, so the last opaque row lands exactly one pixel above the collision surface. */
function playerFramePlacement(asset, frame, groundX, feetY, flip = false) {
  const fw = frameWidthFor(asset);
  const anchor = asset.frameAnchors?.[frame]
    || { x: fw / 2, y: asset.height - (asset.bottomInset || 0) - 1 };
  const anchorX = flip ? fw - 1 - anchor.x : anchor.x;
  return {
    x: Math.round(groundX - anchorX),
    y: Math.round(feetY - 1 - anchor.y),
    anchor,
  };
}

/** Draw a curated PNG asset (by id) with optional horizontal flip and animation frame.
 *  Falls back to the provided code-drawn sprite function when the asset is unavailable
 *  (headless tests) or not loaded yet. Returns true if the curated asset was drawn. */
function drawAssetAlpha(ctx, id, wx, wy, cam, flip, alpha = 1, frame = 0) {
  const asset = getAsset(id);
  if (!asset || !assetReady(id)) return false;
  const fw = frameWidthFor(asset);
  const sourceX = frame * fw;
  const ox = Math.round(wx - cam.x);
  const oy = Math.round(wy - cam.y);
  ctx.save();
  ctx.globalAlpha = alpha;
  if (flip) {
    ctx.translate(ox + fw, oy);
    ctx.scale(-1, 1);
    ctx.drawImage(asset.image, sourceX, 0, fw, asset.height, 0, 0, fw, asset.height);
  } else {
    ctx.drawImage(asset.image, sourceX, 0, fw, asset.height, ox, oy, fw, asset.height);
  }
  ctx.restore();
  return true;
}

function drawAsset(ctx, id, wx, wy, cam, flip, frame = 0) {
  return drawAssetAlpha(ctx, id, wx, wy, cam, flip, 1, frame);
}

/** Integer row-slice compositor. The opaque bottom is invariant: squash removes rows from the
 *  upper body and moves the shortened result down, while lean shifts only rows above the feet. */
function drawAssetPosed(ctx, id, wx, wy, cam, flip, pose = {}, frame = 0) {
  const asset = getAsset(id);
  if (!asset || !assetReady(id)) return false;
  const source = asset.image;
  if (!source) return false;
  const fw = frameWidthFor(asset);
  const sourceX = frame * fw;
  const ox = Math.round(wx - cam.x + (pose.shift || 0));
  const oy = Math.round(wy - cam.y);
  const opaqueHeight = Math.max(1, asset.height - (asset.bottomInset || 0));
  const squash = Math.max(0, Math.min(opaqueHeight - 1, Math.round(pose.squash || 0)));
  const destHeight = opaqueHeight - squash;
  const lean = Math.round(pose.lean || 0);
  ctx.save();
  ctx.globalAlpha = pose.alpha == null ? 1 : pose.alpha;
  ctx.imageSmoothingEnabled = false;
  for (let row = 0; row < destHeight; row++) {
    const sourceRow = Math.min(opaqueHeight - 1, Math.floor(row * opaqueHeight / destHeight));
    const rank = destHeight <= 1 ? 0 : 1 - row / (destHeight - 1);
    const rowShift = Math.round(lean * rank);
    const dy = oy + squash + row;
    if (pose.dissolve > 0) {
      // Ordered threshold applies to the echo's own pixels while its source asset remains intact.
      // Sampling uses world coordinates, so scrolling cannot make the dissolve crawl over a body.
      for (let x = 0; x < fw; x++) {
        const worldX = Math.round(wx + rowShift + x);
        const worldY = Math.round(wy + squash + row);
        if (lightBayerAt(worldX, worldY) < pose.dissolve) continue;
        const sourcePixelX = sourceX + (flip ? fw - 1 - x : x);
        ctx.drawImage(source, sourcePixelX, sourceRow, 1, 1, ox + rowShift + x, dy, 1, 1);
      }
      continue;
    }
    if (flip) {
      ctx.save();
      ctx.translate(ox + fw + rowShift, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(source, sourceX, sourceRow, fw, 1, 0, dy, fw, 1);
      ctx.restore();
    } else {
      ctx.drawImage(source, sourceX, sourceRow, fw, 1, ox + rowShift, dy, fw, 1);
    }
  }
  ctx.restore();
  return true;
}

function blitPosed(ctx, sprite, wx, wy, cam, pose = {}) {
  const ox = Math.round(wx - cam.x + (pose.shift || 0));
  const oy = Math.round(wy - cam.y);
  const squash = Math.max(0, Math.min(sprite.h - 1, Math.round(pose.squash || 0)));
  const destHeight = sprite.h - squash;
  const lean = Math.round(pose.lean || 0);
  ctx.save();
  ctx.globalAlpha = pose.alpha == null ? 1 : pose.alpha;
  for (let row = 0; row < destHeight; row++) {
    const sourceRow = Math.min(sprite.h - 1, Math.floor(row * sprite.h / destHeight));
    const rank = destHeight <= 1 ? 0 : 1 - row / (destHeight - 1);
    const rowShift = Math.round(lean * rank);
    for (let x = 0; x < sprite.w; x++) {
      const key = sprite.rows[sourceRow][x];
      const hex = PALETTE[key];
      if (key === '.' || hex == null) continue;
      ctx.fillStyle = hex;
      ctx.fillRect(ox + rowShift + x, oy + squash + row, 1, 1);
    }
  }
  ctx.restore();
}

function drawCharacterPosed(ctx, id, fallback, wx, wy, cam, flip, pose = {}, frame = 0) {
  if (drawAssetPosed(ctx, id, wx, wy, cam, flip, pose, frame)) return true;
  blitPosed(ctx, fallback, wx, wy, cam, pose);
  return false;
}

/** Cache alpha for every frame in one decoded hero strip. This is a one-time asset read, never a
 * per-frame framebuffer readback; applyLightPass remains the only logical-buffer readback. */
function heroAssetAlphaMask(asset, frame) {
  if (!asset?.image || typeof document === 'undefined') return null;
  let masks = HERO_ALPHA_MASK_CACHE.get(asset);
  if (!masks) {
    const canvas = document.createElement('canvas');
    canvas.width = asset.width; canvas.height = asset.height;
    const context = canvas.getContext('2d', { willReadFrequently: true });
    context.drawImage(asset.image, 0, 0);
    const rgba = context.getImageData(0, 0, asset.width, asset.height).data;
    const frameWidth = frameWidthFor(asset);
    masks = Array.from({ length: asset.frames || 1 }, (_, frameIndex) => {
      const mask = new Uint8Array(frameWidth * asset.height);
      for (let y = 0; y < asset.height; y++) for (let x = 0; x < frameWidth; x++) {
        mask[y * frameWidth + x] = rgba[(y * asset.width + frameIndex * frameWidth + x) * 4 + 3] > 0 ? 1 : 0;
      }
      return mask;
    });
    HERO_ALPHA_MASK_CACHE.set(asset, masks);
  }
  return masks[Math.max(0, Math.min(masks.length - 1, frame))];
}

function heroFallbackAlphaMask(sprite) {
  const mask = new Uint8Array(sprite.w * sprite.h);
  for (let y = 0; y < sprite.h; y++) for (let x = 0; x < sprite.w; x++) {
    mask[y * sprite.w + x] = sprite.rows[y][x] === '.' ? 0 : 1;
  }
  return mask;
}

/** Ground-center transform puppetry for licensed characters. Integer row resampling keeps
 *  the bitmap crisp while squash/stretch, lean, shake, and lunge all pivot around planted feet. */
function drawAssetPuppet(ctx, id, groundX, feetY, cam, flip, pose = {}, frame = 0) {
  const asset = getAsset(id);
  if (!asset || !assetReady(id)) return false;
  const source = asset.image;
  if (!source) return false;
  const fw = frameWidthFor(asset);
  const sourceX = frame * fw;
  const opaqueHeight = Math.max(1, asset.height - (asset.bottomInset || 0));
  const squash = Math.round(pose.squash || 0);
  const destHeight = Math.max(1, opaqueHeight - squash + Math.round(pose.stretchY || 0));
  const destWidth = Math.max(1, fw + Math.round(pose.stretchX || 0));
  const baseX = Math.round(groundX - cam.x - destWidth / 2 + (pose.shift || 0));
  const baseY = Math.round(feetY - cam.y - destHeight);
  const lean = Math.round(pose.lean || 0);
  ctx.save();
  ctx.globalAlpha = pose.alpha == null ? 1 : pose.alpha;
  ctx.imageSmoothingEnabled = false;
  for (let row = 0; row < destHeight; row++) {
    const sourceRow = Math.min(opaqueHeight - 1, Math.floor(row * opaqueHeight / destHeight));
    const rank = destHeight <= 1 ? 0 : 1 - row / (destHeight - 1);
    const rowShift = Math.round(lean * rank);
    const dy = baseY + row;
    if (flip) {
      ctx.save();
      ctx.translate(baseX + destWidth + rowShift, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(source, sourceX, sourceRow, fw, 1, 0, dy, destWidth, 1);
      ctx.restore();
    } else {
      ctx.drawImage(source, sourceX, sourceRow, fw, 1, baseX + rowShift, dy, destWidth, 1);
    }
  }
  ctx.restore();
  return true;
}

function drawCharacterPuppet(ctx, id, fallback, groundX, feetY, cam, flip, pose = {}, frame = 0) {
  if (!drawAssetPuppet(ctx, id, groundX, feetY, cam, flip, pose, frame)) {
    const wy = groundedVisualY(feetY, fallback);
    blitPosed(ctx, fallback, groundX - fallback.w / 2, wy, cam, pose);
  }
}

/** Pure boss render view: the 34-tick sim telegraph is deliberately much longer than the hero's
 *  two-tick wind-up, while every phase keeps the one licensed bitmap anchored at ground center. */
function bossPuppetPose(boss, renderTick = 0, reduceEffects = false) {
  const facing = boss?.facing || 1;
  let pose;
  if (boss?.phase === BOSS_PHASE.TELEGRAPH) {
    const shake = reduceEffects ? 0 : [-1, 1, 0][Math.abs(boss.timer || 0) % 3];
    pose = { lean: -facing * 5, squash: 7, stretchX: 6, shift: shake };
  } else if (boss?.phase === BOSS_PHASE.LUNGE) {
    pose = { lean: facing * 11, stretchX: 10, stretchY: 3, shift: facing * 6 };
  } else if (boss?.phase === BOSS_PHASE.RECOVER) {
    pose = { lean: -facing * 3, squash: 4, stretchX: 2 };
  } else {
    const step = Math.floor(renderTick / 12) % 2;
    pose = { lean: facing * step, squash: step, stretchX: step };
  }
  if (boss?.hitFlash > 0) {
    pose.lean = -facing * 4;
    pose.shift = -facing * (boss.hitFlash >= 4 ? 2 : 1);
  }
  return pose;
}

function drawAttackTell(ctx, worldX, topY, cam, phase, facing, reduce, scale = 1) {
  if (phase !== 'windup' && phase !== 'coil') return;
  const pulse = reduce || Math.floor(PLAYER_RENDER_TICK / 4) % 2 === 0;
  const width = textWidth('!', scale);
  const x = Math.round(worldX - cam.x + facing * 5 - width / 2);
  const y = Math.round(topY - cam.y - (scale === 1 ? 8 : 13));
  drawPixelText(ctx, '!', x, y, pulse ? PALETTE['c'] : PALETTE['g'], scale);
}

function spawnBurst(view, type, x, y, dir = 1) {
  const count = type === 'death' ? 20 : type === 'shockwave' ? 14 : type === 'impact' ? 20 : 6;
  const life = type === 'death' ? AR3B_TIMING.deathEchoFrames
    : type === 'shockwave' ? 12 : type === 'impact' ? 9 : AR3B_TIMING.landDustFrames;
  for (let i = 0; i < count; i++) {
    const spread = ((i * 5) % 9) - 4;
    view.particles.push({
      type, x: x + spread, y: y - (type === 'death' ? (i * 7) % 18 : 1 + (i % 3)),
      ordinal: i,
      role: type === 'impact' ? (i % 5 === 0 ? 'blood' : 'spark')
        : type === 'death' ? 'ember' : type,
      vx: type === 'shockwave' ? dir * (0.8 + (i % 5) * 0.4)
        : type === 'impact' ? dir * ((i % 5 === 0 ? 0.35 : 0.8) + (i % 3) * 0.42) : spread * 0.08,
      vy: type === 'death' ? -0.35 - (i % 4) * 0.08
        : type === 'impact' ? -0.8 + (i % 5) * 0.35
          : type === 'shockwave' ? -0.15 - (i % 3) * 0.12 : -0.25,
      life, maxLife: life,
    });
  }
  if (type === 'impact' || type === 'death' || type === 'shockwave') {
    view.eventLights.push({
      kind: type, x, y, dir,
      floorY: type === 'impact' ? y + 12 : y,
      radius: type === 'impact' ? 38 : type === 'shockwave' ? 30 : 22,
      strength: type === 'impact' ? 0.78 : type === 'shockwave' ? 0.42 : 0.30,
      color: type === 'impact' ? 'c' : type === 'death' ? 'o' : 'j',
      coreColor: type === 'impact' ? '5' : undefined,
      life, maxLife: life,
    });
  }
}

function nearestThreat(s) {
  const threats = [...(s.enemies || []).filter((enemy) => enemy.alive)];
  if (s.boss?.alive) threats.push(s.boss);
  let nearest = null;
  for (const threat of threats) {
    const distance = Math.abs(threat.x - s.player.x);
    if (!nearest || distance < nearest.distance) nearest = { threat, distance };
  }
  return nearest?.threat || null;
}

function nearestThreatDirection(s) {
  const threat = nearestThreat(s);
  if (!threat) return -s.player.facing;
  return s.player.x < threat.x ? -1 : 1;
}

/** Advance presentation-only FX from stage state. Exported for headless render-boundary tests. */
function presentationFor(s, rawSwing) {
  let view = STAGE_PRESENTATION.get(s);
  if (!view) {
    view = {
      tick: 0, lastEvents: null, lastOnGround: s.player.onGround, lastDodge: 0,
      hurt: 0, hurtDir: 0, hitstop: 0, heldSwingFrame: -1,
      trashStrike: 0, strikeTarget: null, particles: [], deathEchoes: [], bossDeathEchoes: [],
      trashDeathEchoes: [], eventLights: [],
      lastRunBeat: -1, lastBossPhase: s.boss?.phase || null, lastBossStep: null,
      lastAirJumpSerial: 0, land: 0, moveTicks: 0,
    };
    STAGE_PRESENTATION.set(s, view);
  }
  if (view.lastEvents !== s.events) {
    view.lastEvents = s.events;
    for (const event of s.events || []) {
      if (event.type === 'hurt') {
        view.hurt = AR3B_TIMING.heroHurtFrames;
        view.hurtDir = nearestThreatDirection(s);
        const threat = nearestThreat(s);
        if (threat && threat !== s.boss) {
          view.trashStrike = 4;
          view.strikeTarget = threat;
        }
        spawnBurst(view, 'impact', s.player.x, s.player.y - 11, view.hurtDir);
      } else if (event.type === 'hit') {
        view.hitstop = AR3B_TIMING.visualHitstopFrames;
        view.heldSwingFrame = rawSwing.active ? Math.max(1, rawSwing.frame) : 2;
        const target = event.enemy === 'boss'
          ? s.boss
          : (s.enemies || []).find((enemy) => enemy.type.id === event.enemy && enemy.hitFlash > 0);
        if (target) spawnBurst(view, 'impact', target.x, target.y - (event.enemy === 'boss' ? 25 : 11), s.player.facing);
      } else if (event.type === 'death') {
        view.deathEchoes.push({ x: event.at.x, y: event.at.y, facing: s.player.facing, life: AR3B_TIMING.deathEchoFrames });
        spawnBurst(view, 'death', event.at.x, event.at.y, s.player.facing);
      } else if (event.type === 'kill') {
        view.trashDeathEchoes.push({
          x: event.at.x, y: event.at.y, facing: event.facing || 1, enemy: event.enemy,
          life: AR3B_TIMING.deathEchoFrames,
        });
        spawnBurst(view, 'death', event.at.x, event.at.y, event.facing || 1);
      } else if (event.type === 'boss-defeat' && s.boss) {
        view.bossDeathEchoes.push({
          x: s.boss.x, y: s.boss.y, facing: s.boss.facing, life: AR3B_TIMING.bossDeathFrames,
        });
        spawnBurst(view, 'death', s.boss.x, s.boss.y - 24, s.boss.facing);
      }
    }
  }
  // Durable air-jump dust: serial + stored coords survive catch-up ticks that replace s.events.
  // Audio continues to use the immediate stage event; this path must not duplicate on re-entry.
  const airJump = s.airJumpPresentation;
  if (airJump && airJump.serial > view.lastAirJumpSerial) {
    view.lastAirJumpSerial = airJump.serial;
    spawnBurst(view, 'dust', airJump.x, airJump.y + 4, -s.player.facing);
  }
  if (!view.lastOnGround && s.player.onGround) {
    view.land = AR3B_TIMING.landVisualTicks;
    spawnBurst(view, 'dust', s.player.x, s.player.y, -s.player.facing);
  }
  view.lastOnGround = s.player.onGround;
  if (s.player.onGround && Math.abs(s.player.vx || 0) > 0.01 && s.player.dodging <= 0) view.moveTicks++;
  else view.moveTicks = 0;
  if (s.player.dodging > 0 && (view.tick % 2 === 0 || view.lastDodge <= 0)) {
    spawnBurst(view, 'dust', s.player.x - s.player.dodgeDir * 7, s.player.y, -s.player.dodgeDir);
  }
  view.lastDodge = s.player.dodging;
  const runBeat = s.player.onGround && Math.abs(s.player.vx || 0) > 0.01
    ? Math.floor(Math.abs(s.player.x || 0) / AR3B_TIMING.runStridePixels) % 2 : -1;
  if (runBeat === 0 && view.lastRunBeat !== 0) {
    spawnBurst(view, 'dust', s.player.x - s.player.facing * 3, s.player.y, -s.player.facing);
  }
  view.lastRunBeat = runBeat;
  if (s.boss?.alive) {
    if (view.lastBossPhase !== s.boss.phase && s.boss.phase === BOSS_PHASE.LUNGE) {
      spawnBurst(view, 'shockwave', s.boss.x + s.boss.facing * 22, s.boss.y, s.boss.facing);
    }
    view.lastBossPhase = s.boss.phase;
    const bossStep = s.boss.phase === BOSS_PHASE.IDLE && Math.abs(s.boss.vx || 0) > 0.01
      ? Math.floor(Math.abs(s.boss.x || 0) / AR3B_TIMING.bossStepPixels) : null;
    if (bossStep != null && view.lastBossStep != null && bossStep !== view.lastBossStep) {
      spawnBurst(view, 'dust', s.boss.x - s.boss.facing * 18, s.boss.y, -s.boss.facing);
    }
    view.lastBossStep = bossStep;
  }
  return view;
}

function drawPresentationEffects(ctx, view, cam, theme, reduce) {
  for (const echo of view.deathEchoes) {
    const progress = 1 - echo.life / AR3B_TIMING.deathEchoFrames;
    const assetId = playerStripAssetId('death');
    const visual = getAsset(assetId) || PLAYER_R;
    const frame = Math.min(HERO_RIG.strips.death.frames - 1, Math.floor(progress * HERO_RIG.strips.death.frames));
    const flip = echo.facing === FACING.RIGHT;
    const placement = visual.frameAnchors
      ? playerFramePlacement(visual, frame, echo.x, echo.y, flip)
      : { x: echo.x - visual.w / 2, y: groundedVisualY(echo.y, visual) };
    const fallback = echo.facing === FACING.LEFT ? PLAYER_L : PLAYER_R;
    drawCharacterPosed(ctx, assetId, fallback, placement.x, placement.y, cam, flip, {
      alpha: Math.max(0.55, echo.life / AR3B_TIMING.deathEchoFrames),
    }, frame);
  }
  for (const echo of view.bossDeathEchoes) {
    const progress = 1 - echo.life / AR3B_TIMING.bossDeathFrames;
    const fallback = echo.facing === FACING.LEFT ? BOSS_L : BOSS_R;
    drawCharacterPuppet(ctx, 'boss', fallback, echo.x, echo.y, cam, echo.facing === FACING.LEFT, {
      lean: echo.facing * Math.round(progress * 8),
      squash: Math.round(progress * 40),
      stretchX: Math.round(progress * 12),
      alpha: Math.max(0.10, echo.life / AR3B_TIMING.bossDeathFrames),
    });
  }
  for (const echo of view.trashDeathEchoes) {
    const progress = 1 - echo.life / AR3B_TIMING.deathEchoFrames;
    const isHopper = echo.enemy === 'hopper';
    const skin = enemySkinFor(theme, echo.enemy);
    const assetId = `enemy_${echo.enemy}_${skin}_death`;
    const fallback = echo.facing === FACING.LEFT
      ? (isHopper ? HOPPER_L : WALKER_L)
      : (isHopper ? HOPPER_R : WALKER_R);
    const asset = getAsset(assetId) || fallback;
    const fw = asset.frameWidth || asset.width || asset.w;
    const wy = groundedVisualY(echo.y, asset);
    const frame = Math.min(
      (asset.frames ? asset.frames - 1 : 0),
      Math.floor(progress * (asset.frames || 1)),
    );
    drawCharacterPosed(ctx, assetId, fallback, echo.x - fw / 2, wy, cam, echo.facing === FACING.LEFT, {
      lean: echo.facing * Math.round(progress * 5),
      squash: Math.round(progress * 9),
      alpha: Math.max(0.32, echo.life / AR3B_TIMING.deathEchoFrames),
      dissolve: Math.min(0.82, progress * 0.92),
    }, frame);
  }
  // Event bodies: a white-hot impact core, an ordered compression ring, and a floor-bound
  // shockwave. The compositor below turns these same events into actual scene lights.
  for (const emitter of view.eventLights) {
    const sx = Math.round(emitter.x - cam.x); const sy = Math.round(emitter.y - cam.y);
    const progress = 1 - emitter.life / emitter.maxLife;
    if (emitter.kind === 'impact') {
      const ringX = 5 + progress * 14; const ringY = 3 + progress * 8;
      ctx.fillStyle = PALETTE[reduce ? 'j' : 'p'];
      for (let step = 0; step < 56; step++) {
        const angle = step / 56 * Math.PI * 2;
        const px = Math.round(sx + Math.cos(angle) * ringX);
        const py = Math.round(sy + Math.sin(angle) * ringY);
        if (lightBayerAt(px + cam.x, py + cam.y) < (reduce ? 0.46 : 0.72)) ctx.fillRect(px, py, 1, 1);
      }
      if (emitter.life >= emitter.maxLife - (reduce ? 1 : 3)) {
        ctx.fillStyle = PALETTE[reduce ? 'p' : '5'];
        ctx.fillRect(sx - 1, sy - 1, 3, 3);
      }
    } else if (emitter.kind === 'shockwave') {
      ctx.fillStyle = PALETTE[reduce ? '7' : 'j'];
      const reach = Math.round(4 + progress * 22);
      ctx.fillRect(sx - reach, sy - 1, reach * 2 + 1, 1);
      ctx.fillRect(sx - Math.round(reach * 0.65), sy - 2, Math.round(reach * 1.3), 1);
    }
  }
  for (const particle of view.particles) {
    const fade = particle.life / particle.maxLife;
    if (reduce && particle.role === 'ember' && particle.ordinal % 2) continue;
    ctx.globalAlpha = Math.max(0.18, fade) * (reduce ? 0.72 : 1);
    ctx.fillStyle = particle.role === 'blood' ? PALETTE[particle.ordinal % 2 ? 'f' : 'g']
      : particle.role === 'ember' ? PALETTE[particle.ordinal % 3 ? 'g' : 'o']
      : particle.type === 'impact' ? PALETTE[reduce ? 'j' : (particle.ordinal % 3 ? 'c' : 'p')]
      : particle.type === 'shockwave' ? (particle.life % 2 ? PALETTE['j'] : PALETTE['7'])
      : particle.type === 'death' ? PALETTE['g']
        : PALETTE['7'];
    const px = Math.round(particle.x - cam.x); const py = Math.round(particle.y - cam.y);
    if (particle.role === 'spark') {
      const tail = Math.max(1, Math.round(Math.abs(particle.vx) * 2));
      ctx.fillRect(px - Math.sign(particle.vx) * tail, py, tail + 1, 1);
    } else {
      const size = particle.type === 'shockwave' && particle.life > particle.maxLife - 3 ? 2 : 1;
      ctx.fillRect(px, py, size, size);
    }
  }
  ctx.globalAlpha = 1;
}

function advancePresentation(view) {
  view.tick++;
  if (view.hurt > 0) view.hurt--;
  if (view.land > 0) view.land--;
  if (view.hitstop > 0) view.hitstop--;
  if (view.trashStrike > 0) view.trashStrike--;
  else view.strikeTarget = null;
  for (const echo of view.deathEchoes) echo.life--;
  view.deathEchoes = view.deathEchoes.filter((echo) => echo.life > 0);
  for (const echo of view.bossDeathEchoes) echo.life--;
  view.bossDeathEchoes = view.bossDeathEchoes.filter((echo) => echo.life > 0);
  for (const echo of view.trashDeathEchoes) echo.life--;
  view.trashDeathEchoes = view.trashDeathEchoes.filter((echo) => echo.life > 0);
  for (const particle of view.particles) {
    particle.x += particle.vx;
    particle.y += particle.vy;
    particle.vy += particle.type === 'dust' || particle.type === 'shockwave' ? 0.02 : 0.06;
    particle.life--;
  }
  view.particles = view.particles.filter((particle) => particle.life > 0);
  for (const emitter of view.eventLights) emitter.life--;
  view.eventLights = view.eventLights.filter((emitter) => emitter.life > 0);
}

const AR3B_STRIP_FRAMES = Object.freeze({
  hero: Object.freeze([
    { label: 'IDLE', animation: 'idle', frame: 0, pose: {} },
    { label: 'WALK', animation: 'walk', frame: 2, pose: {}, dust: true },
    { label: 'RUN', animation: 'run', frame: 4, pose: {}, dust: true },
    { label: 'DASH', animation: 'dash', frame: 3, pose: {}, dust: true },
    { label: 'COMBO A', animation: 'katana_combo', frame: 0, pose: {} },
    { label: 'COMBO B', animation: 'katana_combo', frame: 4, pose: {}, impact: true },
    { label: 'HURT', animation: 'hurt', frame: 2, pose: {}, impact: true },
    { label: 'DEATH', animation: 'death', frame: 9, pose: {} },
  ]),
  walker: Object.freeze([
    { label: 'IDLE', pose: {} },
    { label: 'PATROL', pose: { lean: 1 } },
    { label: 'WIND-UP A', pose: { lean: -2, squash: 1 }, tell: true },
    { label: 'WIND-UP B', pose: { lean: -3, squash: 2 }, tell: true },
    { label: 'STRIKE', pose: { lean: 4, squash: 1, shift: 2 } },
    { label: 'HITSTOP', pose: { lean: 4, shift: 2 }, impact: true },
    { label: 'HURT', pose: { lean: -4 }, impact: true },
    { label: 'DISSOLVE', pose: { lean: -3, squash: 5, alpha: 0.45 }, dissolve: true },
  ]),
  hopper: Object.freeze([
    { label: 'IDLE', pose: {} },
    { label: 'HOP', pose: { lean: 2 } },
    { label: 'COIL A', pose: { squash: 2 }, tell: true },
    { label: 'COIL B', pose: { squash: 3 }, tell: true },
    { label: 'STRIKE', pose: { lean: 4, squash: 1, shift: 2 } },
    { label: 'HITSTOP', pose: { lean: 4, shift: 2 }, impact: true },
    { label: 'HURT', pose: { lean: -4 }, impact: true },
    { label: 'DISSOLVE', pose: { squash: 5, alpha: 0.45 }, dissolve: true },
  ]),
  boss: Object.freeze([
    { label: 'IDLE', pose: {} },
    { label: 'WEIGHT STEP', pose: { lean: 1, squash: 1, stretchX: 1 }, dust: true },
    { label: 'WIND-UP A', pose: { lean: -4, squash: 6, stretchX: 5, shift: -1 }, tell: true },
    { label: 'WIND-UP B', pose: { lean: -5, squash: 7, stretchX: 6, shift: 1 }, tell: true },
    { label: 'ATTACK', pose: { lean: 11, stretchX: 10, stretchY: 3, shift: 6 }, shockwave: true },
    { label: 'IMPACT', pose: { lean: 8, stretchX: 7, shift: 4 }, impact: true, shockwave: true },
    { label: 'HURT', pose: { lean: -4, shift: -2 }, impact: true },
    { label: 'DEATH', pose: { lean: -6, squash: 40, stretchX: 12, alpha: 0.36 }, dissolve: true },
  ]),
});

function proofCharacter(kind) {
  if (kind === 'hero') return { asset: playerStripAssetId('idle'), fallback: PLAYER_R };
  if (kind === 'hopper') return { asset: 'enemy_hopper', fallback: HOPPER_R };
  if (kind === 'boss') return { asset: 'boss', fallback: BOSS_R };
  return { asset: 'enemy_walker', fallback: WALKER_R };
}

function drawProofBurst(ctx, x, y, facing, dissolve = false) {
  ctx.fillStyle = dissolve ? PALETTE['g'] : PALETTE['5'];
  for (let i = 0; i < 7; i++) {
    const dx = dissolve ? ((i * 5) % 11) - 5 : facing * (5 + (i % 3) * 3);
    const dy = dissolve ? -((i * 7) % 22) : -5 + i * 2;
    ctx.fillRect(Math.round(x + dx), Math.round(y + dy), i % 3 === 0 ? 2 : 1, 1);
  }
}

function drawProofDust(ctx, x, y, facing) {
  ctx.fillStyle = PALETTE['7'];
  ctx.fillRect(Math.round(x - facing * 2), Math.round(y - 1), 4, 1);
  ctx.fillRect(Math.round(x - facing * 5), Math.round(y - 2), 2, 1);
  ctx.fillStyle = PALETTE['4'];
  ctx.fillRect(Math.round(x - facing * 7), Math.round(y - 3), 1, 1);
}

/** Proof-only renderer for the operator certification strips. It uses the same curated assets,
 *  integer pose compositor, arc, tell, impact, and contact math as the live stage renderer. */
function drawAnimationProofStrip(canvas, kind) {
  const frames = AR3B_STRIP_FRAMES[kind];
  if (!canvas || !frames) throw new Error(`unknown animation strip kind: ${kind}`);
  canvas.width = 640;
  canvas.height = 132;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = PALETTE['0'];
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = PALETTE['1'];
  ctx.fillRect(0, 17, canvas.width, 99);
  drawPixelText(ctx, `${kind.toUpperCase()} ACTION STRIP · AR3B`, 8, 12, PALETTE['5']);
  const surfaceY = 96;
  const cellW = 80;
  const base = proofCharacter(kind);
  LAST_ANIMATION_CONTACTS = [];
