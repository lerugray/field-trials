<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">LINES OF ADVANCE — chess-like piece proof</title>
  <desc id="desc">All six unit classes and the arsenal mark for North and South.</desc>
  <style>
    .bg{fill:#f4f1ea}.ink{fill:#1a1a1a}.muted{fill:#6b6b6b}.rule{stroke:#c4c0b5}
    .label{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
    .north{--piece:#b83c3c}.south{--piece:#2c2c2c}.disc{fill:var(--piece);stroke:#1a1a1a;stroke-width:1.2}.mark{fill:#f4f1ea}
    .arsenal{fill:var(--piece)}
    .route{fill:none;stroke:#3a7ca5;stroke-width:5;stroke-linecap:round}.offline{stroke:#d95d39;stroke-width:6;stroke-linecap:round}.offline-dot{fill:#d95d39;stroke:#f4f1ea;stroke-width:3}
  </style>
  <defs>
    <g id="disc"><circle class="disc" r="35"/></g>
    <g id="infantry"><use href="#disc"/><circle class="mark" cy="-15" r="9"/><path class="mark" d="M-10 18Q0-4 10 18ZM-18 20H18V27H-18Z"/></g>
    <g id="cavalry"><use href="#disc"/><path class="mark" d="M-18 25H22L16 15Q20-6 2-20L5-7L-8-14L-20 8L-6 4Q2 10-5 21Z"/></g>
    <g id="artillery"><use href="#disc"/><path class="mark" d="M-22 22H22V28H-22ZM-16 18V-2H16V18ZM-20-6H20V-18H12V-10H4V-18H-4V-10H-12V-18H-20Z"/></g>
    <g id="mounted-artillery"><use href="#artillery"/><path class="mark" d="M-6-27L0-34L6-27L0-20Z"/></g>
    <g id="relay"><use href="#disc"/><path class="mark" d="M-18 25H18V18H11L7-6H-7L-11 18H-18ZM-3-10H3V-30H-3ZM-11-23V-17H11V-23Z"/></g>
    <g id="mounted-relay"><use href="#relay"/><path class="mark" d="M-7-31L0-38L7-31L0-24Z"/></g>
    <g id="arsenal"><path class="arsenal" d="M-32 29H32V18H24V-18H14V-7H5V-18H-5V-7H-14V-18H-24V18H-32Z"/></g>
  </defs>
  <rect class="bg" width="1120" height="390"/>
  <text class="ink label" x="40" y="42" style="font-size:22px;letter-spacing:2px">CHESS-LIKE</text>
  <text class="muted small" x="40" y="66">RENDER PROOF · 2026-08-08 · ALL TYPES / BOTH SIDES</text>
  <line class="rule" x1="40" y1="84" x2="1080" y2="84"/>
  <text class="ink label" x="40" y="157">NORTH</text>
  <text class="ink label" x="40" y="287">SOUTH</text>
  <path class="route" d="M155 145H1055M155 275H1055"/>
  <g class="north">
    <g transform="translate(210 145)"><use href="#infantry"/></g>
    <g transform="translate(345 145)"><use href="#cavalry"/></g>
    <g transform="translate(480 145)"><use href="#artillery"/></g>
    <g transform="translate(615 145)"><use href="#mounted-artillery"/></g>
    <g transform="translate(750 145)"><use href="#relay"/></g>
    <g transform="translate(885 145)"><use href="#mounted-relay"/></g>
    <g transform="translate(1020 145)"><use href="#arsenal"/></g>
  </g>
  <g class="south">
    <g transform="translate(210 275)"><use href="#infantry"/></g>
    <g transform="translate(345 275)"><use href="#cavalry"/></g>
    <g transform="translate(480 275)"><use href="#artillery"/></g>
    <g transform="translate(615 275)"><use href="#mounted-artillery"/></g>
    <g transform="translate(750 275)"><use href="#relay"/></g>
    <g transform="translate(885 275)"><use href="#mounted-relay"/></g>
    <g transform="translate(1020 275)"><use href="#arsenal"/></g>
  </g>
  <path class="offline" d="M858 248L912 302"/><circle class="offline-dot" cx="916" cy="244" r="9"/>
  <g class="muted small" text-anchor="middle">
    <text x="210" y="365">INFANTRY</text><text x="345" y="365">CAVALRY</text>
    <text x="480" y="365">FOOT ART.</text><text x="615" y="365">MOUNTED ART.</text>
    <text x="750" y="365">FOOT RELAY</text><text x="885" y="365">MOUNTED RELAY</text>
    <text x="1020" y="365">ARSENAL</text>
  </g>
</svg>
